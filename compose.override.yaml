###> doctrine/doctrine-bundle ###
  database:
    restart: unless-stopped
    image: mysql:${MYSQL_VERSION:-8.0.32}
    ports:
      - "3306"
    environment:
      TZ: Europe/Paris
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beaupeyrat_mgmt}
      # MYSQL_ROOT_PASSWORD/MYSQL_USER/MYSQL_PASSWORD are credential-shaped - deliberately not
      # declared here so this file never carries a default or hardcoded value (this previously had
      # MYSQL_ROOT_PASSWORD hardcoded to "root", and a typo'd "PMYSQL_USER" key that meant the
      # database never actually received a properly-named MYSQL_USER var - both fixed by removing
      # the compose-level substitution entirely). Supplied via env_file: .env.dev.local
      # (compose.override.yaml, dev) or as required real env vars (compose.prod.yaml, prod).
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    # Injects MYSQL_ROOT_PASSWORD/MYSQL_USER/MYSQL_PASSWORD - see compose.yaml's comment on why
    # these are never defaulted/hardcoded there.
    env_file:
      - .env.dev.local
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###


###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - database
    environment:
      PMA_HOST: database
    # Injects MYSQL_ROOT_PASSWORD (previously hardcoded here to "password", which never actually
    # matched the database service's real root password - fixed by sourcing both from the same
    # file).
    env_file:
      - .env.dev.local
    ports:
      - "8080:80"

  # Local stand-in for the corporate LDAP server, dev-only (never built/started in prod).
  # Reachable from the php container as ldap://openldap:1389
  openldap:
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    restart: unless-stopped
    environment:
      LDAP_ADMIN_USERNAME: admin
      LDAP_ROOT: dc=beaupeyrat,dc=lan
      # Directory tree (org units, groups, users) is seeded from ./frankenphp/ldap/*.ldif
      # instead of the simple LDAP_USERS/LDAP_GROUP vars, which can't express per-user
      # multi-group membership. Only applied on a fresh/empty ldap_data volume.
      LDAP_CUSTOM_LDIF_DIR: /ldifs
    # Injects LDAP_ADMIN_PASSWORD - see compose.yaml's comment on why this is never
    # defaulted/hardcoded there.
    env_file:
      - .env.dev.local
    volumes:
      - ldap_data:/bitnami/openldap
      - ./frankenphp/ldap:/ldifs:ro
    healthcheck:
      # CMD-SHELL (not exec-array CMD) so $LDAP_ADMIN_PASSWORD is expanded by the container's own
      # shell at runtime from the env_file-injected value, not by docker-compose at parse time.
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:1389 -D cn=admin,dc=beaupeyrat,dc=lan -w \"$$LDAP_ADMIN_PASSWORD\" -b dc=beaupeyrat,dc=lan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Virus scanning, OPT-IN in dev (App\Service\AntivirusScanner). Start it with
  #
  #   docker compose --profile antivirus up -d clamav
  #
  # and put ANTIVIRUS_DSN=clamav://clamav:3310 in .env.dev.local. Without both, scanning is simply
  # disabled - which is the normal state of dev and of CI, and a deliberately different state from
  # "configured but unreachable", which refuses every upload.
  #
  # Behind a profile rather than started by default because ClamAV downloads a few hundred
  # megabytes of signatures on first boot and holds roughly 1.5 GB of RAM: nobody should pay that
  # to run the test suite. This is also how the EICAR test string gets exercised against a real
  # clamd rather than against a stub.
  clamav:
    image: clamav/clamav:1.4
    # The official ClamAV images publish **amd64 only** - there is no arm64 manifest for any tag.
    # Pinned explicitly so an Apple Silicon dev machine runs it under emulation instead of failing
    # the pull with "no matching manifest for linux/arm64/v8". Slow to start there (measured: a few
    # minutes for clamd to come up), which is another reason this sits behind a profile. The
    # production host is amd64, so compose.prod.yaml needs no pin.
    platform: linux/amd64
    profiles: [antivirus]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

  # Stand-in Proxmox VE API for the console at /infrastructure, reachable from the php container at
  # https://proxmox-mock:8006 - see docker/proxmox-mock/README.md for the credentials to paste into
  # « Déclarer un hôte ».
  #
  # There is no real Proxmox here and there cannot be: Proxmox VE is a bare-metal hypervisor, not
  # an image. What the console needs to be developed against is not a hypervisor but *something
  # that speaks /api2/json*, so that is what this serves - over TLS, with a small inventory whose
  # machines really do start and stop and whose tasks really do take a couple of seconds. Same
  # spirit as Mailpit standing in for SMTP.
  #
  # Plain python:3.13-slim with a bind-mounted script: no image to build, no dependency to install,
  # and the file is readable by anyone wondering what a payload actually looks like. It is
  # deliberately NOT a Proxmox emulator - anything unimplemented answers 501 saying so.
  #
  # No port is published: nothing outside the compose network has any business reaching it, and the
  # console talks to it from inside the php container anyway.
  proxmox-mock:
    image: python:3.13-slim
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/srv/entrypoint.sh"]
    environment:
      MOCK_HOSTNAME: proxmox-mock
    volumes:
      - ./docker/proxmox-mock:/srv:ro
      - proxmox_mock_certs:/certs

volumes:
  database_data:
  ldap_data:
  clamav_db:
  # Named rather than anonymous so the generated CA - and therefore the PEM pasted into a declared
  # host - survives a `docker compose restart`. A `down -v` regenerates it, which is the moment to
  # re-paste it.
  proxmox_mock_certs:
