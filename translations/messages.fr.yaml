helpArticleBodyFieldLabel: 'Contenu'
helpArticleBodyFieldHelpText: "Réservé aux articles. Les titres de niveau 2 deviennent les étapes et le sommaire « Sur cette page »."
helpLocaleFieldLabel: 'Langue'
