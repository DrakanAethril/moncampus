# Pile technique : dix pastilles, chacune une rubrique, un nom et une description.
technicalStackLanguageName: 'PHP 8.5'
technicalStackLanguageDesc: "En typage strict sur une partie du code. Les types de retour, les propriétés typées et les énumérations sont utilisés partout où ils apportent une garantie."
technicalStackFrameworkName: 'Symfony 8.1'
technicalStackFrameworkDesc: "Fournit la structure et les briques communes — routage, injection de dépendances, sécurité, formulaires — pour que le code écrit soit celui du métier et non celui de la plomberie."
technicalStackPersistenceName: 'MySQL 8 · Doctrine ORM 3'
technicalStackPersistenceDesc: "Un ORM traduit les objets PHP en lignes de tables et réciproquement, ce qui permet d'écrire des règles métier sans écrire de SQL à la main."
technicalStackServerName: 'FrankenPHP'
technicalStackServerDesc: "Un serveur écrit en Go qui embarque PHP et Caddy dans un seul processus. Il remplace le couple classique nginx + PHP-FPM."
technicalStackFrontName: 'Twig · Hotwired'
technicalStackFrontDesc: "Twig pour les gabarits côté serveur, Turbo et Stimulus pour le comportement côté navigateur. Aucun cadriciel monopage : le HTML est produit par le serveur."
technicalStackDirectoryName: 'LDAP'
technicalStackDirectoryDesc: "Les comptes, les groupes et les droits viennent de l'annuaire de l'établissement. L'application ne les invente pas."
technicalStackServicesName: 'Mercure · Gotenberg'
technicalStackServicesDesc: 'Mercure diffuse le temps réel, Gotenberg rend les PDF depuis du HTML.'
technicalStackCloudTerm: 'Services cloud'
technicalStackCloudName: 'AWS'
technicalStackCloudDesc: 'S3 (fichiers), SES et SQS (courrier), IAM (comptes et droits d’accès aux ressources), CloudFront (diffusion et distribution des fichiers).'
technicalStackVersioningTerm: 'Versionnement'
technicalStackVersioningName: 'GitHub'
technicalStackVersioningDesc: 'Dépôt public, branches protégées, intégration continue et déploiement sont pilotés depuis la forge.'
technicalStackMobileTerm: 'Mobile'
technicalStackMobileName: 'Flutter'
technicalStackMobileDesc: "Deux applications mobiles consomment l'API JSON, qui partage la base et les règles métier de l'application web."

# Le trajet d'une requête : cinq étapes numérotées.
technicalJourney1Title: 'Entrée'
technicalJourney1Text: "Caddy reçoit la requête HTTPS et la confie à PHP. Un unique fichier d'entrée reçoit toutes les URL du site : c'est le patron « contrôleur frontal »."
technicalJourney1Path: 'public/index.php'
technicalJourney2Title: 'Sécurité'
technicalJourney2Text: "Le pare-feu identifie l'utilisateur à partir de sa session, puis les règles d'accès vérifient que son rôle a le droit d'atteindre cette URL."
technicalJourney2Path: 'security.yaml + voteurs'
technicalJourney3Title: 'Routage'
technicalJourney3Text: "Le routeur associe l'URL à une méthode de contrôleur et en extrait les paramètres. Le conteneur construit les objets dont elle a besoin."
technicalJourney3Path: 'src/Controller/'
technicalJourney4Title: 'Métier'
technicalJourney4Text: "Le contrôleur délègue le travail à des services, qui interrogent la base via les repositories et manipulent des entités. Rien n'est écrit tant qu'un flush n'a pas été demandé."
technicalJourney4Path: 'src/Service/ · src/Repository/'
technicalJourney5Title: 'Rendu'
technicalJourney5Text: "Le gabarit Twig produit le HTML, échappé par défaut, et la réponse repart. Côté navigateur, Turbo remplace le corps de la page sans rechargement complet."
technicalJourney5Path: 'templates/ + Turbo'

