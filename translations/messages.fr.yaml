# Écran « Description technique » (App\Controller\TechnicalController) : la fiche technique de
# l'application, écrite pour les étudiants de l'établissement — le BTS SIO y est préparé, d'où le
# découpage tronc commun / SLAM / SISR. Tous les chiffres sont mesurés par
# App\Service\TechnicalProfile, jamais saisis ici.
technicalPageHeading: 'Description technique'
technicalLedeText: "MonCampus est une application de gestion de campus, à dominante pédagogique : emploi du temps, cahier de texte, travaux à faire, carnet de notes, progressions, quiz, espaces de cours et wiki. Elle ne s'y limite pas — suivi de l'alternance, courrier des élèves, annuaire, base documentaire, prêt de matériel, support et courses d'orientation en font aussi partie. Son code source est public et sous licence libre : cette page décrit ce qu'il y a dedans, pour que les étudiants qui l'utilisent tous les jours puissent aussi l'étudier. Le découpage suit celui du référentiel du BTS SIO : un tronc commun, puis ce qui relève de l'option SLAM et ce qui relève de l'option SISR."
technicalMeasuredNoticeText: "Les chiffres de cette page sont comptés dans l'application au moment où vous l'affichez — entités déclarées à Doctrine, routes du routeur compilé, fichiers réellement déployés. Deux exceptions, mesurées le %date% : le nombre de commits et le nombre de tests, l'historique Git et le dossier des tests n'étant pas embarqués dans l'image de production."

