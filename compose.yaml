---
services:
  php:
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      # DATABASE_URL and MERCURE_PUBLISHER_JWT_KEY/MERCURE_SUBSCRIBER_JWT_KEY/MERCURE_JWT_SECRET are
      # credential-shaped (the Mercure keys are read directly by Caddy's Mercure module from the
      # container's OS environment, not just by PHP) - deliberately not declared here so this file
      # never carries a default. Supplied via env_file: .env.dev.local (compose.override.yaml, dev)
      # or as required real env vars (compose.prod.yaml, prod).
      # Not a secret - a fixed internal Docker-network hostname defined by the `gotenberg` service
      # right below, same treatment as MERCURE_URL above.
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  # Renders the Livret Alternant booklet to PDF (App\Service\GotenbergClient) - internal-network
  # only (no `ports:`), reachable from `php` at GOTENBERG_URL above. Runs in dev and prod alike, no
  # secrets/dev-only tooling needed, unlike database/openldap/minio in compose.override.yaml.
  gotenberg:
    image: gotenberg/gotenberg:8.16
    restart: unless-stopped

  # Consomme la file SQS des mails entrants du Courrier école
  # (App\Command\ConsumeInboundMailCommand) - le premier processus long de cette application, d'où
  # les précautions ci-dessous. L'image et les identifiants viennent des surcouches dev/prod, comme
  # pour `php`.
  #
  # `sh -c` n'est pas une coquetterie : frankenphp/docker-entrypoint.sh ne déclenche son bloc
  # d'initialisation (composer install, attente de la base, *migrations*) que si le premier argument
  # est `php`, `bin/console` ou `frankenphp`. Il faut justement l'éviter ici - c'est le conteneur
  # `php` qui applique les migrations, et deux conteneurs les appliquant en parallèle au démarrage
  # se marcheraient dessus. Le `depends_on` sur son état de santé garantit d'ailleurs qu'elles sont
  # déjà passées quand le worker démarre.
  #
  # La commande sort d'elle-même au bout de son --time-limit et `restart: unless-stopped` la
  # relance : c'est ce qui borne la fuite mémoire d'un processus PHP long. Une interruption en plein
  # traitement est sans danger - le message SQS n'ayant pas été supprimé, il sera relivré.
  worker_mail_inbound:
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
    command: ['sh', '-c', 'php bin/console app:mail:consume-inbound']
    depends_on:
      php:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
