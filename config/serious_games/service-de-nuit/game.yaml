# Service de nuit: PHP for beginners, BTS SIO 1 - the sixth game of the « scénario » mechanic
# (design/validated/serious-games-service-de-nuit.md).
#
# Read by `app:serious-games:sync`, which adds the nights of `tickets/*.yaml` under `scenario.tickets`
# and builds `chapters` from the acts, so that the screens common to every game read a night as a unit
# and an act as a chapter. **The right answers live in those files and nowhere in the game's package**
# (public/serious-games/service-de-nuit/), which holds the PHP interpreter, the site each night starts
# from, the visitors and their checks (the hidden ones included), Augustin's notebooks, the written hints
# and the scenes. A ticket is a « nuit » in the game's words.
#
# What this game adds to the mechanic, without touching the server: the student's site is one, from the
# first night to the last, and it travels as the game's display state (saveProgress, within the scenario's
# 256 KB) - never as an answer, which stays {passed, failed}. Trying the site on the visible visitors is free
# and stays in the frame; only « Servir la nuit » is a delivery.
slug: service-de-nuit
title: "Service de nuit"
pitch: "Veilleur·se de nuit d'un petit hôtel, reprendre le site PHP qu'Augustin a laissé et servir chaque nuit des visiteurs, certains cachés : echo, date(), conditions, boucles, tableaux, fonctions, formulaires."
subjects: [Informatique]
levels: [BTS SIO 1]
unit_label: nuits
mechanic: scenario
# The kinds of step of the scenario: a site served to the visitors by the game, an explanation or a
# « veille » to choose, a line to designate in Augustin's code, an order.
answer_kinds: [fix, choice, line, order]
version: 1.0.0
published: false

words:
  unit: [nuit, nuits]
  chapter: [acte, actes]
  lit: [servie, servies]
  unlit: [ouverte, ouvertes]
  level: étoiles
  skill: notion
  dim_filter: Beaucoup d'aide

scenario:
  # A night keeps the version it was started with; raise it when a step changes.
  version: 1
  # One night at a time: the site is one, and each night builds on the one before.
  capacity: 1
  # Who answers a wrong step that names nobody.
  helper: sami
  # No password: the « pied de page » gathers five clues, the last night tells who the client of the 12 is.
  password: []
  # « Recommencer depuis le début » on the title screen, before the end too, like Black-out.
  restart_anytime: true
  acts:
    - { n: 1, title: "La loge", tools: [site] }
    - { n: 2, title: "L'horloge", tools: [site] }
    - { n: 3, title: "Les couloirs", tools: [site] }
    - { n: 4, title: "Les étages", tools: [site] }
    - { n: 5, title: "La chambre 12", tools: [site] }

grades:
  - [0, "Veilleur·se stagiaire"]
  - [4, "Veilleur·se"]
  - [8, "Veilleur·se de confiance"]
  - [12, "Chef·fe de loge"]
  - [17, "Gardien·ne des Quatre-Vents"]

rewards:
  # Brass once the last night is served (N17); silver at two thirds of the nights with three stars,
  # gold at 15. Thresholds to review after a first promotion.
  trophy:
    code: cle-12
    label: La clé de la 12
    lore: "La clé de la chambre 12, sur son étiquette rose, qu'Augustin a rendue un jeudi à 23 h 12 à qui avait appris à lire son site."
    silver_at: 11
    gold_at: 15
  pin:
    code: pin-neon
    label: Épinglette Néon
  # One card per act done.
  cards: true

# Played on a computer only: the code and the page side by side need 1 100 px. On a narrower screen the
# catalogue says so instead of opening the game.
desktop_only: true

thumbnail:
  background: "radial-gradient(ellipse at 70% 120%, rgba(255, 181, 71, .35), transparent 60%), repeating-linear-gradient(180deg, rgba(255, 255, 255, .04) 0 1px, transparent 1px 14px), linear-gradient(180deg, #1B1729 0%, #14111F 100%)"
  font: "'Bungee', 'Trebuchet MS', sans-serif"
  style: normal
  weight: 400
  color: "#FFE3EA"
