# Service de nuit - acte 2 : L'horloge.
#
# The server half of the nights (design/validated/serious-games-service-de-nuit.md §3): the graph, the
# requests, the steps with their right answers and the misconception of each wrong one, Sami's guided
# questions, the clue closing gives. The game half (the site to start from, the visitors and their
# checks, the hidden ones, the notebooks, the written hints, the scenes) is public/serious-games/
# service-de-nuit/steps/acte2.js. Converted from the prototype's host/scenario/acte2.js by
# tool/to-yaml.js; `hints` counts the written hints the game holds after the guided questions. A ticket
# is a « nuit » in the game's words.
tickets:
  -
    id: N07
    act: 2
    after: [N06]
    course: 'PHP · if et else'
    requester: mireille
    kind: demande
    priority: haute
    category: 'L''horloge › Bonjour, bonsoir'
    title: 'Bonjour ou bonsoir'
    request: 'À la place de « Bienvenue » : « Bonjour » avant 18 h, « Bonsoir » à partir de 18 h.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Choisis le mot selon l''heure de la visite : « Bonjour » avant 18 h, « Bonsoir » à partir de 18 h.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: 'Bonne nuit parmi nous.', ok: true, reaction: { who: sami, expr: sourire, text: '1 n''est pas plus grand que 1 : la condition est fausse, c''est le else qui parle.' } }
          - { text: 'Bon séjour parmi nous.', misconception: superieur-ou-egal, reaction: { who: sami, expr: sourcil, text: '$nuits > 1, avec $nuits qui vaut 1 : c''est faux. Il aurait fallu >= pour que ce soit vrai.' } }
          - { text: 'Bon séjour parmi nous. Bonne nuit parmi nous.', misconception: deux-branches, reaction: { who: sami, expr: sourcil, text: 'if et else ne s''exécutent jamais tous les deux : c''est l''un ou l''autre.' } }
          - { text: 'Rien : la condition est fausse.', misconception: else-ignore, reaction: { who: sami, expr: sourcil, text: 'Quand la condition est fausse, c''est le bloc else qui s''exécute.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'À 18 h 30, date(''G'') vaut 18. Quelle condition est vraie pour « Bonjour », et seulement pour lui ?'
        options:
          - { text: 'date(''G'') < 18', ok: true }
          - { text: 'date(''G'') <= 18', misconception: borne-incluse, reaction: { who: sami, expr: sourcil, text: 'À 18 h 30, 18 <= 18 est vrai : « Bonjour » à l''apéritif.' } }
          - { text: 'date(''G'') > 18', misconception: condition-inversee, reaction: { who: sami, expr: sourcil, text: 'C''est vrai le soir, pas le jour. Et à 18 h pile, ce n''est même pas vrai.' } }
    hints: 2
  -
    id: N08
    act: 2
    after: [N07]
    course: 'PHP · elseif'
    requester: josette
    kind: demande
    priority: haute
    category: 'L''horloge › Le petit-déjeuner'
    title: 'Le petit-déjeuner'
    request: 'Avant 7 h : « Le petit-déjeuner ouvre à 7 h. » De 7 h à 10 h : « Le petit-déjeuner est servi jusqu''à 10 h. » Après : « Le petit-déjeuner est servi demain dès 7 h. »'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Sous l''accueil, affiche la bonne des trois phrases de Josette selon l''heure.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: 'après-midi', ok: true, reaction: { who: sami, expr: sourire, text: '14 < 18 est vrai : PHP s''arrête là. La branche « goûter » ne sera jamais lue, à aucune heure.' } }
          - { text: 'après-midi goûter', misconception: elseif-toutes, reaction: { who: sami, expr: sourcil, text: 'Une seule branche s''exécute : la première vraie.' } }
          - { text: 'goûter', misconception: elseif-precise, reaction: { who: sami, expr: sourcil, text: 'PHP ne cherche pas la plus précise : il prend la première vraie, de haut en bas.' } }
          - { text: 'soir', misconception: else-defaut, reaction: { who: sami, expr: sourcil, text: 'Le else ne sert que si aucune condition n''est vraie. Ici, 14 < 18.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'À 6 h 30, avec « if ($heure < 10) … elseif ($heure < 7) … », quelle phrase s''affiche ?'
        options:
          - { text: '« servi jusqu''à 10 h » : 6 < 10 est vrai, PHP n''ira pas plus loin.', ok: true }
          - { text: '« ouvre à 7 h » : c''est la condition la plus juste.', misconception: elseif-precise, reaction: { who: sami, expr: sourcil, text: 'PHP lit de haut en bas : la première condition vraie gagne.' } }
          - { text: 'Les deux phrases.', misconception: elseif-toutes, reaction: { who: sami, expr: sourcil, text: 'elseif veut dire « sinon, si » : une seule branche.' } }
      -
        id: g2
        kind: choice
        prompt: 'Comment écrire « jusqu''à » dans un texte entre guillemets simples ?'
        options:
          - { text: '''Le petit-déjeuner est servi jusqu\''à 10 h.''', ok: true }
          - { text: '''Le petit-déjeuner est servi jusqu''à 10 h.''', misconception: apostrophe-ferme, reaction: { who: sami, expr: sourcil, text: 'L''apostrophe ferme le texte au milieu : PHP lit « jusqu », puis ne comprend plus rien.' } }
          - { text: '''Le petit-déjeuner est servi jusqu à 10 h.''', misconception: apostrophe-supprimee, reaction: { who: sami, expr: sourcil, text: 'Josette tient à son apostrophe. Mets un \ devant, ou des guillemets doubles autour du texte.' } }
    hints: 2
  -
    id: N09
    act: 2
    after: [N08]
    course: 'PHP · et, ou'
    requester: josette
    kind: demande
    priority: haute
    category: 'L''horloge › Le week-end'
    title: 'Le week-end'
    request: 'Le samedi et le dimanche, je sers jusqu''à 11 h : « Le petit-déjeuner est servi jusqu''à 11 h. »'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Le week-end avant 11 h, affiche « Le petit-déjeuner est servi jusqu''à 11 h. »'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Dimanche ($jour vaut 7) à midi : que lit le client ?'
        view: veille
        options:
          - { text: 'Fermé', ok: true, reaction: { who: sami, expr: sourire, text: 'C''est bien le week-end, mais 12 < 11 est faux : avec &&, il faut les deux.' } }
          - { text: 'Servi', misconception: et-ou, reaction: { who: sami, expr: sourcil, text: '&& demande que les deux soient vraies. Celui qui se contente d''une seule, c''est ||.' } }
          - { text: 'Servi Fermé', misconception: deux-branches, reaction: { who: sami, expr: sourcil, text: 'if ou else, jamais les deux.' } }
          - { text: 'Rien : la condition est fausse.', misconception: else-ignore, reaction: { who: sami, expr: sourcil, text: 'Quand la condition est fausse, c''est le bloc else qui s''exécute.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Que vaut date(''N'') un samedi ? Et un dimanche ?'
        options:
          - { text: '6 et 7.', ok: true }
          - { text: '« Saturday » et « Sunday ».', misconception: date-N-texte, reaction: { who: sami, expr: sourcil, text: 'Ça, c''est date(''l''). N donne un chiffre, de 1 (lundi) à 7 (dimanche).' } }
          - { text: '0 et 1.', misconception: date-w-N, reaction: { who: sami, expr: sourcil, text: 'Tu penses à date(''w''), où dimanche vaut 0. Avec N, lundi vaut 1 et dimanche 7.' } }
      -
        id: g2
        kind: choice
        prompt: 'Quelle condition dit « le week-end, avant 11 h » ?'
        options:
          - { text: '$jour >= 6 && $heure < 11', ok: true }
          - { text: '$jour >= 6 || $heure < 11', misconception: et-ou, reaction: { who: sami, expr: sourcil, text: 'Avec ||, un mardi à 8 h suffirait : il faut les deux à la fois.' } }
          - { text: '$jour == 6 && $heure < 11', misconception: samedi-seul, reaction: { who: sami, expr: sourcil, text: 'Le dimanche, $jour vaut 7.' } }
    hints: 2
  -
    id: N10
    act: 2
    after: [N09]
    course: 'PHP · et, ou'
    requester: mireille
    kind: demande
    priority: haute
    category: 'L''horloge › La nuit'
    title: 'Bonne nuit'
    request: 'Entre 23 h et 5 h, l''accueil doit dire « Bonne nuit » au lieu de « Bonsoir ».'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'De 23 h à 5 h (5 h exclue), dis « Bonne nuit » au lieu de « Bonsoir ».'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Une ancienne version de la page. À 2 h du matin, que lit le client ?'
        view: veille
        options:
          - { text: 'Bonsoir', ok: true, reaction: { who: sami, expr: sourcil, text: 'Une heure ne peut pas être à la fois >= 23 et < 5 : avec &&, c''est toujours faux. Il fallait ||.' } }
          - { text: 'Bonne nuit', misconception: et-ou, reaction: { who: sami, expr: sourcil, text: 'Pour que && soit vrai, il faut les deux : 2 >= 23 est faux. Il fallait ||.' } }
          - { text: 'Bonne nuit Bonsoir', misconception: deux-branches, reaction: { who: sami, expr: sourcil, text: 'if ou else, jamais les deux.' } }
          - { text: 'Une erreur : on ne peut pas mettre deux conditions dans un if.', misconception: une-condition, reaction: { who: sami, expr: sourcil, text: 'On peut en combiner autant qu''on veut, avec && et ||.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Quelle condition est vraie entre 23 h et 5 h ?'
        options:
          - { text: '$heure >= 23 || $heure < 5', ok: true }
          - { text: '$heure >= 23 && $heure < 5', misconception: et-ou, reaction: { who: sami, expr: sourcil, text: 'Aucune heure n''est à la fois après 23 et avant 5 : && serait toujours faux.' } }
          - { text: '$heure > 23 || $heure < 5', misconception: borne-exclue, reaction: { who: sami, expr: sourcil, text: 'À 23 h 30, $heure vaut 23 : 23 > 23 est faux.' } }
    hints: 2
