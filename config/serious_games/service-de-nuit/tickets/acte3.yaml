# Service de nuit - acte 3 : Les couloirs.
#
# The server half of the nights (design/validated/serious-games-service-de-nuit.md §3): the graph, the
# requests, the steps with their right answers and the misconception of each wrong one, Sami's guided
# questions, the clue closing gives. The game half (the site to start from, the visitors and their
# checks, the hidden ones, the notebooks, the written hints, the scenes) is public/serious-games/
# service-de-nuit/steps/acte3.js. Converted from the prototype's host/scenario/acte3.js by
# tool/to-yaml.js; `hints` counts the written hints the game holds after the guided questions. A ticket
# is a « nuit » in the game's words.
tickets:
  -
    id: N11
    act: 3
    after: [N10]
    course: 'PHP · la boucle for'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les couloirs › Les chambres'
    title: 'Quarante chambres'
    request: 'L''hôtel monte jusqu''à 40 chambres, mais pas toutes ouvertes en même temps. La page doit lister les chambres ouvertes, de la 1 à la dernière.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Liste les chambres de 1 à $ouvertes avec une boucle for, sans écrire chaque ligne à la main.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '1 2 3', ok: true, reaction: { who: sami, expr: sourire, text: '$i < 4 : la boucle s''arrête avant 4.' } }
          - { text: '1 2 3 4', misconception: borne-incluse, reaction: { who: sami, expr: sourcil, text: '< 4 exclut 4. Pour l''inclure, il faudrait <= 4.' } }
          - { text: '0 1 2 3', misconception: depart-zero, reaction: { who: sami, expr: sourcil, text: '$i commence à 1 : c''est ce que dit $i = 1.' } }
          - { text: '4', misconception: boucle-derniere-valeur, reaction: { who: sami, expr: sourcil, text: 'echo est dans la boucle : il écrit à chaque tour, pas seulement à la fin.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Quelle boucle écrit de « Chambre 1 » à « Chambre $ouvertes » ?'
        options:
          - { text: 'for ($i = 1; $i <= $ouvertes; $i++)', ok: true }
          - { text: 'for ($i = 1; $i < $ouvertes; $i++)', misconception: borne-exclue, reaction: { who: sami, expr: sourcil, text: 'Avec <, la dernière chambre manque.' } }
          - { text: 'for ($i = 0; $i <= $ouvertes; $i++)', misconception: depart-zero, reaction: { who: sami, expr: sourcil, text: 'Une chambre 0 de trop.' } }
          - { text: 'for ($i = 1; $i <= 40; $i++)', misconception: borne-en-dur, reaction: { who: sami, expr: sourcil, text: 'Seules les ouvertes s''affichent : 38 certains soirs.' } }
    hints: 2
  -
    id: N12
    act: 3
    after: [N11]
    course: 'PHP · la boucle while'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les couloirs › La navette'
    title: 'La navette de la gare'
    request: 'La navette part à 5 h 40, puis toutes les 25 minutes, jusqu''à minuit. Sur sa page, je veux les départs qui restent aujourd''hui.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Avec une boucle while, liste les départs de la journée qui ne sont pas encore passés.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: 'Une place. Une place. Une place. Complet !', ok: true, reaction: { who: sami, expr: sourire, text: '3, 2, 1 : trois tours. À 0, la condition est fausse.' } }
          - { text: 'Une place. Une place. Complet !', misconception: while-un-de-moins, reaction: { who: sami, expr: sourcil, text: 'Compte les tours : $places vaut 3, puis 2, puis 1. Trois fois vrai.' } }
          - { text: 'Une place. Une place. Une place. Une place. Complet !', misconception: while-un-de-plus, reaction: { who: sami, expr: sourcil, text: 'À 0, 0 > 0 est faux : pas de quatrième tour.' } }
          - { text: 'Une place. Complet !', misconception: while-une-fois, reaction: { who: sami, expr: sourcil, text: 'while recommence tant que sa condition est vraie : ce n''est pas un if.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'À 21 h 10, quel est le prochain départ ?'
        options:
          - { text: '21 h 30.', ok: true }
          - { text: '21 h 35 : 21 h 10 plus 25 minutes.', misconception: navette-depuis-maintenant, reaction: { who: sami, expr: sourcil, text: 'Les départs partent de 5 h 40, pas de l''heure de la visite : 5 h 40, 6 h 05… 21 h 05, 21 h 30.' } }
          - { text: '21 h 05.', misconception: depart-passe, reaction: { who: sami, expr: sourcil, text: 'À 21 h 10, la navette de 21 h 05 est partie.' } }
      -
        id: g2
        kind: choice
        prompt: 'Que doit faire la boucle à chaque tour ?'
        options:
          - { text: 'Écrire le départ s''il n''est pas passé, puis ajouter 25 minutes (25 * 60 secondes).', ok: true }
          - { text: 'Ajouter 25 à $depart.', misconception: secondes-minutes, reaction: { who: sami, expr: sourcil, text: 'mktime() compte en secondes : 25 minutes, c''est 25 * 60.' } }
          - { text: 'Écrire tous les départs, même passés.', misconception: depart-passe, reaction: { who: sami, expr: sourcil, text: 'Mireille ne veut que ceux qui restent, à partir de maintenant.' } }
    hints: 2
  -
    id: N13
    act: 3
    after: [N12]
    course: 'PHP · la boucle while'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les couloirs › La dernière navette'
    title: 'Plus de navette'
    request: 'Après la dernière navette, la page est vide et les clients la croient cassée. Je veux « Plus de navette ce soir. »'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Compte les départs écrits ; s''il n''y en a aucun, écris « Plus de navette ce soir. » sous la liste.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '2 départs', ok: true, reaction: { who: sami, expr: sourire, text: '22, puis 23 : deux tours. À 24, la condition est fausse.' } }
          - { text: '3 départs', misconception: while-un-de-plus, reaction: { who: sami, expr: sourcil, text: 'À 24, 24 < 24 est faux : pas de troisième tour.' } }
          - { text: '1 départs', misconception: while-une-fois, reaction: { who: sami, expr: sourcil, text: 'while recommence tant que sa condition est vraie : ce n''est pas un if.' } }
          - { text: '24 départs', misconception: compteur-confondu, reaction: { who: sami, expr: sourcil, text: '$compte et $depart sont deux variables : c''est $compte qui est écrit.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment savoir, après la boucle, qu''aucun départ n''a été écrit ?'
        options:
          - { text: 'Avec un compteur : $restants = 0 avant, + 1 à chaque départ écrit, puis if ($restants == 0) après.', ok: true }
          - { text: 'En testant $depart après la boucle.', misconception: variable-boucle, reaction: { who: sami, expr: sourcil, text: 'Après la boucle, $depart a toujours dépassé minuit : il ne dit pas si quelque chose a été écrit.' } }
          - { text: 'Avec un else dans la boucle.', misconception: else-boucle, reaction: { who: sami, expr: sourcil, text: 'Le else s''exécuterait à chaque départ passé : le message apparaîtrait des dizaines de fois.' } }
    hints: 2
  -
    id: N14
    act: 3
    after: [N13]
    course: 'PHP · boucles et conditions'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les couloirs › Cour ou rue'
    title: 'Cour ou rue'
    request: 'Les chambres paires donnent sur la cour, les impaires sur la rue. Je veux le lire sur la page : « Chambre 7 : côté rue ».'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Dans la boucle des chambres, écris « côté cour » pour les paires et « côté rue » pour les impaires.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '1 2 [3] 4 5 [6]', ok: true, reaction: { who: sami, expr: sourire, text: '% 3 donne le reste de la division par 3 : 0 pour 3 et 6.' } }
          - { text: '1 2 [3] 4 5 6', misconception: modulo-une-fois, reaction: { who: sami, expr: sourcil, text: 'Le test est refait à chaque tour : 6 % 3 vaut 0 aussi.' } }
          - { text: '[1] 2 3 [4] 5 6', misconception: modulo-quotient, reaction: { who: sami, expr: sourcil, text: '% donne le reste de la division, pas le résultat : 1 % 3 vaut 1.' } }
          - { text: '[3] [6]', misconception: else-oublie, reaction: { who: sami, expr: sourcil, text: 'Les autres nombres passent par le else : ils sont écrits sans crochets.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment savoir si $i est pair ?'
        options:
          - { text: '$i % 2 == 0 : le reste de la division par 2 est nul.', ok: true }
          - { text: '$i / 2 == 0', misconception: modulo-quotient, reaction: { who: sami, expr: sourcil, text: '$i / 2 ne vaut 0 que pour 0. Il faut le reste : %.' } }
          - { text: '$i == 2', misconception: pair-egal-deux, reaction: { who: sami, expr: sourcil, text: 'Ça ne vaut que pour la chambre 2.' } }
    hints: 2
  -
    id: N15
    act: 3
    after: [N14]
    course: 'PHP · boucles et conditions'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les couloirs › La 13'
    title: 'Pas de chambre 13'
    request: 'Il n''y a pas de chambre 13 aux Quatre-Vents. La page doit passer directement de la 12 à la 14.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Saute la chambre 13 avec continue.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '1 2 4 5', ok: true, reaction: { who: sami, expr: sourire, text: 'À 3, continue saute la fin du tour : rien n''est écrit, et la boucle reprend à 4.' } }
          - { text: '1 2', misconception: continue-break, reaction: { who: sami, expr: sourcil, text: 'Ça, c''est break. continue passe au tour suivant.' } }
          - { text: '1 2 3 4 5', misconception: continue-ignore, reaction: { who: sami, expr: sourcil, text: 'continue saute ce qui reste du tour : l''echo n''est pas atteint pour 3.' } }
          - { text: '3', misconception: continue-inverse, reaction: { who: sami, expr: sourcil, text: 'continue saute le tour de 3 : c''est le seul nombre qui n''est pas écrit.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Que fait continue quand $i vaut 13 ?'
        options:
          - { text: 'Il saute la fin de ce tour : rien n''est écrit pour la 13, et la boucle reprend à 14.', ok: true }
          - { text: 'Il arrête la boucle : les chambres après la 13 disparaissent.', misconception: continue-break, reaction: { who: sami, expr: sourcil, text: 'Ça, c''est break. continue passe au tour suivant.' } }
          - { text: 'Il recommence la boucle à 1.', misconception: continue-recommence, reaction: { who: sami, expr: sourcil, text: 'La boucle reprend au tour suivant, à 14, pas au début.' } }
    hints: 2
  -
    id: N16
    act: 3
    after: [N15]
    course: 'PHP · boucles et conditions'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les couloirs › Les travaux'
    title: 'La chambre en travaux'
    request: 'La chambre en travaux, que l''hôtel prépare dans $travaux (0 s''il n''y en a pas), doit s''afficher « Chambre 9 : fermée ».'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Affiche « fermée » pour la chambre $travaux, avant de choisir entre cour et rue.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: 'rue X rue', ok: true, reaction: { who: sami, expr: sourire, text: 'Pour 2, la première condition est vraie : X. La branche « cour » n''est même pas regardée.' } }
          - { text: 'rue cour rue', misconception: elseif-ordre, reaction: { who: sami, expr: sourcil, text: '$i == $travaux est testé en premier : pour 2, c''est lui qui gagne.' } }
          - { text: 'rue X cour rue', misconception: elseif-toutes, reaction: { who: sami, expr: sourcil, text: 'Une seule branche par tour : la première vraie.' } }
          - { text: '1 X 3', misconception: variable-affichee, reaction: { who: sami, expr: sourcil, text: 'echo écrit le texte entre guillemets, pas $i.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Le soir où l''hôtel met la 13 en travaux, que doit afficher la page ?'
        options:
          - { text: 'Rien pour la 13 : elle n''existe pas, travaux ou pas. Le saut passe avant tout le reste.', ok: true }
          - { text: '« Chambre 13 : fermée ».', misconception: ordre-continue, reaction: { who: sami, expr: sourcil, text: 'La 13 n''existe pas : elle ne peut pas être fermée. Le continue doit passer avant le test des travaux.' } }
          - { text: '« Chambre 13 : côté rue ».', misconception: treize-oublie, reaction: { who: sami, expr: sourcil, text: 'Pas de 13 aux Quatre-Vents, jamais.' } }
    hints: 2
  -
    id: N17
    act: 3
    after: [N16]
    course: 'PHP · lire du code'
    requester: sami
    kind: demande
    priority: haute
    category: 'Les couloirs › Le planning du ménage'
    title: 'Lire le code d''Augustin'
    request: 'Augustin affichait le planning du ménage avec ce petit fichier. On le lit ensemble, sans rien changer ?'
    steps:
      -
        id: designer
        kind: line
        label: 'Un mardi à 10 h'
        prompt: 'Clique sur la ligne qui écrit le message affiché un mardi à 10 h.'
        view: menage
        answer: 'Ménage des étages en cours'
        reaction: { who: sami, expr: sourcil, text: 'Pas celle-là. Un mardi, $jour vaut 2 ; à 10 h, $heure vaut 10. Cherche le echo de la branche dont la condition est vraie.' }
      -
        id: quinze
        kind: choice
        label: 'Jeudi, 15 h 30'
        prompt: 'Jeudi à 15 h 30, que lit le client ?'
        view: menage-1530
        options:
          - { text: 'Ménage du rez-de-chaussée en cours.', ok: true, reaction: { who: sami, expr: sourire, text: '$heure vaut 15 : 15 >= 14 et 15 < 16. La troisième branche.' } }
          - { text: 'Ménage des étages en cours.', misconception: heure-intervalle, reaction: { who: sami, expr: sourcil, text: '15 n''est pas entre 9 et 12 : cette branche-là est fausse.' } }
          - { text: 'Pas de ménage en ce moment.', misconception: borne-exclue, reaction: { who: sami, expr: sourcil, text: '15 >= 14 et 15 < 16 : la troisième condition est vraie, le else n''est pas atteint.' } }
          - { text: 'Les deux messages de ménage, l''un sous l''autre.', misconception: elseif-toutes, reaction: { who: sami, expr: sourcil, text: 'if, elseif, elseif, else : une seule branche, la première vraie.' } }
      -
        id: dimanche
        kind: choice
        label: 'Dimanche, 10 h'
        prompt: 'Dimanche à 10 h, que lit le client ?'
        view: menage-dimanche
        options:
          - { text: 'Pas de ménage le dimanche.', ok: true, reaction: { who: sami, expr: sourire, text: 'Le dimanche est testé en premier : la première condition vraie gagne, même s''il est 10 h.' } }
          - { text: 'Ménage des étages en cours.', misconception: elseif-ordre, reaction: { who: sami, expr: sourcil, text: '10 h est bien entre 9 et 12, mais $jour == 7 est testé avant, et c''est vrai.' } }
          - { text: 'Pas de ménage le dimanche. Ménage des étages en cours.', misconception: elseif-toutes, reaction: { who: sami, expr: sourcil, text: 'Une seule branche s''exécute.' } }
          - { text: 'Pas de ménage en ce moment.', misconception: else-defaut, reaction: { who: sami, expr: sourcil, text: 'Le else ne sert que si aucune condition n''est vraie. Ici, la première l''est.' } }
