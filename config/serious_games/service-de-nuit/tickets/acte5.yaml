# Service de nuit - acte 5 : La chambre 12.
#
# The server half of the nights (design/validated/serious-games-service-de-nuit.md §3): the graph, the
# requests, the steps with their right answers and the misconception of each wrong one, Sami's guided
# questions, the clue closing gives. The game half (the site to start from, the visitors and their
# checks, the hidden ones, the notebooks, the written hints, the scenes) is public/serious-games/
# service-de-nuit/steps/acte5.js. Converted from the prototype's host/scenario/acte5.js by
# tool/to-yaml.js; `hints` counts the written hints the game holds after the guided questions. A ticket
# is a « nuit » in the game's words.
tickets:
  -
    id: N24
    act: 5
    after: [N23]
    course: 'PHP · les fonctions'
    requester: sami
    kind: demande
    priority: haute
    category: 'Le comptoir › Une fonction'
    title: 'Une fonction pour les prix'
    request: 'Écrire un prix à la française, on va en avoir besoin partout. Range-le une fois dans une fonction prix().'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'En haut d''accueil.php, écris function prix($montant) qui rend le prix à la française, et sers-t''en pour le total.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '6 / 20', ok: true, reaction: { who: sami, expr: sourire, text: 'Chaque appel donne sa valeur à $n, et return rend son résultat.' } }
          - { text: '3 / 10', misconception: fonction-ignoree, reaction: { who: sami, expr: sourcil, text: 'double(3) ne rend pas 3 : la fonction rend $n * 2.' } }
          - { text: '$n * 2 / $n * 2', misconception: return-texte, reaction: { who: sami, expr: sourcil, text: 'return rend le résultat du calcul, pas le code.' } }
          - { text: '6', misconception: fonction-une-fois, reaction: { who: sami, expr: sourcil, text: 'Une fonction s''appelle autant de fois qu''on veut : chaque appel rend son propre résultat.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Que doit contenir prix($montant) ?'
        options:
          - { text: 'return number_format($montant, 2, '','', '' '') . '' €'';', ok: true }
          - { text: 'echo number_format($montant, 2, '','', '' '') . '' €'';', misconception: return-echo-pareil, reaction: { who: sami, expr: sourcil, text: 'echo écrirait le prix tout de suite, avant le texte qui l''entoure. return le rend à celui qui appelle.' } }
          - { text: 'return number_format($total, 2, '','', '' '') . '' €'';', misconception: parametre-ignore, reaction: { who: sami, expr: sourcil, text: 'Dans la fonction, la valeur s''appelle $montant : c''est elle qu''on reçoit à chaque appel.' } }
    hints: 2
  -
    id: N25
    act: 5
    after: [N24]
    course: 'PHP · les fonctions'
    requester: sami
    kind: demande
    priority: haute
    category: 'Le comptoir › include'
    title: 'Les prix partout'
    request: 'La page des tarifs a besoin de prix() aussi. Plutôt que la recopier, range-la dans fonctions.php, et inclus-la dans les deux pages.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Déplace prix() dans fonctions.php, inclus ce fichier dans accueil.php et tarifs.php, et sers-toi de prix() dans les tarifs.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '62 / 186', ok: true, reaction: { who: sami, expr: sourire, text: 'Sans deuxième argument, $nuits prend sa valeur par défaut : 1.' } }
          - { text: '0 / 186', misconception: parametre-defaut, reaction: { who: sami, expr: sourcil, text: '$nuits = 1 dans la déclaration : c''est la valeur prise quand on ne la donne pas.' } }
          - { text: 'Une erreur : il manque $nuits.', misconception: parametre-obligatoire, reaction: { who: sami, expr: sourcil, text: 'Un paramètre avec une valeur par défaut est facultatif.' } }
          - { text: '62 / 62', misconception: parametre-ignore, reaction: { who: sami, expr: sourcil, text: 'nuitee(62, 3) donne 3 à $nuits : 62 × 3.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment une page se sert-elle des fonctions écrites dans fonctions.php ?'
        options:
          - { text: 'En l''incluant en haut de la page : include ''fonctions.php'';', ok: true }
          - { text: 'Elles sont disponibles partout, automatiquement.', misconception: include-automatique, reaction: { who: sami, expr: sourcil, text: 'Une page ne connaît que ce qu''elle contient et ce qu''elle inclut.' } }
          - { text: 'En recopiant la fonction dans chaque page.', misconception: fonction-copiee, reaction: { who: sami, expr: sourcil, text: 'C''est justement ce qu''on veut éviter. Et deux fois la même fonction, PHP refuse.' } }
    hints: 2
  -
    id: N26
    act: 5
    after: [N25]
    course: 'PHP · formulaires et sécurité'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Le comptoir › Les réservations'
    title: 'Retrouver sa réservation'
    request: 'Sur reservation.php, le client tape son nom ; la page doit répondre « Roux : chambre 12. », ou « Aucune réservation au nom de Dupont. »'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Lis le nom envoyé dans $_GET, cherche-le dans $reservations, et réponds, sans rien afficher avant l''envoi.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Le client ouvre reservation.php?chambre=12. Que lit-il ?'
        view: veille
        options:
          - { text: 'Chambre 12', ok: true, reaction: { who: sami, expr: sourire, text: '?chambre=12 dans l''adresse donne $_GET[''chambre''] = ''12''.' } }
          - { text: 'Quelle chambre ?', misconception: get-vide, reaction: { who: sami, expr: sourcil, text: 'L''adresse porte ?chambre=12 : isset($_GET[''chambre'']) est vrai.' } }
          - { text: 'Chambre chambre', misconception: get-cle, reaction: { who: sami, expr: sourcil, text: '$_GET[''chambre''] donne la valeur envoyée, 12, pas le nom du champ.' } }
          - { text: 'Chambre 12 Quelle chambre ?', misconception: deux-branches, reaction: { who: sami, expr: sourcil, text: 'if ou else, jamais les deux.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Au premier affichage, personne n''a encore rien envoyé. Que vaut $_GET[''nom''] ?'
        options:
          - { text: 'Rien : la case n''existe pas. Il faut tester isset($_GET[''nom'']) avant de la lire.', ok: true }
          - { text: 'Une chaîne vide.', misconception: get-vide-existe, reaction: { who: sami, expr: sourcil, text: 'La case n''existe pas du tout : la lire donne un avertissement « Undefined array key ».' } }
          - { text: 'Le nom du dernier client.', misconception: get-memoire, reaction: { who: sami, expr: sourcil, text: 'Chaque visite est neuve : $_GET ne contient que ce que porte l''adresse.' } }
      -
        id: g2
        kind: choice
        prompt: 'Comment savoir si « Dupont » a une réservation ?'
        options:
          - { text: 'isset($reservations[$nom])', ok: true }
          - { text: '$reservations[$nom] tout court.', misconception: cle-inexistante, reaction: { who: sami, expr: sourcil, text: 'Lire une case qui n''existe pas affiche un avertissement : il faut demander d''abord si elle existe.' } }
          - { text: 'in_array($nom, $reservations)', misconception: in-array-cle, reaction: { who: sami, expr: sourcil, text: 'in_array cherche parmi les valeurs (les chambres), pas parmi les clés (les noms).' } }
    hints: 2
  -
    id: N27
    act: 5
    after: [N26]
    course: 'PHP · formulaires et sécurité'
    requester: sami
    kind: demande
    priority: haute
    category: 'Le comptoir › La sécurité'
    title: 'Le petit malin'
    request: 'Quelqu''un a tapé <b>Dupont</b> dans le champ, et la page l''a écrit en gras. N''importe qui peut taper n''importe quoi : protège la page.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Écris le nom tapé avec htmlspecialchars(), partout où la page l''affiche.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'L''adresse porte ?chambre=<b>12</b>. Que lit le client ?'
        view: veille
        options:
          - { text: 'Chambre <b>12</b>', ok: true, reaction: { who: sami, expr: sourire, text: 'htmlspecialchars a changé < et > en &lt; et &gt; : le navigateur affiche les balises au lieu de s''en servir.' } }
          - { text: 'Chambre 12, avec 12 en gras', misconception: htmlspecialchars-ignore, reaction: { who: sami, expr: sourcil, text: 'C''est ce qui arriverait sans htmlspecialchars : le navigateur lirait <b> comme une balise.' } }
          - { text: 'Chambre &lt;b&gt;12&lt;/b&gt;', misconception: entites-affichees, reaction: { who: sami, expr: sourcil, text: 'Le serveur envoie &lt;, mais le navigateur l''affiche « < ».' } }
          - { text: 'Chambre', misconception: htmlspecialchars-efface, reaction: { who: sami, expr: sourcil, text: 'htmlspecialchars n''efface rien : il rend le texte inoffensif.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Pourquoi htmlspecialchars($nom) avant de l''écrire dans la page ?'
        options:
          - { text: 'Ce que tape le visiteur arrive tel quel : sans htmlspecialchars, <b> ou <script> seraient lus comme du HTML.', ok: true }
          - { text: 'Pour mettre le nom en majuscules.', misconception: htmlspecialchars-casse, reaction: { who: sami, expr: sourcil, text: 'Il ne change pas la casse : il transforme < et > en &lt; et &gt;.' } }
          - { text: 'C''est inutile avec method="get".', misconception: get-sur, reaction: { who: sami, expr: sourcil, text: 'GET ou POST, le visiteur tape ce qu''il veut. Il suffit même de modifier l''adresse.' } }
    hints: 2
  -
    id: N28
    act: 5
    after: [N27]
    course: 'PHP · synthèse'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Le comptoir › Les veilleurs'
    final: true
    title: 'Le registre des veilleurs'
    request: 'La page des veilleurs du mois : une ligne par veilleur avec ses nuits, celui de ce soir marqué « (de garde) », et le total. « 1 nuit » au singulier, « 0 nuit » aussi.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Construis veilleurs.php avec $veilleurs et $garde, et une fonction nuits() dans fonctions.php pour le singulier et le pluriel.'
      -
        id: ordre
        kind: order
        label: 'Une visite'
        prompt: 'Un client ouvre veilleurs.php. Remets dans l''ordre ce qui se passe.'
        items:
          - 'Le navigateur affiche la page.'
          - 'Le serveur exécute le PHP de veilleurs.php.'
          - 'Le client tape l''adresse de la page.'
          - 'Le serveur envoie le HTML fabriqué.'
        answer: [2, 1, 3, 0]
        reaction: { who: sami, expr: sourcil, text: 'Pense au chemin d''une visite : la demande part du navigateur, le PHP tourne sur le serveur, le HTML revient.' }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Que doit rendre nuits(0) ? Et nuits(30) ?'
        options:
          - { text: '« 0 nuit » et « 30 nuits » : au-dessous de 2, le singulier.', ok: true }
          - { text: '« 0 nuits » et « 30 nuits ».', misconception: zero-pluriel, reaction: { who: sami, expr: sourcil, text: 'En français, zéro prend le singulier : 0 nuit.' } }
          - { text: '« 0 » et « 30 ».', misconception: unite-oubliee, reaction: { who: sami, expr: sourcil, text: 'La fonction rend le nombre avec son mot.' } }
      -
        id: g2
        kind: choice
        prompt: 'Comment calculer le total des nuits ?'
        options:
          - { text: '$total = 0 avant la boucle, $total = $total + $n à chaque tour.', ok: true }
          - { text: 'count($veilleurs)', misconception: count-somme, reaction: { who: sami, expr: sourcil, text: 'count() compte les veilleurs, pas leurs nuits.' } }
          - { text: '$total = $n dans la boucle.', misconception: somme-ecrase, reaction: { who: sami, expr: sourcil, text: 'À chaque tour, tu écrases le total : il ne reste que le dernier veilleur.' } }
    hints: 2
