# Service de nuit - acte 4 : Les étages.
#
# The server half of the nights (design/validated/serious-games-service-de-nuit.md §3): the graph, the
# requests, the steps with their right answers and the misconception of each wrong one, Sami's guided
# questions, the clue closing gives. The game half (the site to start from, the visitors and their
# checks, the hidden ones, the notebooks, the written hints, the scenes) is public/serious-games/
# service-de-nuit/steps/acte4.js. Converted from the prototype's host/scenario/acte4.js by
# tool/to-yaml.js; `hints` counts the written hints the game holds after the guided questions. A ticket
# is a « nuit » in the game's words.
tickets:
  -
    id: N18
    act: 4
    after: [N17]
    course: 'PHP · les tableaux'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les étages › La date'
    title: 'Jeudi, pas Thursday'
    request: 'En haut de l''accueil, je voudrais la date du jour en français : « Nous sommes le jeudi 12 novembre. »'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Range les jours et les mois dans deux tableaux, et écris la date du jour en français, sans ajouter de if.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: 'premier / 4', ok: true, reaction: { who: sami, expr: sourire, text: 'Case 0 : le rez-de-chaussée. Case 1 : le premier. Et count() compte les cases.' } }
          - { text: 'rez-de-chaussée / 4', misconception: indice-un, reaction: { who: sami, expr: sourcil, text: 'La première case est la case 0 : $etages[1] est la deuxième.' } }
          - { text: 'premier / 3', misconception: count-indice, reaction: { who: sami, expr: sourcil, text: 'count() donne le nombre de cases, 4, pas le numéro de la dernière.' } }
          - { text: 'deuxième / 4', misconception: indice-plus-un, reaction: { who: sami, expr: sourcil, text: '$etages[1], c''est la case 1 : « premier ».' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment ranger les noms des jours pour y accéder par un numéro ?'
        options:
          - { text: 'Dans un tableau : $jours = [''lundi'', ''mardi'', …, ''dimanche''];', ok: true }
          - { text: 'Dans sept variables : $jour1, $jour2…', misconception: variables-numerotees, reaction: { who: sami, expr: sourcil, text: 'Et ensuite ? Il faudrait un if par jour pour choisir la bonne. Un tableau se lit avec un numéro.' } }
          - { text: 'Dans une seule chaîne : ''lundi mardi mercredi…''', misconception: chaine-liste, reaction: { who: sami, expr: sourcil, text: 'Une chaîne n''a pas de cases : on ne peut pas y prendre le 4e jour simplement.' } }
      -
        id: g2
        kind: choice
        prompt: 'Jeudi, date(''N'') vaut 4. Quelle case lire dans [''lundi'', ''mardi'', ''mercredi'', ''jeudi'', …] ?'
        options:
          - { text: 'La case 3 : $jours[date(''N'') - 1].', ok: true }
          - { text: 'La case 4 : $jours[date(''N'')].', misconception: indice-un, reaction: { who: sami, expr: sourcil, text: 'La case 4, c''est « vendredi » : le tableau commence à 0.' } }
          - { text: 'La case « jeudi » : $jours[''jeudi''].', misconception: cle-texte, reaction: { who: sami, expr: sourcil, text: 'Ce tableau est numéroté : ses cases s''appellent 0, 1, 2…' } }
    hints: 2
  -
    id: N19
    act: 4
    after: [N18]
    course: 'PHP · if et else'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les étages › Le premier du mois'
    title: 'Le 1er du mois'
    request: 'Le premier du mois, on écrit « mardi 1er décembre », pas « mardi 1 décembre ».'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Le 1 du mois, écris « 1er » à la place de « 1 », avec une seule condition.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: 'le 1er mai', ok: true, reaction: { who: sami, expr: sourire, text: '$q vaut 1 : la condition est vraie, et $q reçoit ''1er'' à la place.' } }
          - { text: 'le 1 mai', misconception: valeur-remplacee, reaction: { who: sami, expr: sourcil, text: '$q = ''1er''; remplace la valeur de $q : c''est la nouvelle qui est écrite.' } }
          - { text: 'le 11er mai', misconception: valeur-ajoutee, reaction: { who: sami, expr: sourcil, text: 'Le = remplace, il n''ajoute pas : $q vaut ''1er'', pas ''1'' suivi de ''1er''.' } }
          - { text: 'le $q mai', misconception: nom-affiche, reaction: { who: sami, expr: sourcil, text: 'Entre guillemets simples, ''le '' est du texte ; $q, hors des guillemets, est remplacé par sa valeur.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment écrire « 1er » le premier du mois, et le nombre les autres jours ?'
        options:
          - { text: 'Ranger date(''j'') dans une variable, la remplacer par ''1er'' si elle vaut 1, puis l''écrire.', ok: true }
          - { text: 'Ajouter ''er'' après date(''j'') tous les jours.', misconception: er-partout, reaction: { who: sami, expr: sourcil, text: '« 12er novembre » : seul le 1 prend le « er ».' } }
          - { text: 'Un tableau de 31 cases.', misconception: tableau-inutile, reaction: { who: sami, expr: sourcil, text: 'Possible, mais 30 cases sur 31 ne feraient que répéter le nombre. Une condition suffit.' } }
    hints: 2
  -
    id: N20
    act: 4
    after: [N19]
    course: 'PHP · foreach'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les étages › Les arrivées'
    title: 'Les arrivées du soir'
    request: 'Chaque soir, je recopie la liste des clients attendus. L''hôtel la prépare pourtant, dans $arrivees : je voudrais les noms numérotés, « 1. Mme Roux ».'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Avec foreach, écris un <li> numéroté par nom de $arrivees.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '101 102 205 (3)', ok: true, reaction: { who: sami, expr: sourire, text: 'Trois cases, trois tours, trois clés.' } }
          - { text: '0 1 2 (3)', misconception: foreach-cle-valeur, reaction: { who: sami, expr: sourcil, text: '« as $cle » donne les valeurs des cases, pas leurs numéros.' } }
          - { text: '101 102 205 (2)', misconception: count-indice, reaction: { who: sami, expr: sourcil, text: 'count() compte les cases : 3.' } }
          - { text: 'Array (3)', misconception: tableau-echo, reaction: { who: sami, expr: sourcil, text: 'echo est dans la boucle : il écrit une case à chaque tour, pas le tableau.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment numéroter les clients à partir de 1 ?'
        options:
          - { text: 'Avec un compteur : $rang = 1 avant la boucle, $rang++ à chaque tour.', ok: true }
          - { text: 'Avec « as $rang => $nom » tel quel.', misconception: cle-depuis-zero, reaction: { who: sami, expr: sourcil, text: 'Les clés commencent à 0 : « 0. Mme Roux ». Il faudrait ajouter 1.' } }
          - { text: 'Avec count($arrivees) à chaque tour.', misconception: count-rang, reaction: { who: sami, expr: sourcil, text: 'count() donne le total, le même à chaque tour.' } }
    hints: 2
  -
    id: N21
    act: 4
    after: [N20]
    course: 'PHP · les tableaux'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les étages › Combien ce soir'
    title: 'Combien ce soir ?'
    request: 'Au-dessus de la liste, le nombre : « 3 arrivées ce soir », « 1 arrivée ce soir » au singulier, et « Aucune arrivée ce soir. » quand il n''y a personne.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Compte les arrivées avec count(), et écris la bonne des trois phrases au-dessus de la liste.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '1 clé', ok: true, reaction: { who: sami, expr: sourire, text: 'Une case, donc count() vaut 1 : c''est le if qui parle.' } }
          - { text: '1 clés', misconception: singulier-oublie, reaction: { who: sami, expr: sourcil, text: '$n vaut 1 : la condition est vraie, et le if écrit « 1 clé ».' } }
          - { text: '0 clés', misconception: count-indice, reaction: { who: sami, expr: sourcil, text: 'count() compte les cases : il y en a une. La case, elle, porte le numéro 0.' } }
          - { text: '101 clé', misconception: count-valeur, reaction: { who: sami, expr: sourcil, text: 'count() donne le nombre de cases, pas ce qu''elles contiennent.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment savoir combien il y a d''arrivées ?'
        options:
          - { text: 'count($arrivees)', ok: true }
          - { text: '$arrivees.length', misconception: syntaxe-javascript, reaction: { who: sami, expr: sourcil, text: 'Ça, c''est du JavaScript. En PHP : count().' } }
          - { text: 'Le numéro de la dernière case.', misconception: count-indice, reaction: { who: sami, expr: sourcil, text: 'Les cases commencent à 0 : la dernière d''un tableau de 3 est la case 2.' } }
    hints: 2
  -
    id: N22
    act: 4
    after: [N21]
    course: 'PHP · les tableaux associatifs'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les étages › Les tarifs'
    title: 'Les tarifs de la saison'
    request: 'L''hôtel prépare $tarifs : chaque type de chambre avec son prix. Je veux une ligne par type, « Double : 78,00 € ».'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Avec foreach ($tarifs as $type => $prix), écris une ligne par type de chambre, le prix à la française.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '3 / 3', ok: true, reaction: { who: sami, expr: sourire, text: '$chambres[''Diaz''] vaut 3, et la case Okafor ajoutée en fait trois.' } }
          - { text: '12 / 3', misconception: cle-ordre, reaction: { who: sami, expr: sourcil, text: 'On lit la case dont la clé est « Diaz », pas la première.' } }
          - { text: '3 / 2', misconception: ajout-ignore, reaction: { who: sami, expr: sourcil, text: 'La ligne $chambres[''Okafor''] = 21; ajoute une case.' } }
          - { text: 'Diaz / 3', misconception: cle-affichee, reaction: { who: sami, expr: sourcil, text: '$chambres[''Diaz''] donne la valeur rangée sous la clé : 3.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Dans foreach ($tarifs as $type => $prix), que contient $type ?'
        options:
          - { text: 'La clé de la case : « Simple », « Double »… et $prix sa valeur.', ok: true }
          - { text: 'Le numéro de la case : 0, 1, 2.', misconception: cle-numero, reaction: { who: sami, expr: sourcil, text: 'Ce tableau a des clés en texte : $type prend « Simple », « Double »…' } }
          - { text: 'Le prix, et $prix le type.', misconception: cle-valeur-inverse, reaction: { who: sami, expr: sourcil, text: 'À gauche de =>, la clé ; à droite, la valeur.' } }
    hints: 2
  -
    id: N23
    act: 4
    after: [N22]
    course: 'PHP · les tableaux associatifs'
    requester: mireille
    kind: demande
    priority: haute
    category: 'Les étages › Le moins cher'
    title: 'Le moins cher'
    request: 'Sous la liste, « Dès 62 € la nuit » est écrit à la main. Je veux le prix le plus bas de la grille : « Dès 62,00 € la nuit ».'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Écris le prix le plus bas de $tarifs avec min(), à la française.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '62 / 120', ok: true, reaction: { who: sami, expr: sourire, text: 'min et max regardent les valeurs, dans n''importe quel ordre.' } }
          - { text: 'Simple / Suite', misconception: min-cle, reaction: { who: sami, expr: sourcil, text: 'min() rend la plus petite valeur, pas sa clé.' } }
          - { text: '62 / 78', misconception: max-dernier, reaction: { who: sami, expr: sourcil, text: 'max() cherche la plus grande valeur, pas la dernière case.' } }
          - { text: '120 / 62', misconception: min-max-inverse, reaction: { who: sami, expr: sourcil, text: 'min, c''est le plus petit ; max, le plus grand.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment trouver le prix le plus bas ?'
        options:
          - { text: 'min($tarifs)', ok: true }
          - { text: '$tarifs[''Simple'']', misconception: min-en-dur, reaction: { who: sami, expr: sourcil, text: 'La Simple n''est pas toujours la moins chère, ni même toujours là.' } }
          - { text: '$tarifs[0]', misconception: cle-numero, reaction: { who: sami, expr: sourcil, text: 'Ce tableau n''a pas de case 0 : ses clés sont des noms de chambres.' } }
    hints: 2
