# Service de nuit - acte 1 : La loge.
#
# The server half of the nights (design/validated/serious-games-service-de-nuit.md §3): the graph, the
# requests, the steps with their right answers and the misconception of each wrong one, Sami's guided
# questions, the clue closing gives. The game half (the site to start from, the visitors and their
# checks, the hidden ones, the notebooks, the written hints, the scenes) is public/serious-games/
# service-de-nuit/steps/acte1.js. Converted from the prototype's host/scenario/acte1.js by
# tool/to-yaml.js; `hints` counts the written hints the game holds after the guided questions. A ticket
# is a « nuit » in the game's words.
tickets:
  -
    id: N01
    act: 1
    course: 'PHP · le serveur, echo et date()'
    requester: mireille
    kind: demande
    priority: haute
    category: 'La loge › L''heure'
    title: 'L''heure de la loge'
    request: 'La page affiche toujours « Il est 23:12 ». Je veux l''heure qu''il est vraiment, à chaque client.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Fais écrire par PHP l''heure de chaque visite.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client dans son navigateur ?'
        view: veille
        options:
          - { text: 'Bonsoir Mme Roux !', ok: true, reaction: { who: sami, expr: sourire, text: 'Le PHP disparaît : il est remplacé par ce qu''il écrit.' } }
          - { text: 'Bonsoir <?php echo ''Mme Roux''; ?> !', misconception: php-visible, reaction: { who: sami, expr: sourcil, text: 'Le PHP ne part jamais vers le navigateur : le serveur le remplace par ce qu''il écrit.' } }
          - { text: 'Bonsoir ''Mme Roux'' !', misconception: guillemets-affiches, reaction: { who: sami, expr: sourcil, text: 'Les guillemets entourent le texte dans le code ; ils ne sont pas écrits.' } }
          - { text: 'Bonsoir echo Mme Roux !', misconception: echo-affiche, reaction: { who: sami, expr: sourcil, text: 'echo est une instruction : elle écrit, elle ne s''écrit pas.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Quelle ligne écrit l''heure du serveur sous la forme 08:05 ?'
        options:
          - { text: '<?php echo date(''H:i''); ?>', ok: true }
          - { text: '<?php echo date(''h:m''); ?>', misconception: format-date, reaction: { who: sami, expr: sourcil, text: 'h donne l''heure sur 12 h, et m… le mois. Les minutes, c''est i.' } }
          - { text: '<?php date(''H:i''); ?>', misconception: oubli-echo, reaction: { who: sami, expr: sourcil, text: 'date() calcule l''heure, mais sans echo personne ne l''écrit.' } }
          - { text: '<p>date(''H:i'')</p>', misconception: php-sans-balise, reaction: { who: sami, expr: sourcil, text: 'Hors des balises <?php ?>, c''est du texte : le navigateur l''affiche tel quel.' } }
    hints: 2
  -
    id: N02
    act: 1
    after: [N01]
    course: 'PHP · les variables'
    requester: mireille
    kind: demande
    priority: haute
    category: 'La loge › Le téléphone'
    title: 'Le nouveau numéro'
    request: 'Notre numéro devient le 05 55 12 34 56. Il est écrit trois fois sur la page : je veux qu''on ne le change plus qu''à un seul endroit.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Range le nouveau numéro dans une variable, et affiche-la aux trois endroits.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: 'Votre chambre : 12', ok: true, reaction: { who: sami, expr: sourire, text: 'Une variable garde sa dernière valeur. La 7, c''était avant.' } }
          - { text: 'Votre chambre : 7', misconception: premiere-valeur, reaction: { who: sami, expr: sourcil, text: 'La ligne $chambre = 12; vient après : elle remplace le 7.' } }
          - { text: 'Votre chambre : 7 12', misconception: variable-liste, reaction: { who: sami, expr: sourcil, text: 'Une variable ne contient qu''une valeur à la fois : la nouvelle chasse l''ancienne.' } }
          - { text: 'Votre chambre : $chambre', misconception: nom-affiche, reaction: { who: sami, expr: sourcil, text: 'echo $chambre écrit ce que contient la variable, pas son nom.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Le numéro est rangé dans $telephone. Comment l''écrire dans la page ?'
        options:
          - { text: '<?php echo $telephone; ?>', ok: true }
          - { text: '<?php echo ''telephone''; ?>', misconception: nom-sans-dollar, reaction: { who: sami, expr: sourcil, text: 'Entre guillemets et sans $, c''est le mot « telephone ». Une variable commence par $.' } }
          - { text: '<?php $telephone; ?>', misconception: oubli-echo, reaction: { who: sami, expr: sourcil, text: 'La variable est là, mais rien ne l''écrit : il faut echo.' } }
          - { text: '$telephone', misconception: php-sans-balise, reaction: { who: sami, expr: sourcil, text: 'Hors des balises <?php ?>, le navigateur l''affiche tel quel : « $telephone ».' } }
    hints: 2
  -
    id: N03
    act: 1
    after: [N02]
    course: 'PHP · les variables'
    requester: sami
    kind: demande
    priority: haute
    category: 'La loge › Le veilleur'
    title: 'Le veilleur du soir'
    request: 'La page dit « Sami » même les soirs où je ne suis pas là. L''hôtel prépare $garde avant chaque visite : sers-t''en.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Remplace « Sami » par $garde, le veilleur préparé par l''hôtel en haut du fichier, aux deux endroits.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Ce soir, l''hôtel a préparé $garde = ''Nora''. Que lit le client ?'
        view: veille
        options:
          - { text: 'Ce soir, Nora veille.', ok: true, reaction: { who: sami, expr: sourire, text: 'La page lit la valeur préparée pour cette visite-là.' } }
          - { text: 'Ce soir, $garde veille.', misconception: nom-affiche, reaction: { who: sami, expr: sourcil, text: 'Entre <?php ?>, echo $garde écrit ce que contient la variable.' } }
          - { text: 'Ce soir, garde veille.', misconception: nom-sans-dollar, reaction: { who: sami, expr: sourcil, text: 'echo écrit la valeur de $garde, pas son nom.' } }
          - { text: 'Ce soir, Sami veille.', misconception: valeur-figee, reaction: { who: sami, expr: sourcil, text: 'La page ne garde rien d''un soir à l''autre : elle lit $garde à chaque visite, et ce soir c''est Nora.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Où la page trouve-t-elle le nom du veilleur du soir ?'
        options:
          - { text: 'Dans $garde, que l''hôtel range dans les lignes grises en haut du fichier, avant chaque visite.', ok: true }
          - { text: 'Il faut l''écrire dans le code chaque soir.', misconception: valeur-en-dur, reaction: { who: sami, expr: sourcil, text: 'C''est ce que fait la page aujourd''hui, avec « Sami ». L''hôtel le prépare déjà pour toi.' } }
          - { text: 'PHP devine qui est de garde.', misconception: php-devine, reaction: { who: sami, expr: sourcil, text: 'PHP ne devine rien : il lit la variable que l''hôtel a remplie.' } }
    hints: 2
  -
    id: N04
    act: 1
    after: [N03]
    course: 'PHP · la concaténation'
    requester: mireille
    kind: demande
    priority: haute
    category: 'La loge › L''accueil'
    title: 'Bienvenue à la 12'
    request: 'Je veux que la page accueille chaque client par son nom : « Bienvenue Mme Roux, chambre 12 », dans l''onglet et sous le titre.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Construis la phrase d''accueil une fois, avec $client et $chambre, et affiche-la dans l''onglet et sous le titre.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Trois façons d''écrire la même phrase. Que lit le client ?'
        view: veille
        options:
          - { text: 'Bonsoir Lina ! Bonsoir $client ! Bonsoir Lina !', ok: true, reaction: { who: sami, expr: sourire, text: 'Les guillemets doubles remplacent la variable, les simples jamais.' } }
          - { text: 'Bonsoir Lina ! Bonsoir Lina ! Bonsoir Lina !', misconception: simple-quote-interpolation, reaction: { who: sami, expr: sourcil, text: 'Entre guillemets simples, $client reste écrit tel quel.' } }
          - { text: 'Bonsoir Lina ! Bonsoir $client ! Bonsoir $client !', misconception: double-quote-literal, reaction: { who: sami, expr: sourcil, text: 'Entre guillemets doubles, PHP remplace $client par sa valeur.' } }
          - { text: 'Bonsoir . $client . ! Bonsoir $client ! Bonsoir Lina !', misconception: point-affiche, reaction: { who: sami, expr: sourcil, text: 'Le point est hors des guillemets : c''est l''opérateur qui colle, il ne s''écrit pas.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'La phrase doit apparaître à deux endroits, écrite une seule fois. Où la ranger ?'
        options:
          - { text: 'Dans une variable, construite en haut du fichier, puis affichée deux fois.', ok: true }
          - { text: 'Dans les lignes grises de l''hôtel.', misconception: registre-ecrit, reaction: { who: sami, expr: sourcil, text: 'Ces lignes, c''est l''hôtel qui les remplit. La phrase, c''est ta page qui la construit.' } }
          - { text: 'Il faut l''écrire deux fois, c''est obligatoire.', misconception: variable-copie, reaction: { who: sami, expr: sourcil, text: 'Une variable s''affiche autant de fois qu''on veut.' } }
      -
        id: g2
        kind: choice
        prompt: 'Quelle ligne construit « Bienvenue Mme Roux, chambre 12 » ?'
        options:
          - { text: '$accueil = ''Bienvenue '' . $client . '', chambre '' . $chambre;', ok: true }
          - { text: '$accueil = ''Bienvenue $client, chambre $chambre'';', misconception: simple-quote-interpolation, reaction: { who: sami, expr: sourcil, text: 'Entre guillemets simples, les $ restent écrits tels quels.' } }
          - { text: '$accueil = ''Bienvenue'' . $client . '', chambre'' . $chambre;', misconception: point-espace, reaction: { who: sami, expr: sourcil, text: 'Il manque des espaces : « BienvenueMme Roux, chambre12 ».' } }
          - { text: '$accueil = ''Bienvenue '' + $client + '', chambre '' + $chambre;', misconception: plus-concatene, reaction: { who: sami, expr: sourcil, text: 'Le + additionne : PHP refuse d''additionner du texte.' } }
    hints: 2
  -
    id: N05
    act: 1
    after: [N04]
    course: 'PHP · les calculs'
    requester: mireille
    kind: demande
    priority: haute
    category: 'La loge › Le séjour'
    title: 'Le prix du séjour'
    request: 'À l''arrivée, la page doit annoncer le total à régler : les nuits, plus la taxe de séjour, 1,50 € par nuit et par personne.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Calcule le total avec $nuits, $tarif et $personnes, taxe comprise, et écris « Total à régler : … € ».'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '134 / 144', ok: true, reaction: { who: sami, expr: sourire, text: 'La multiplication passe avant l''addition, sauf si des parenthèses disent le contraire.' } }
          - { text: '144 / 144', misconception: priorite-ignoree, reaction: { who: sami, expr: sourcil, text: 'Sans parenthèses, PHP multiplie d''abord : 2 × 62 = 124, puis + 10.' } }
          - { text: '134 / 134', misconception: parentheses-inutiles, reaction: { who: sami, expr: sourcil, text: 'Les parenthèses changent tout : 62 + 10 d''abord, puis × 2.' } }
          - { text: '2 * 62 + 10 / 2 * (62 + 10)', misconception: calcul-affiche, reaction: { who: sami, expr: sourcil, text: 'Sans guillemets, c''est un calcul : echo écrit son résultat.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'La famille Okafor reste 4 nuits, à 4 personnes. Combien de taxe ?'
        options:
          - { text: '4 × 4 × 1,50 = 24 € : $nuits * $personnes * 1.5', ok: true }
          - { text: '4 × 1,50 = 6 €', misconception: taxe-par-chambre, reaction: { who: sami, expr: sourcil, text: 'Par nuit ET par personne : il faut les deux.' } }
          - { text: '(4 + 4) × 1,50 = 12 €', misconception: addition-au-lieu-produit, reaction: { who: sami, expr: sourcil, text: 'Par nuit et par personne, ça se multiplie : 16 nuitées.' } }
          - { text: '$nuits * $personnes * 1,50', misconception: virgule-decimale, reaction: { who: sami, expr: sourcil, text: 'En PHP, le séparateur décimal est le point : 1.5.' } }
    hints: 2
  -
    id: N06
    act: 1
    after: [N05]
    course: 'PHP · les calculs'
    requester: mireille
    kind: demande
    priority: haute
    category: 'La loge › La facture'
    title: 'À la française'
    request: '« 79.5 € », ça fait calculette. Sur une facture, j''écris « 79,50 € », et « 1 141,00 € » pour les gros séjours.'
    steps:
      -
        id: servir
        kind: fix
        prompt: 'Écris le total avec number_format : deux décimales, la virgule, l''espace des milliers.'
      -
        id: veille
        kind: choice
        label: 'La veille'
        prompt: 'Que lit le client ?'
        view: veille
        options:
          - { text: '1 141,00 / 7,50', ok: true, reaction: { who: sami, expr: sourire, text: 'Deux décimales, la virgule, l''espace des milliers : c''est ce que disent les trois arguments.' } }
          - { text: '1141 / 7.5', misconception: format-ignore, reaction: { who: sami, expr: sourcil, text: 'number_format réécrit le nombre : c''est tout son rôle.' } }
          - { text: '1,141.00 / 7.50', misconception: format-anglais, reaction: { who: sami, expr: sourcil, text: 'Ça, c''est number_format sans ses deux derniers arguments. Ici, ils disent la virgule et l''espace.' } }
          - { text: '1 141 / 7,5', misconception: decimales-ignorees, reaction: { who: sami, expr: sourcil, text: 'Le 2 demande deux décimales, toujours : 1 141,00 et 7,50.' } }
    guide:
      -
        id: g1
        kind: choice
        prompt: 'Comment écrire 79.5 sous la forme « 79,50 € » ?'
        options:
          - { text: 'number_format($total, 2, '','', '' '') . '' €''', ok: true }
          - { text: '$total . '',50 €''', misconception: format-a-la-main, reaction: { who: sami, expr: sourcil, text: 'Ça marche pour 79,50… et pour 63,50 ? Laisse number_format écrire les décimales.' } }
          - { text: 'round($total) . '' €''', misconception: round-format, reaction: { who: sami, expr: sourcil, text: 'round() arrondit : 79.5 devient 80. Il faut garder les centimes.' } }
    hints: 2
