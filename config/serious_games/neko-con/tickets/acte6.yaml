      -
        id: expliquer
        kind: explain
        expr: inquiet
        prompt: "Donc le titre était là depuis le début, juste caché dessous ? Mais comment une barre peut-elle s'asseoir sur un titre ?"
        options:
          - { text: "En position: fixed, l'en-tête sort du flux : la page se range comme s'il n'existait pas, et le titre remonte dessous. En sticky, il garde sa place et ne colle qu'au défilement.", ok: true, reaction: { who: theo, expr: joie, text: "Le titre ne voyait plus la barre, alors il s'est assis à sa place. Comme moi au self, quand quelqu'un part chercher du pain." } }
          - { text: "L'en-tête portait un z-index qui le plaçait au premier plan, par-dessus tout le reste : c'est lui qui recouvrait le titre. Sans ce z-index, le titre serait resté visible, juste en dessous.", misconception: z-index-cause, reaction: { who: ines, expr: sourcil, text: 'Le z-index décide qui est dessiné devant, pas où commence le contenu. Sans lui, le titre aurait été dessiné par-dessus la barre, mais toujours tout en haut.' } }
          - { text: "La déclaration top: 0 s'appliquait à toute la page, pas seulement à l'en-tête : tout le contenu remontait se coller en haut de l'écran, et le titre se retrouvait coincé sous la barre.", misconception: top-concerne-page, reaction: { who: ines, expr: neutre, text: "top ne concerne que l'élément qui le porte, ici l'en-tête. Et il était déjà là quand tout marchait." } }
          - { text: "Le titre avait margin: 0, donc aucune marge au-dessus de lui : rien ne le retenait sous la barre, alors il remontait trop haut et glissait sous l'en-tête violet.", misconception: marge-titre, reaction: { who: ines, expr: neutre, text: "margin: 0 était déjà là hier, et le titre s'affichait très bien. Ce qui a changé, c'est la façon dont l'en-tête occupe, ou non, sa place." } }
    guide:
