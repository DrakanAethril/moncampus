          - { text: "top: 0 colle tout le contenu de la page en haut de l'écran", misconception: top-concerne-page, reaction: { who: ines, expr: neutre, text: "top ne concerne que l'élément qui le porte, ici l'en-tête. Et il était déjà là quand tout marchait." } }
          - { text: 'Le titre h1 a margin: 0, il faudrait lui ajouter une marge', misconception: marge-titre, reaction: { who: ines, expr: neutre, text: "margin: 0 était déjà là hier, et le titre s'affichait très bien. Ce qui a changé, c'est la façon dont l'en-tête occupe (ou non) sa place." } }
