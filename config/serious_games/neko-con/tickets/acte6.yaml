    course: 'CSS 05'
    requester: maelle
    priority: haute
    title: "Le menu s'empile au lieu de s'aligner"
    request: "Le menu en haut, avec Accueil, Planning, etc., il était bien rangé sur une ligne. Maintenant les liens sont les uns sous les autres, l'en-tête est énorme et il prend la moitié de l'écran. Au secours."
    steps:
      - id: corriger
        kind: fix
        prompt: 'Trouve la cause, répare-la, puis livre ta correction à Maëlle.'
      -
        id: expliquer
        kind: explain
        expr: inquiete
        prompt: "Mais pourquoi le menu s'était mis en colonne ? Jordan avait écrit « row » dans le code, ça veut bien dire « rangée », non ?"
        options:
          - { text: "En flexbox, flex-direction: row veut dire « rangée » au sens d'une pile : les liens se rangent les uns sous les autres, comme des livres sur une étagère verticale.", misconception: row-vertical, reaction: { who: ines, expr: sourcil, text: "row, c'est la ligne, horizontale ; column, la colonne. La direction écrite par Jordan était juste : elle n'était simplement pas prise en compte." } }
          - { text: "flex-wrap: wrap obligeait chaque lien à passer à la ligne suivante, qu'il reste de la place ou non : avec six liens dans le menu, la liste finissait forcément en une longue colonne.", misconception: wrap-force, reaction: { who: ines, expr: neutre, text: "wrap autorise le retour à la ligne quand la place manque, il ne l'impose pas. Il y avait toute la largeur de l'écran : ce n'était pas lui." } }
          - { text: "Une liste <ul> s'affiche toujours en colonne, quoi qu'on écrive en CSS : ses <li> sont des blocs, et il a fallu les forcer à s'aligner par une autre technique.", misconception: liste-toujours-verticale, reaction: { who: ines, expr: sourcil, text: "En colonne par défaut, oui ; toujours, non. Le CSS peut en décider autrement, et c'est exactement ce qu'il faisait hier." } }
          - { text: 'row et wrap sont des réglages de flexbox, valables seulement dans un conteneur flex. Or la règle disait display: block : ils étaient ignorés, et la liste restait en colonne.', ok: true, reaction: { who: maelle, expr: joie, text: "Donc Jordan avait écrit le mode d'emploi, mais il n'avait pas allumé la machine. Typique de Jordan." } }
    guide:
      -
        id: couche
        kind: choice
        prompt: 'Le menu est une liste <ul> de liens. La cause est-elle dans le HTML ou dans le CSS ?'
        options:
          - { text: 'Dans le CSS : la règle .menu ne dispose plus les éléments côte à côte', ok: true }
          - { text: "Dans le HTML : une liste <ul> s'affiche toujours en colonne, il faut des <span>", misconception: liste-toujours-verticale, reaction: { who: ines, expr: sourcil, text: "Un menu est bien une liste de liens : <ul> est le bon choix. Une liste s'affiche en colonne par défaut… sauf si le CSS en décide autrement, comme hier." } }
          - { text: 'Dans le HTML : il manque <br> entre les liens', misconception: br-mise-en-page, reaction: { who: ines, expr: neutre, text: "<br> force un retour à la ligne : c'est l'inverse de ce que tu veux. Et la mise en page, c'est le travail du CSS." } }
      -
        id: diagnostic
        kind: choice
        prompt: "La règle .menu contient pourtant flex-direction: row et flex-wrap: wrap. Relis sa première déclaration : pourquoi les liens s'empilent-ils ?"
        options:
          - { text: "Ces propriétés ne servent qu'à un conteneur flex : sans display: flex, elles sont ignorées", ok: true }
          - { text: 'flex-direction: row empile les éléments en rangée verticale', misconception: row-vertical, reaction: { who: ines, expr: sourcil, text: "row, c'est la ligne, horizontale ; column, la colonne. Mais encore faut-il que cette direction soit prise en compte." } }
          - { text: 'flex-wrap: wrap force chaque élément à passer à la ligne', misconception: wrap-force, reaction: { who: ines, expr: neutre, text: "wrap autorise le retour à la ligne quand la place manque. Ici, il y a toute la largeur de l'écran : ce n'est pas lui." } }
