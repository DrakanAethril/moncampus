          - { text: "Par rapport à l'endroit où il serait sans positionnement", misconception: absolute-comme-relative, reaction: { who: ines, expr: neutre, text: "Ça, c'est position: relative. Un élément absolute sort du flux et cherche un repère ailleurs." } }
          - { text: "Par rapport à l'écran, quoi qu'il arrive", misconception: absolute-ecran, reaction: { who: ines, expr: neutre, text: "Ça, c'est position: fixed. Hier, le badge était bien sur sa carte : absolute peut donc se placer par rapport à autre chose que l'écran." } }
