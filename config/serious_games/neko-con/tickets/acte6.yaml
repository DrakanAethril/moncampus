          - { text: 'Dans le HTML, en sortant le <span> de la carte', misconception: deplacer-html, reaction: { who: ines, expr: sourcil, text: "Le badge appartient à la carte de Mika : il a sa place dedans. Le HTML est bon, c'est le repère qui manque." } }
