    course: 'CSS 05'
    requester: maelle
    priority: basse
    title: 'La colonne « Une journée entière » devait être deux fois plus large que « Infos »'
    request: "En bas de l'accueil, sur ma maquette, le bloc « Une journée entière » fait deux fois la largeur du bloc « Infos ». J'ai mesuré à la règle sur l'écran. Là, c'est n'importe quoi. Jordan m'avait dit « j'ai mis 2 et 1, c'est bon »."
    steps:
      - id: corriger
        kind: fix
        prompt: 'Trouve la cause, répare-la, puis livre ta correction à Maëlle.'
      -
        id: expliquer
        kind: explain
        expr: neutre
        prompt: 'Donc « 2 » et « 1 », ça ne voulait pas dire « deux fois plus large » ? Ça voulait dire quoi, alors ? Ma règle en plastique exige des explications.'
        options:
          - { text: 'Ça voulait bien dire « deux fois plus large ». Mais le navigateur arrondit chaque largeur au pixel près, et sur un grand écran, ces petits arrondis finissent par fausser la proportion.', misconception: flex-grow-multiplie, reaction: { who: ines, expr: sourcil, text: "Un arrondi, c'est un pixel, pas un tel écart. Et le rapport est juste maintenant : tu n'as pas changé la précision du navigateur, tu as changé le point de départ des blocs." } }
          - { text: "Les 24 px de gap entre les deux blocs étaient retirés à un seul d'entre eux, pas aux deux : c'est cet écart, pris d'un seul côté, qui faussait la proportion entre « 2 » et « 1 ».", misconception: gap-fausse, reaction: { who: ines, expr: neutre, text: '24 px sur toute la largeur, ça ne peut pas expliquer un tel écart. Et le gap est toujours là, avec le bon rapport.' } }
          - { text: "flex-grow ne multiplie pas la largeur : il partage la place libre. Chaque bloc partait de son contenu (flex-basis: auto), puis recevait 2 ou 1 part du reste. Avec flex-basis: 0, c'est 2 pour 1.", ok: true, reaction: { who: maelle, expr: etoiles, text: "Deux parts du gâteau qui reste, pas deux gâteaux ! Ma règle en plastique valide l'explication." } }
          - { text: 'Il manquait flex-direction: row sur le conteneur : sans direction explicite, flexbox ne sait pas sur quel axe appliquer flex-grow, et répartit la place à peu près comme il veut.', misconception: direction-manquante, reaction: { who: ines, expr: neutre, text: "row est la valeur par défaut : les blocs étaient déjà côte à côte. Et flexbox ne fait rien « à peu près » : il calcule, à partir d'un point de départ." } }
    guide:
      -
        id: localiser
        kind: line
        file: css/style.css
        prompt: 'Cherche la règle .bloc-programme, et clique sur la ligne censée rendre « Une journée entière » plus large.'
        answer:
          - 'flex-grow: 2'
        reaction:
          who: ines
          expr: neutre
          text: 'Cherche la règle .bloc-programme.'
      -
        id: diagnostic
        kind: choice
        prompt: "flex-grow: 2 d'un côté, flex-grow: 1 de l'autre. Mesure les deux blocs, puis demande-toi d'où part chacun avant de grandir. Pourquoi le rapport n'est-il pas de deux ?"
        options:
          - { text: "flex-grow partage l'espace libre qui reste après la taille de départ (ici, celle du contenu) ; il ne multiplie pas la largeur", ok: true }
          - { text: "flex-grow: 2 rend l'élément deux fois plus large : c'est le navigateur qui arrondit", misconception: flex-grow-multiplie, reaction: { who: ines, expr: sourcil, text: "Un arrondi ne ferait pas une telle différence. Demande-toi d'où part chaque colonne avant de grandir : de zéro, ou de la taille de son contenu ?" } }
          - { text: 'Il manque flex-direction: row sur .duo', misconception: direction-manquante, reaction: { who: ines, expr: neutre, text: "row est la valeur par défaut : les blocs sont déjà côte à côte. La question n'est pas leur direction, mais leur partage." } }
          - { text: 'Le gap de 24 px fausse le calcul', misconception: gap-fausse, reaction: { who: ines, expr: neutre, text: '24 px sur toute la largeur, ça ne peut pas expliquer un tel écart. Regarde plutôt la taille de départ de chaque bloc.' } }
