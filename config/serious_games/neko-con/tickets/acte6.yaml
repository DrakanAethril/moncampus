    title: "Le haut des titres est mangé par l'en-tête"
    request: "Sur le planning, on ne voit plus le titre « Planning du samedi » : il est caché sous la barre violette du menu. Sur les autres pages, pareil, le haut disparaît. Quelqu'un a voulu que le menu reste en haut, je crois."
    steps:
