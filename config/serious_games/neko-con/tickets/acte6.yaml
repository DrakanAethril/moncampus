    title: "Sur la tablette du stand, les cartes du programme sortent de l'écran"
    request: "On a mis l'accueil sur la tablette du stand d'accueil, pour que les gens voient le programme. Les cartes « Au programme » partent toutes vers la droite, il faut faire glisser l'écran pour voir la dernière. Personne ne va penser à faire glisser."
    steps:
      - id: corriger
        kind: fix
        prompt: 'Trouve la cause, répare-la, puis livre ta correction à Théo.'
      -
        id: expliquer
        kind: explain
        expr: neutre
        prompt: "Sur mon ordi, tout tenait. Pourquoi, sur la tablette, les cartes ont préféré partir hors de l'écran plutôt que de descendre d'une ligne ?"
        options:
          - { text: 'Le navigateur de la tablette ne comprend pas flexbox : il met les cartes à la suite, sans savoir les répartir sur plusieurs lignes, comme un vieux navigateur jamais mis à jour.', misconception: navigateur-incompatible, reaction: { who: ines, expr: neutre, text: "Les cartes étaient bien alignées côte à côte : c'est flexbox qui les plaçait, il fonctionnait. Le problème venait de son comportement par défaut." } }
          - { text: "Par défaut, un conteneur flex garde tous ses éléments sur une seule ligne, quitte à déborder : c'est flex-wrap: nowrap. Il fallait l'autoriser à passer à la ligne.", ok: true, reaction: { who: theo, expr: joie, text: 'Elles attendaient juste la permission de descendre. Elles sont plus disciplinées que nous en fin de cours.' } }
          - { text: "Les cartes ont une largeur fixe de 240 px : sur un écran plus étroit, elles ne peuvent que dépasser. Seules des largeurs en % ou en vw s'adaptent à l'écran d'une tablette.", misconception: largeur-fixe-coupable, reaction: { who: ines, expr: neutre, text: "Les tarifs de la billetterie ont aussi une base fixe, et ils passent bien à la ligne. Une largeur fixe n'empêche pas d'aller à la ligne : encore faut-il en avoir le droit." } }
          - { text: "Le site n'avait aucun réglage pour la tablette : sans @media écrite pour 768 px, le navigateur garde la mise en page prévue pour l'ordinateur, cartes comprises.", misconception: media-query-partout, reaction: { who: ines, expr: sourcil, text: "Une media query répondrait à une seule largeur. Flexbox sait déjà répartir les cartes selon la place, à n'importe quelle largeur, si on le lui permet." } }
    guide:
      -
        id: localiser
        kind: line
        file: css/style.css
        prompt: "Ce n'est pas une carte qui déborde, c'est leur rangement. Clique sur la ligne de la règle du bloc qui contient toutes les cartes."
        answer:
          - '.cartes {'
        reaction:
          who: ines
          expr: neutre
          text: "Ce n'est pas la règle d'une carte, mais celle du bloc qui les contient toutes."
      -
        id: diagnostic
        kind: choice
        prompt: 'Compare la règle .cartes avec la règle .tarifs de la billetterie, dont les éléments passent bien à la ligne. Pourquoi les cartes débordent-elles ?'
        options:
          - { text: "Par défaut, un conteneur flex garde tous ses éléments sur une seule ligne, même s'ils n'y tiennent pas", ok: true }
          - { text: 'Les cartes ont une largeur fixe de 240 px : il faudrait des pourcentages', misconception: largeur-fixe-coupable, reaction: { who: ines, expr: neutre, text: "Une base fixe n'empêche pas de passer à la ligne : les tarifs de la billetterie en ont une aussi, et ils s'adaptent. Compare les deux règles des conteneurs." } }
          - { text: 'Il faut écrire une media query spéciale pour la tablette', misconception: media-query-partout, reaction: { who: ines, expr: sourcil, text: "Une media query répondrait à une seule largeur. Flexbox sait déjà répartir les cartes selon la place, à n'importe quelle largeur, si on le lui permet." } }
          - { text: 'Le navigateur de la tablette ne connaît pas flexbox', misconception: navigateur-incompatible, reaction: { who: ines, expr: neutre, text: "Les cartes sont bien alignées côte à côte : flexbox fonctionne. C'est son comportement par défaut qui pose problème ici." } }
