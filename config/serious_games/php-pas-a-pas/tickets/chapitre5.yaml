  - id: N37
    act: 5
    after: [N36]
    requester: guide
    title: "Une liste d'enregistrements"
    request: "$eleves[1]['nom'] · foreach ($eleves as $e) · $e['note']"
    course: "Une liste d'enregistrements"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "$eleves est une liste de fiches (nom, note). Pourquoi echo $eleves['note']; affiche-t-il un avertissement au lieu des notes ?"
        options:
          - { text: "Parce que la liste n'a que des cases numérotées 0, 1, 2… : la clé 'note' est dans chaque fiche. Il faut d'abord choisir un élève : $eleves[0]['note'].", ok: true }
          - text: "Parce qu'il faudrait écrire $eleves[note], sans guillemets."
            misconception: c5-cle-sans-guillemets
            reaction: { who: guide, expr: neutre, text: "Sans guillemets, PHP cherche une constante « note » et s'arrête sur une erreur. Une clé s'écrit toujours entre guillemets ; le vrai problème est qu'on n'a pas choisi d'élève." }
          - text: "Parce que echo ne sait pas afficher plusieurs notes à la fois : il faudrait les mettre entre parenthèses."
            misconception: c5-cle-sur-liste
            reaction: { who: guide, expr: neutre, text: "$eleves['note'] ne désigne pas « toutes les notes » : PHP cherche une case nommée note dans la liste, et elle n'existe pas. Pour toutes les notes, on parcourt la liste avec foreach et on lit $e['note'] à chaque tour." }
          - text: "Parce que les fiches sont rangées dans l'ordre inverse : la note est avant le nom."
            misconception: c5-ordre-des-cles
            reaction: { who: guide, expr: neutre, text: "Dans une fiche, l'ordre des clés ne change rien : $e['note'] trouve la note où qu'elle soit. Ce qui manque, c'est le numéro de l'élève : $eleves[0]['note']." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N38
    act: 5
    after: [N37]
    requester: guide
    title: "Filtrer et totaliser des enregistrements"
    request: "if ($s['salle'] == …) · total d'une case · moyenne"
    course: "Filtrer et totaliser des enregistrements"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Pour la moyenne des notes des élèves sans absence, pourquoi divise-t-on le total par le compteur $n, et pas par count($eleves) ?"
        options:
          - { text: "Parce que count($eleves) compte toute la classe, y compris les élèves qu'on n'a pas gardés : seuls les $n élèves additionnés doivent compter.", ok: true }
          - text: "Parce que count ne marche pas sur une liste de fiches."
            misconception: c5-count-fiches
            reaction: { who: guide, expr: neutre, text: "count($eleves) marche très bien : il donne le nombre de fiches, donc d'élèves. Mais tous les élèves n'ont pas été additionnés : on divise par ceux qu'on a gardés." }
          - text: "Ça ne change rien : les deux donnent le même résultat."
            misconception: c5-moyenne-diviseur-indifferent
            reaction: { who: guide, expr: neutre, text: "Ce n'est vrai que si tous les élèves sont gardés. Avec 4 élèves dont 2 sans absence, diviser par 4 compte deux fois zéro : la moyenne est deux fois trop basse." }
          - text: "Parce que count($eleves) compte les cases de chaque fiche (nom, note, absences)."
            misconception: c5-count-champs
            reaction: { who: guide, expr: neutre, text: "count($eleves) compte les cases de la liste, c'est-à-dire les fiches. Les cases d'une fiche, ce serait count($eleves[0]). Le problème est ailleurs : on n'a pas additionné tous les élèves." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N39
    act: 5
    after: [N38]
    requester: guide
    title: "Le meilleur, le pire"
    request: "garder la fiche entière · ou son indice · ex æquo"
    course: "Le meilleur, le pire"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Pour trouver l'élève qui a la meilleure note, pourquoi garder $meilleur = $e (toute la fiche) plutôt que $max = $e['note'] ?"
        options:
          - { text: "Parce qu'on veut savoir qui c'est : la note seule ne dit pas à qui elle appartient, alors que la fiche garde le nom et la note ensemble.", ok: true }
          - text: "Ce n'est pas utile : avec la note, on retrouve l'élève en écrivant $eleves[$max]."
            misconception: c5-max-note-indice
            reaction: { who: guide, expr: neutre, text: "$eleves[16] chercherait la fiche numéro 16 : une note n'est pas un numéro de case. Il faut garder soit la fiche, soit son numéro ($iMax), jamais seulement la note." }
          - text: "Parce que $max = $e['note'] modifierait la note dans la fiche de l'élève."
            misconception: c5-affectation-modifie-source
            reaction: { who: guide, expr: neutre, text: "$max = $e['note'] copie la note dans $max ; la fiche n'est pas touchée. Le problème est qu'après la boucle on a la note, mais plus le nom." }
          - text: "Parce que PHP refuse de comparer deux notes si on ne garde pas la fiche."
            misconception: c5-comparer-fiches
            reaction: { who: guide, expr: neutre, text: "On compare toujours des notes, des nombres : $e['note'] > $meilleur['note']. Garder la fiche sert seulement à ne pas perdre le nom." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

