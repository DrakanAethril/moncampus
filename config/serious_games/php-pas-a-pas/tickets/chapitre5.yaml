  - id: N42
    act: 5
    after: [N41]
    requester: guide
    title: "Construire un tableau à deux dimensions"
    request: "remplir une grille · $eleves[] = ['nom' => …, 'note' => …]"
    course: "Construire un tableau à deux dimensions"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Pour construire une grille, pourquoi écrire $ligne = []; au début de la boucle des lignes, et pas une seule fois avant les deux boucles ?"
        options:
          - { text: "Parce que chaque ligne doit commencer vide : sinon la deuxième ligne garde les cases de la première et grandit à chaque tour.", ok: true }
          - text: "Ça ne change rien : $g[] = $ligne; vide $ligne après l'avoir rangée dans la grille."
            misconception: c5-reset-inutile
            reaction: { who: guide, expr: neutre, text: "$g[] = $ligne range une copie de la ligne dans la grille ; $ligne, elle, garde ses cases. Sans $ligne = [], la ligne suivante part avec les cases de la précédente." }
          - text: "Pour effacer la grille déjà construite et repartir de zéro à chaque ligne."
            misconception: c5-reset-efface-grille
            reaction: { who: guide, expr: neutre, text: "$ligne = [] ne touche que $ligne : les lignes déjà rangées dans $g restent. C'est la ligne en cours qu'on remet à vide." }
          - text: "Parce que PHP refuse [] sur une variable qui n'a pas été créée juste avant."
            misconception: c5-reset-syntaxe
            reaction: { who: guide, expr: neutre, text: "$ligne[] = … crée la liste si elle n'existe pas. Le vrai rôle de $ligne = [] est de repartir d'une ligne vide à chaque tour." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N43
    act: 5
    after: [N42]
    requester: guide
    title: "Trier"
    request: "sort · rsort · asort · arsort · ksort · usort et <=>"
    course: "Trier"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Après la ligne $notes = sort($notes);, pourquoi $notes ne contient-il plus les notes ?"
        options:
          - { text: "Parce que sort trie le tableau lui-même et renvoie seulement true : la ligne range true dans $notes, à la place des notes triées.", ok: true }
          - text: "Parce qu'il fallait ranger le résultat dans une autre variable : $tri = sort($notes);"
            misconception: c5-sort-renvoie
            reaction: { who: guide, expr: neutre, text: "$tri vaudrait aussi true : sort ne renvoie jamais le tableau trié. On écrit sort($notes); seul, puis on utilise $notes, qui est trié." }
          - text: "Parce que sort vide le tableau quand il est déjà dans l'ordre."
            misconception: c5-sort-vide
            reaction: { who: guide, expr: neutre, text: "sort ne vide jamais un tableau : il range ses cases. Ce qui efface les notes, c'est $notes = …, qui remplace le tableau par ce que sort renvoie : true." }
          - text: "Parce que sort ne marche que sur les tableaux associatifs."
            misconception: c5-sort-associatif
            reaction: { who: guide, expr: neutre, text: "sort trie une liste de valeurs ; c'est même sur un tableau associatif qu'il pose problème, car il perd les clés (asort et arsort les gardent)." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N44
    act: 5
    after: [N43]
    requester: guide
    title: "Atelier : données"
    request: "cinq réparations · trois programmes qui mêlent tout"
    course: "Atelier : tableaux à deux dimensions"
    hints: 22
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "echo $eleves[1]; affiche « Array » et un avertissement. Qu'est-ce que cela veut dire ?"
        options:
          - { text: "Que $eleves[1] est une fiche entière, donc un tableau, et qu'echo ne sait afficher que du texte : il manque un crochet pour choisir une case, comme $eleves[1]['nom'].", ok: true }
          - text: "Que la liste $eleves est vide."
            misconception: c5-array-vide
            reaction: { who: guide, expr: neutre, text: "Une case vide ou absente donnerait « Undefined array key ». « Array » veut dire au contraire qu'il y a quelque chose, et que c'est un tableau." }
          - text: "Que l'élève numéro 1 s'appelle Array."
            misconception: c5-array-nom
            reaction: { who: guide, expr: neutre, text: "« Array » est ce que PHP écrit quand on lui demande d'afficher un tableau comme du texte. Le nom est dans la fiche, à la case ['nom']." }
          - text: "Qu'il faut écrire $eleves[1] entre guillemets pour l'afficher."
            misconception: c5-array-guillemets
            reaction: { who: guide, expr: neutre, text: "Entre guillemets, PHP afficherait encore « Array ». Ce n'est pas l'écriture qui manque, c'est un crochet : $eleves[1]['nom']." }
