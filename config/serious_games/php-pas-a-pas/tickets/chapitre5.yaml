# PHP pas à pas — chapter 5, « Tableaux à deux dimensions ». A ticket is a level or a mastery challenge
# (« défi de maîtrise »); the steps run in the order written (scenario.free_order). A `fix` step is measured
# by the game on the visible case and the hidden ones and sends {passed, failed}; an `explain` step -
# « Comprendre » - is corrected here, each wrong option naming its misconception. `hints` is the number of
# written hints the game holds for the level's measured steps: the bench checks it against the package.
tickets:
  - id: N35
    act: 5
    after: [N34]
    requester: guide
    title: "Une grille"
    request: "$g[$ligne][$colonne] · count($g) · count($g[0])"
    course: "Une grille"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Dans $places[1][3], que désigne le premier crochet, [1] ?"
        options:
          - { text: "La ligne : $places[1] est toute la ligne 1 (une liste), et [3] choisit ensuite la case 3 dans cette ligne.", ok: true }
          - text: "La colonne, comme le x d'un point en mathématiques : on va d'abord vers la droite, puis on descend."
            misconception: c5-colonne-dabord
            reaction: { who: guide, expr: neutre, text: "En PHP, le premier crochet choisit une case de la grande liste, et cette case est une ligne entière. Le deuxième crochet choisit la case dans cette ligne : la colonne. Ligne d'abord, colonne ensuite." }
          - text: "La première ligne de la grille."
            misconception: c5-index-un
            reaction: { who: guide, expr: neutre, text: "Les numéros commencent à 0, pour les lignes comme pour les colonnes : [0] est la première ligne, [1] la deuxième." }
          - text: "Une case à part : $places[1][3] lit deux cases, la case 1 et la case 3."
            misconception: c5-crochets-deux-cases
            reaction: { who: guide, expr: neutre, text: "Les deux crochets se lisent l'un après l'autre : [1] donne une ligne, puis [3] choisit une seule case dans cette ligne. Le résultat est une seule valeur." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N36
    act: 5
    after: [N35]
    requester: guide
    title: "Parcourir une grille"
    request: "for dans for · foreach dans foreach · total par ligne"
    course: "Parcourir une grille"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Une grille a 2 lignes et 5 colonnes. On la parcourt avec deux boucles for imbriquées. Combien de fois la ligne qui est dans la boucle intérieure s'exécute-t-elle ?"
        options:
          - { text: "10 fois : la boucle intérieure fait ses 5 tours en entier pour chacune des 2 lignes, soit 2 × 5.", ok: true }
          - text: "7 fois : 2 tours pour les lignes plus 5 tours pour les colonnes."
            misconception: c5-imbrique-addition
            reaction: { who: guide, expr: neutre, text: "Les deux boucles ne se suivent pas, elles sont l'une dans l'autre : à chaque tour de la boucle des lignes, la boucle des colonnes recommence et fait ses 5 tours. 5 tours, deux fois : 10." }
          - text: "5 fois : la boucle intérieure ne fait ses tours qu'une seule fois, au premier passage."
            misconception: c5-imbrique-une-fois
            reaction: { who: guide, expr: neutre, text: "À chaque nouveau tour de la boucle extérieure, la boucle intérieure repart de zéro ($c = 0) et refait tous ses tours. Ouvre « Pas à pas » pour voir $c repartir." }
          - text: "2 fois : les deux compteurs $l et $c avancent ensemble, et on s'arrête à la fin des lignes."
            misconception: c5-imbrique-parallele
            reaction: { who: guide, expr: neutre, text: "$l ne bouge pas pendant que $c fait tous ses tours. C'est seulement quand la boucle intérieure est finie que $l passe à la ligne suivante." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

