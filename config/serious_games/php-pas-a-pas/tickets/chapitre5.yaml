  - id: N40
    act: 5
    after: [N39]
    requester: guide
    title: "Un tableau dans une clé"
    request: "$classe[1]['notes'][2] · count($e['notes']) · moyenne de chaque élève"
    course: "Un tableau dans une clé"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Chaque fiche de $eleves a un nom et une liste de notes. Que compte count($eleves[0]['notes']) ?"
        options:
          - { text: "Le nombre de notes du premier élève : $eleves[0] est sa fiche, ['notes'] sa liste de notes, et count compte les cases de cette liste.", ok: true }
          - text: "Le nombre d'élèves de la classe."
            misconception: c5-count-eleves
            reaction: { who: guide, expr: neutre, text: "Le nombre d'élèves, ce serait count($eleves). Ici, on est entré dans la fiche 0, puis dans sa liste de notes : count compte ce qu'on lui donne, la liste des notes." }
          - text: "2 : les deux cases de la fiche, le nom et les notes."
            misconception: c5-count-fiche-entiere
            reaction: { who: guide, expr: neutre, text: "Les cases de la fiche, ce serait count($eleves[0]). Le crochet ['notes'] entre un niveau plus loin, dans la liste des notes." }
          - text: "La somme des notes du premier élève."
            misconception: c5-count-somme
            reaction: { who: guide, expr: neutre, text: "count compte les cases, il n'additionne pas les valeurs. La somme, c'est array_sum($eleves[0]['notes'])." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N41
    act: 5
    after: [N40]
    requester: guide
    title: "Regrouper"
    request: "$parSalle[$s['salle']][] = $s['nom'] · compter par groupe"
    course: "Regrouper"
    hints: 17
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - { id: viser, kind: fix, prompt: "Viser" }
      - id: comprendre
        kind: explain
        prompt: "Que fait $parSalle[$s['salle']][] = $s['nom']; quand la salle du spécimen n'existe pas encore dans $parSalle ?"
        options:
          - { text: "PHP crée la case de cette salle, avec une liste vide, puis ajoute le nom au bout de cette liste : c'est ainsi qu'un groupe apparaît.", ok: true }
          - text: "PHP affiche un avertissement : il faut d'abord créer chaque salle à la main, avec une liste vide."
            misconception: c5-groupe-creer-main
            reaction: { who: guide, expr: neutre, text: "Ajouter avec [] crée la liste si elle n'existe pas : aucun avertissement. Et créer les salles à la main oblige à savoir d'avance lesquelles existent, ce qu'on ignore." }
          - text: "Le nom remplace tout ce que contenait $parSalle."
            misconception: c5-groupe-ecrase
            reaction: { who: guide, expr: neutre, text: "On n'écrit que dans la case de cette salle, et [] ajoute au bout de sa liste : les autres salles et les noms déjà rangés restent." }
          - text: "Le nom est rangé dans la case 0 de $parSalle : la salle ne sert à rien."
            misconception: c5-groupe-numero
            reaction: { who: guide, expr: neutre, text: "Le premier crochet, $s['salle'], est la clé : 'R1', 'R2'… C'est le second, [], qui ajoute au bout de la liste de cette salle." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

