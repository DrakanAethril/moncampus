  - id: N19
    act: 3
    after: [N18]
    requester: guide
    title: "Compter ce qui répond à une condition"
    request: "$nb = 0 · if dans la boucle · $nb++"
    course: "Compter avec une boucle"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "Dans une boucle, $nb++ est placé dans un if. Que contient $nb à la fin de la boucle ?"
        options:
          - { text: "Le nombre de tours où la condition du if était vraie : $nb n'augmente que lorsque PHP entre dans le if.", ok: true }
          - text: "Le nombre total de tours de la boucle."
            misconception: c3-compteur-tours
            reaction: { who: guide, expr: neutre, text: "Ce serait vrai si $nb++ était directement dans la boucle. Dans le if, il ne s'exécute que lorsque la condition est vraie." }
          - text: "La dernière valeur qui respectait la condition."
            misconception: c3-compteur-valeur
            reaction: { who: guide, expr: neutre, text: "$nb++ ajoute 1, il ne recopie pas la valeur. Pour garder la valeur elle-même, il faudrait écrire $derniere = $i;" }
          - text: "La somme des valeurs qui respectaient la condition."
            misconception: c3-compteur-somme
            reaction: { who: guide, expr: neutre, text: "$nb++ ajoute 1 à chaque fois, quelle que soit la valeur. Une somme s'écrirait $total += $i;" }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N20
    act: 3
    after: [N19]
    requester: guide
    title: "Le plus grand, le plus petit"
    request: "partir de la première valeur · garder le meilleur"
    course: "Maximum et minimum"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "Pour chercher la plus grande valeur, pourquoi $max = 0; avant la boucle est-il une erreur ?"
        options:
          - { text: "Si toutes les valeurs sont négatives, aucune ne dépasse 0 : le programme affiche 0, une valeur qui n'est même pas dans la suite. Le maximum part de la première valeur.", ok: true }
          - text: "Ce n'est pas une erreur : 0 est neutre, comme pour une somme."
            misconception: c3-max-neutre
            reaction: { who: guide, expr: neutre, text: "0 est neutre pour une somme (ajouter 0 ne change rien). Pour un maximum, 0 est une valeur comme une autre, qui gagne contre tous les nombres négatifs." }
          - text: "0 est trop petit : il faut partir d'un très grand nombre, comme 1000."
            misconception: c3-max-grand
            reaction: { who: guide, expr: neutre, text: "Pour un maximum, partir très haut est pire : rien ne dépasse 1000, et 1000 reste jusqu'au bout. Partir de la première valeur marche toujours." }
          - text: "Parce que PHP ne sait pas comparer un nombre avec 0."
            misconception: c3-comparer-zero
            reaction: { who: guide, expr: neutre, text: "PHP compare très bien avec 0. Le souci est le sens : 0 n'est pas une des valeurs de la suite, et il peut les battre toutes." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: M09
    act: 3
