  - id: N21
    act: 3
    after: [N20]
    requester: guide
    title: "Le reste et les sauts"
    request: "% · pair, impair, multiple · continue · break"
    course: "Le reste, continue et break"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "Dans une boucle, quelle est la différence entre continue et break ?"
        options:
          - { text: "continue saute la fin du tour en cours et passe au tour suivant ; break quitte la boucle pour de bon, et le programme continue après l'accolade.", ok: true }
          - text: "Aucune : les deux arrêtent la boucle."
            misconception: c3-continue-arrete
            reaction: { who: guide, expr: neutre, text: "Seul break arrête la boucle. continue abandonne seulement le tour en cours : la boucle reprend au tour suivant." }
          - text: "continue fait recommencer la boucle depuis son premier tour."
            misconception: c3-continue-recommence
            reaction: { who: guide, expr: neutre, text: "continue ne remet rien à zéro : $i garde sa valeur, le pas s'applique, et la boucle passe au tour suivant." }
          - text: "break saute seulement le tour en cours, continue arrête tout."
            misconception: c3-break-continue-inverses
            reaction: { who: guide, expr: neutre, text: "C'est l'inverse : break casse la boucle (on en sort), continue continue avec le tour suivant." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N22
    act: 3
    after: [N21]
    requester: guide
    title: "Chercher et s'arrêter"
    request: "$trouve = false · break · conclure après la boucle"
    course: "Chercher avec une boucle"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "Pour dire « pas trouvé », pourquoi l'affiche-t-on après la boucle, et pas dans un else à l'intérieur ?"
        options:
          - { text: "Parce qu'on ne peut conclure « pas trouvé » qu'après avoir tout regardé : un else dans la boucle le dirait à chaque tour où la valeur ne correspond pas, même si elle arrive plus loin.", ok: true }
          - text: "Parce qu'un else est interdit à l'intérieur d'une boucle."
            misconception: c3-else-interdit
            reaction: { who: guide, expr: neutre, text: "Un else est permis dans une boucle. Mais il s'exécute à chaque tour où la condition est fausse : il ne peut pas savoir si la valeur viendra plus tard." }
          - text: "C'est pareil : le else d'une boucle ne s'exécute qu'une fois."
            misconception: c3-else-une-fois
            reaction: { who: guide, expr: neutre, text: "Tout ce qui est dans la boucle s'exécute à chaque tour, le else compris. Il afficherait « pas trouvé » plusieurs fois." }
          - text: "Parce qu'après la boucle, PHP a oublié $trouve : il faut décider avant."
            misconception: c3-oubli-apres
            reaction: { who: guide, expr: neutre, text: "Les variables gardent leur valeur après la boucle : c'est justement pour ça qu'on prépare $trouve avant, et qu'on le lit après." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N23
    act: 3
    after: [N22]
    requester: guide
    title: "Boucles imbriquées"
    request: "une boucle dans une boucle · lignes et colonnes"
    course: "Les boucles imbriquées"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "for ($i = 1; $i <= 3; $i++) { for ($j = 1; $j <= 4; $j++) { echo \"*\"; } } — combien d'étoiles, et pourquoi ?"
        options:
          - { text: "12 : à chaque tour de la boucle extérieure, la boucle intérieure fait ses 4 tours en entier. 3 tours fois 4 tours.", ok: true }
          - text: "7 : 3 tours, puis 4 tours."
            misconception: c3-imbrique-addition
            reaction: { who: guide, expr: neutre, text: "Les deux boucles ne se suivent pas, l'une est dans l'autre : la boucle intérieure recommence en entier à chaque tour de l'extérieure. Les tours se multiplient." }
          - text: "4 : la boucle intérieure ne tourne qu'au premier tour, ensuite $j vaut déjà 5."
            misconception: c3-imbrique-j-garde
            reaction: { who: guide, expr: neutre, text: "Le départ $j = 1 fait partie du for intérieur : il est exécuté de nouveau à chaque fois que PHP arrive sur cette boucle. Ce serait vrai avec $j = 1; écrit avant la première boucle." }
          - text: "3 : seule la boucle extérieure compte les tours."
            misconception: c3-imbrique-exterieure
            reaction: { who: guide, expr: neutre, text: "Le echo est dans la boucle intérieure : il s'exécute à chacun de ses tours, et elle en fait 4 par tour de la boucle extérieure." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N24
    act: 3
    after: [N23]
    requester: guide
    title: "Atelier : répéter"
    request: "5 boucles à réparer · 3 programmes"
    course: "Atelier sur les boucles"
    hints: 22
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "Ton programme réussit le cas visible, mais échoue sur le cas caché « $n = 0 (aucun tour) ». Que faut-il regarder d'abord ?"
        options:
          - { text: "Ce qui se passe quand la boucle ne tourne pas du tout : ce qui est préparé avant elle (la somme, le compteur, le drapeau) doit déjà donner la bonne réponse.", ok: true }
          - text: "Rien : un cas sans aucun tour n'a pas de sens, le jeu se trompe."
            misconception: c3-zero-tour-absurde
            reaction: { who: guide, expr: neutre, text: "Zéro tour arrive tout le temps : une classe sans absent, une salle vide, une recherche sur rien. Un programme juste affiche alors la bonne réponse : 0, « aucun », une ligne vide…" }
          - text: "Il faut toujours ajouter if ($n == 0) au début, avec une réponse à part."
            misconception: c3-cas-particulier
            reaction: { who: guide, expr: neutre, text: "Parfois utile, mais le plus souvent une boucle bien préparée gère 0 toute seule : une somme qui part de 0 affiche 0, un produit qui part de 1 affiche 1." }
          - text: "Il faut faire partir la boucle de 0 au lieu de 1."
            misconception: c3-depart-zero
            reaction: { who: guide, expr: neutre, text: "Changer le départ décale les valeurs et ajoute souvent un tour de trop. Regarde plutôt ce que valent tes variables si aucun tour n'a lieu." }
      - { id: reparer1, kind: fix, prompt: "Réparer" }
      - { id: reparer2, kind: fix, prompt: "Réparer" }
