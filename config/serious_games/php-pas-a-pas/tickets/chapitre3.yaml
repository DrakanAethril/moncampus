# PHP pas à pas — chapter 3, « Répéter »: while, for, counting steps, accumulating, counting, extremes,
# remainder and jumps, searching, nested loops, then a workshop. Same shape as chapter 1: a ticket is a
# level or a mastery challenge; a `fix` step is measured by the game, an `explain` step (« Comprendre ») is
# corrected here. `hints` counts the written hints of the measured steps, two per reminder included.
tickets:
  - id: N15
    act: 3
    after: [N14]
    requester: guide
    title: "Tant que"
    request: "while · la condition · ce qui la fait changer"
    course: "La boucle while"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "$i = 10; puis while ($i <= 5) { echo $i; $i++; } n'affiche rien du tout. Pourquoi ?"
        options:
          - { text: "Parce que la condition est vérifiée avant chaque tour, le premier compris : 10 <= 5 est faux dès le départ, donc la boucle ne fait aucun tour.", ok: true }
          - text: "Parce qu'il manque un tour : une boucle while fait toujours au moins un tour, ici il a été sauté par erreur."
            misconception: c3-while-un-tour
            reaction: { who: guide, expr: neutre, text: "while regarde la condition avant d'entrer. Si elle est fausse tout de suite, il n'y a aucun tour : c'est normal, et c'est souvent ce qu'on veut (rien à faire, rien d'affiché)." }
          - text: "Parce que $i++ est placé après echo : il aurait fallu l'écrire avant."
            misconception: c3-incr-avant
            reaction: { who: guide, expr: neutre, text: "La place de $i++ change les valeurs affichées pendant les tours. Mais ici, aucun tour n'a lieu : la condition est fausse avant même le premier." }
          - text: "Parce qu'une boucle doit partir de 0 ou de 1 : avec 10, PHP ne sait pas compter."
            misconception: c3-depart-impose
            reaction: { who: guide, expr: neutre, text: "$i peut partir de n'importe quelle valeur. Ce qui décide, c'est la condition : avec $i qui vaut 10, la question « 10 <= 5 ? » reçoit la réponse non." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N16
    act: 3
    after: [N15]
    requester: guide
    title: "Compter avec for"
    request: "for · départ ; condition ; pas"
    course: "La boucle for"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "Avec $n = 4, combien d'étoiles affiche for ($i = 0; $i < $n; $i++) { echo \"*\"; } ?"
        options:
          - { text: "4 : $i prend les valeurs 0, 1, 2 et 3 ; quand $i vaut 4, la condition 4 < 4 est fausse et la boucle s'arrête. Partir de 0 avec < $n fait exactement $n tours.", ok: true }
          - text: "5 : de 0 à 4, cela fait cinq valeurs."
            misconception: c3-inferieur-inclus
            reaction: { who: guide, expr: neutre, text: "Avec <, la borne n'est pas comprise : le tour où $i vaut 4 n'a pas lieu, puisque 4 < 4 est faux. Il y aurait 5 étoiles avec <=." }
          - text: "3 : en partant de 0, la boucle perd un tour."
            misconception: c3-zero-perd-tour
            reaction: { who: guide, expr: neutre, text: "Partir de 0 ne retire pas de tour : cela décale les valeurs (0, 1, 2, 3 au lieu de 1, 2, 3, 4). Le nombre de tours reste 4." }
          - text: "Une infinité : $i ne change jamais dans la boucle."
            misconception: c3-for-pas-oublie
            reaction: { who: guide, expr: neutre, text: "Dans un for, la troisième partie, $i++, s'exécute à la fin de chaque tour : $i augmente tout seul, sans ligne dans les accolades." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: M07
    act: 3
    after: [N16]
    requester: guide
    title: "Défi de maîtrise · while et for"
    request: "3 programmes, sans indice"
    course: "while et for"
    steps:
      - { id: maitrise, kind: fix, prompt: "Défi de maîtrise" }

  - id: N17
    act: 3
    after: [N16]
    requester: guide
    title: "Compter autrement"
    request: "à rebours · de 2 en 2 · += et -="
    course: "Le pas d'une boucle"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "for ($i = 10; $i <= 1; $i--) { echo $i; } devait compter de 10 à 1. Il n'affiche rien. Pourquoi ?"
        options:
          - { text: "Parce que la condition est vérifiée avant le premier tour : 10 <= 1 est faux, la boucle s'arrête avant de commencer. Une boucle qui descend continue tant que $i >= 1.", ok: true }
          - text: "Parce qu'une boucle for compte toujours en montant : pour descendre, il faut un while."
            misconception: c3-for-monte
            reaction: { who: guide, expr: neutre, text: "for descend très bien : $i-- retire 1 à chaque tour. Il faut seulement que la condition soit vraie au départ, et qu'elle regarde dans le bon sens : $i >= 1." }
          - text: "Parce qu'elle tourne sans fin : $i diminue et ne dépasse jamais 1."
            misconception: c3-descend-infini
            reaction: { who: guide, expr: neutre, text: "Elle aurait tourné sans fin si elle avait commencé. Mais la condition est lue avant le premier tour, et 10 <= 1 est faux : aucun tour." }
          - text: "Parce que $i-- est interdit dans la troisième partie d'un for."
            misconception: c3-for-moins-interdit
            reaction: { who: guide, expr: neutre, text: "La troisième partie accepte tout ce qui change $i : $i++, $i--, $i += 2, $i -= 5… C'est la condition qui est à l'envers." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: N18
    act: 3
    after: [N17]
    requester: guide
    title: "Accumuler"
    request: "somme · produit · .= · la variable préparée avant"
    course: "Accumuler dans une boucle"
    hints: 16
    steps:
      - { id: predire, kind: fix, prompt: "Prédire" }
      - { id: suivre, kind: fix, prompt: "Suivre" }
      - id: comprendre
        kind: explain
        prompt: "Pourquoi $somme = 0; s'écrit-il avant la boucle, et pas dans la boucle ?"
        options:
          - { text: "Avant la boucle, il est exécuté une seule fois : la somme part de 0 puis grandit à chaque tour. Dans la boucle, il serait exécuté à chaque tour et effacerait ce qui a été accumulé.", ok: true }
          - text: "Pour que PHP sache que $somme est un nombre : il faut le déclarer avant de s'en servir."
            misconception: c3-declarer-type
            reaction: { who: guide, expr: neutre, text: "PHP ne demande pas de déclarer le genre d'une variable. Ce qui compte ici, c'est combien de fois la ligne s'exécute : une fois avant la boucle, ou à chaque tour dedans." }
          - text: "C'est pareil : l'ordre des lignes ne change pas le résultat."
            misconception: c3-ordre-indifferent
            reaction: { who: guide, expr: neutre, text: "Dans la boucle, $somme = 0; remet la somme à zéro à chaque tour : à la fin, elle ne contient que le dernier ajout. Ouvre « Pas à pas » pour le voir." }
          - text: "Parce qu'une boucle n'a pas le droit de créer une variable."
            misconception: c3-creation-boucle
            reaction: { who: guide, expr: neutre, text: "Une boucle peut créer des variables. Mais une variable qui accumule doit exister avant le premier tour, et ne plus être remise à zéro ensuite." }
      - { id: completer, kind: fix, prompt: "Compléter" }
      - { id: reparer, kind: fix, prompt: "Réparer" }
      - { id: ecrire1, kind: fix, prompt: "Écrire" }
      - { id: ecrire2, kind: fix, prompt: "Écrire" }
      - { id: ecrire3, kind: fix, prompt: "Écrire" }
      - { id: rappel1, kind: fix, prompt: "Rappel" }
      - { id: rappel2, kind: fix, prompt: "Rappel" }

  - id: M08
    act: 3
    after: [N18]
    requester: guide
    title: "Défi de maîtrise · compter et accumuler"
    request: "3 programmes, sans indice"
    course: "Le pas et l'accumulation"
