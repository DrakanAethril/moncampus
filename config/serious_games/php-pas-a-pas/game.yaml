# PHP pas à pas: learning to program in PHP from the very beginning - BTS SIO 1
# (design/validated/serious-games-php-pas-a-pas.md). A game of the « scénario » mechanic with neither story
# nor character, on SQL pas à pas' shape: the student climbs levels, one notion each, and conditions,
# loops and arrays - one and two dimensions - take 40 of the 52 levels.
#
# Read by `app:serious-games:sync`, which adds the tickets of `tickets/*.yaml` under `scenario.tickets` and
# builds `chapters` from the acts. A ticket is a level, a mastery challenge (« défi de maîtrise ») or the
# final test. **The right answers to the « Comprendre » questions live in those files and nowhere in the
# game's package** (public/serious-games/php-pas-a-pas/), which holds the lessons, the PHP interpreter
# (Service de nuit's php.js), the programs to predict, follow, complete, repair and write with their
# reference and their hidden cases, the written hints, the mastery pools (which the reminders draw from
# too) and the « lectures éclair ». Only {passed, failed} leaves the frame for a measured step; the program
# itself never does.
#
# What this game adds to the mechanic, without touching the server: from the sixth level on, every level
# ends with two reminders the game draws from the mastery pools already passed - the notions the student
# got wrong first -, steps answered by touch (the table of a loop's turns, the box to aim at in an array),
# and the step through. A mastery challenge is untimed and never blocks the next level; a « lecture éclair »
# - eight codes to read in two minutes - is not a ticket at all: the game keeps its best score.
#
# A level done is read again - each step, the student's answer beside the solution, the right explanation
# and why the others are wrong (reviewTicket) - and played again as a replay (replayTicket): the level
# stays done, the stars of the go raise its own when better. « Mon carnet » holds a fiche per notion and
# the PHP functions met (carnet/*.js in the package).
slug: php-pas-a-pas
title: "PHP pas à pas"
pitch: "Apprendre à programmer en PHP depuis zéro, niveau après niveau : un cours court, des exercices de plus en plus libres, et les conditions, les boucles et les tableaux repratiqués sans cesse. Se joue sur téléphone."
subjects: [Informatique]
levels: [BTS SIO 1]
unit_label: niveaux
mechanic: scenario
# The kinds of step: a program measured by the game on its cases, an explanation corrected here.
answer_kinds: [fix, explain, choice]
version: 1.0.0
published: false

words:
  unit: [niveau, niveaux]
  chapter: [chapitre, chapitres]
  lit: [réussi, réussis]
  unlit: [ouvert, ouverts]
  level: étoiles
  skill: notion
  dim_filter: Beaucoup d'aide

scenario:
  # A level keeps the version it was started with; raise it when a step changes.
  version: 1
  # Every ticket whose predecessors are closed is open: the next level, and every mastery challenge not
  # yet won - a challenge never blocks the way.
  capacity: 60
  # Who answers a wrong step: nobody in particular, the game's own voice.
  helper: guide
  password: []
  # A level practises, follows, asks, then writes, then recalls: its repairs are not first (ScenarioValidator).
  free_order: true
  restart_anytime: true
  # A level done can be read again with its corrections and played again: a replay never reopens it, and
  # its stars only raise the level's. The notebook's « vu » and the archive of the student's answers are
  # theirs, not the game's progress: « Recommencer le jeu » keeps them.
  replay: true
  keep_on_new_game: [answers, nseen]
  acts:
    - { n: 1, title: "Afficher et calculer", tools: [console] }
    - { n: 2, title: "Décider", tools: [console] }
    - { n: 3, title: "Répéter", tools: [console] }
    - { n: 4, title: "Les tableaux", tools: [console] }
    - { n: 5, title: "Tableaux à deux dimensions", tools: [console] }
    - { n: 6, title: "Les fonctions", tools: [console] }
    - { n: 7, title: "Révision", tools: [console] }
    - { n: 8, title: "PHP dans une page", tools: [console] }
