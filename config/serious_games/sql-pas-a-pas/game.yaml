# SQL pas à pas: discovering relational databases and MySQL's SQL, for beginners - BTS SIO 1 and NSI
# (design/validated/serious-games-sql-pas-a-pas.md). A game of the « scénario » mechanic with neither story
# nor character: the student climbs levels, one notion each.
#
# Read by `app:serious-games:sync`, which adds the tickets of `tickets/*.yaml` under `scenario.tickets` and
# builds `chapters` from the acts. A ticket is a level, a timed challenge (« défi chrono ») or the final
# test. **The right answers to the « Comprendre » questions live in those files and nowhere in the game's
# package** (public/serious-games/sql-pas-a-pas/), which holds the lessons, the MySQL engine (sql.js), the
# visible base and the hidden one, the queries to predict, complete, repair and write with their reference,
# the written hints and the pools of the timed challenges. Only {passed, failed} leaves the frame for a
# measured step; the query itself never does.
#
# What this game adds to the mechanic: a level's steps come in the order written (`free_order`) - predict,
# understand, complete, repair, then write three queries - and a timed challenge closes each notion. The
# challenge is timed by the game (accommodations' extra time from getUser()), never blocks the next level,
# and is retried as often as wanted, with other questions each time.
slug: sql-pas-a-pas
title: "SQL pas à pas"
pitch: "Découvrir les bases de données et le SQL de MySQL, niveau après niveau : un cours court, des défis de plus en plus autonomes, et un défi chrono pour chaque notion. Se joue sur téléphone."
subjects: [Informatique]
levels: [BTS SIO 1, NSI]
unit_label: niveaux
mechanic: scenario
# The kinds of step: a query measured by the game on its two bases, an explanation or a choice corrected here.
answer_kinds: [fix, explain, choice]
version: 1.0.0
published: false

words:
  unit: [niveau, niveaux]
  chapter: [chapitre, chapitres]
  lit: [réussi, réussis]
  unlit: [ouvert, ouverts]
  level: étoiles
  skill: notion
  dim_filter: Beaucoup d'aide

scenario:
  # A level keeps the version it was started with; raise it when a step changes.
  version: 1
  # Every ticket whose predecessors are closed is open: the next level, and every timed challenge not yet
  # won - a challenge never blocks the way.
  capacity: 60
  # Who answers a wrong step: nobody in particular, the game's own voice.
  helper: guide
  password: []
  # A level practises, asks, then writes: its repairs are not first (ScenarioValidator).
  free_order: true
  restart_anytime: true
  acts:
    - { n: 1, title: "Lire une table", tools: [console] }
    - { n: 2, title: "Combiner les conditions", tools: [console] }
    - { n: 3, title: "Valeurs manquantes et calculs", tools: [console] }
    - { n: 4, title: "Compter et regrouper", tools: [console] }
    - { n: 5, title: "Relier les tables", tools: [console] }
    - { n: 6, title: "Modifier les données", tools: [console] }
    - { n: 7, title: "Créer sa base", tools: [console] }
    - { n: 8, title: "Bonus : sécurité", tools: [console] }
