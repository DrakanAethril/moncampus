# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.documentation_root_group: 'campus'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $ldapBaseDn: '%env(LDAP_BASE_DN)%'
            # Same optional/falls-back-to-$ldapBaseDn shape as $ldapGroupBaseDn below, for the
            # Directory > Users bulk sync - see App\Service\LdapUserSyncer. Login itself
            # (App\Security\LdapAuthenticator) still searches under plain $ldapBaseDn, unaffected -
            # this only scopes the *bulk* sync, which otherwise matches every objectClass=user
            # entry reachable from $ldapBaseDn, including computers/service accounts on a Samba 4
            # AD DC where those are also user-class objects.
            string $ldapUserBaseDn: '%env(LDAP_USER_BASE_DN)%'
            # Optional, defaults to $ldapBaseDn (see App\Service\LdapGroupSyncer/
            # App\Security\LdapUserMapper's resolveGroupBaseDn()) - only needs setting when
            # groups live under a different subtree than users, e.g. a Samba 4 AD DC with users
            # under OU=People and groups under OU=Groups.
            string $ldapGroupBaseDn: '%env(LDAP_GROUP_BASE_DN)%'
            # Same optional/falls-back-to-$ldapBaseDn shape as $ldapGroupBaseDn above, for the
            # Directory > Services/Computers pages - see App\Service\LdapServiceSyncer/
            # LdapComputerSyncer. Production should set these explicitly (e.g.
            # OU=Services,DC=example,DC=lan / CN=Computers,DC=example,DC=lan on a Samba 4 AD DC)
            # rather than relying on the fallback, for the same reason groups needed their own:
            # $ldapBaseDn may be scoped narrower than the whole domain.
            string $ldapServiceBaseDn: '%env(LDAP_SERVICE_BASE_DN)%'
            string $ldapComputerBaseDn: '%env(LDAP_COMPUTER_BASE_DN)%'
            string $ldapSearchDn: '%env(LDAP_SEARCH_DN)%'
            string $ldapSearchPassword: '%env(LDAP_SEARCH_PASSWORD)%'
            # Schema differs by directory flavor - dev's openldap container is classic
            # OpenLDAP/RFC2307 (inetOrgPerson/groupOfNames/uid), production is a Samba 4 AD DC
            # (user/group/sAMAccountName) - see App\Security\LdapAuthenticator,
            # App\Security\LdapUserMapper, App\Service\LdapUserSyncer.
            string $ldapUsernameAttribute: '%env(LDAP_USERNAME_ATTRIBUTE)%'
            string $ldapUserObjectClass: '%env(LDAP_USER_OBJECT_CLASS)%'
            string $ldapGroupObjectClass: '%env(LDAP_GROUP_OBJECT_CLASS)%'
            string $awsCloudfrontDomain: '%env(AWS_CLOUDFRONT_DOMAIN)%'
            string $awsS3PublicEndpoint: '%env(AWS_S3_PUBLIC_ENDPOINT)%'
            string $awsS3Bucket: '%env(AWS_S3_BUCKET)%'
            # App\Service\AudioUploadService and App\Service\VideoUploadService only - every other
            # S3 caller (App\Service\FileUploadService) gets this "for free" via flysystem.yaml's
            # storage-level prefix, since it goes through Flysystem rather than the raw S3Client.
            string $awsS3Prefix: '%env(AWS_S3_PREFIX)%'
            string $gotenbergUrl: '%env(GOTENBERG_URL)%'
            # App\Service\StagedUploadStore signs its tokens with it - a staged upload has no row
            # anywhere, so the token is the record and the signature is what makes it one.
            string $appSecret: '%kernel.secret%'
            # The platform's file-library quota, as a human writes it ("1G", "1 Go") - parsed by
            # App\Service\ByteSize, which is also what the admin's quota field reads. See .env.
            string $fileLibraryDefaultQuota: '%env(FILE_LIBRARY_DEFAULT_QUOTA)%'
            # Blank means scanning is disabled - a different state from "configured but
            # unreachable", which refuses every upload. See App\Service\AntivirusScanner.
            string $antivirusDsn: '%env(ANTIVIRUS_DSN)%'
            # Backgrounds of the printed loan conventions - read from disk and inlined as base64,
            # never served to a browser, hence a plain project path rather than an asset.
            string $loanDocumentResourceDir: '%kernel.project_dir%/resources/laptop_loan_documents'
            # App\Service\WikiPdfStylesheet reads public/katex/ off disk to inline it into the wiki's
            # PDF export - Gotenberg has no browser origin, so a relative asset URL resolves to
            # nothing there.
            string $projectDir: '%kernel.project_dir%'
            string $ldapPasswordAesKey: '%env(AES_KEY)%'
            # App\Service\Crypto\SecretBoxProvider only - the one place that turns this into a
            # App\Service\Crypto\SecretBox. Deliberately not APP_SECRET: see .env.
            string $proxmoxSecretKey: '%env(PROXMOX_SECRET_KEY)%'
            # How many machine consoles may be open at once - App\Service\Console\ConsoleSessionOpener.
            # A ceiling and not a tuning knob: each open console holds one FrankenPHP worker for the
            # length of its exchange. See .env.
            int $consoleMaxSessions: '%env(int:CONSOLE_MAX_SESSIONS)%'
            # Where App\Service\Proxmox\ProxmoxTlsOptions materialises a cluster CA, since
            # HttpClient's `cafile` option wants a path and there is no "here is the PEM" form.
            # Under the cache dir because it is derived data: deleting it costs one file write.
            string $proxmoxCaDir: '%kernel.cache_dir%/proxmox_ca'
            # "Tout le campus", the root of the documentation base's perimeter - the name of the
            # App\Entity\Group every other perimeter group hangs under in Paramètres > Groupes.
            # A name rather than an id so it survives a re-seeded database; if no group carries it,
            # App\Service\DocumentationPerimeter falls back to every group that takes part in the
            # hierarchy rather than to an empty perimeter.
            string $rootGroupName: '%app.documentation_root_group%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # The document formats the quiz import screen accepts. Listed explicitly rather than collected
    # by tag: the order decides which one reads a document that names no known format, and a tagged
    # iterator would order them by whatever the container happened to build first.
    #
    # The mixed format comes first because it is the one the screen teaches; the four family formats
    # that follow are legacy in reading only - the application emitted them, so those files exist,
    # but nothing writes them any more. moncampus-simple/1 is the mixed reader's own delegate for
    # the answer-row types and never has a document of its own to read.
    App\Service\InteractiveQuizImporterRegistry:
        arguments:
            $importers:
                - '@App\Service\MixedJsonImporter'
                - '@App\Service\SimpleJsonImporter'
                - '@App\Service\ZoneJsonImporter'
                - '@App\Service\MatchingJsonImporter'
                - '@App\Service\NumericJsonImporter'
                - '@App\Service\ShortAnswerJsonImporter'

    # LDAP client used by App\Security\LdapAuthenticator to bind/search the directory - built via
    # a factory, not a plain argument array, so the TLS CA-cert options can be omitted entirely
    # for dev's plain-LDAP container while production verifies its LDAPS certificate - see
    # App\Service\LdapAdapterFactory.
    #
    # Tagged kernel.reset so its underlying ext-ldap connection gets dropped (Adapter::reset())
    # after every request, not just once when this shared service is first built. Without this,
    # FrankenPHP worker mode (frankenphp/Caddyfile's "worker { file ./public/index.php }") keeps
    # this same Adapter instance - and the one TCP/TLS connection it opened - alive across every
    # request handled by that worker process for as long as it runs, so the first LDAP-server- or
    # firewall-side idle timeout after a login kills that connection and every later login on the
    # same worker fails with a connect error until the worker itself eventually recycles.
    Symfony\Component\Ldap\Adapter\ExtLdap\Adapter:
        factory: ['App\Service\LdapAdapterFactory', 'create']
        arguments:
            $host: '%env(LDAP_HOST)%'
            $port: '%env(int:LDAP_PORT)%'
            $encryption: '%env(LDAP_ENCRYPTION)%'
            $tlsCaCertPath: '%env(LDAP_TLS_CA_CERT_PATH)%'
        tags:
            - { name: 'kernel.reset', method: 'reset' }

    Symfony\Component\Ldap\Ldap:
        arguments: ['@Symfony\Component\Ldap\Adapter\ExtLdap\Adapter']

    Symfony\Component\Ldap\LdapInterface: '@Symfony\Component\Ldap\Ldap'

    # S3 client backing the "uploads.storage" Flysystem storage (config/packages/flysystem.yaml) -
    # built via a factory, not a plain argument array, so the endpoint/path-style options can be
    # omitted entirely for real AWS rather than sent empty - see App\Service\S3ClientFactory.
    Aws\S3\S3Client:
        factory: ['App\Service\S3ClientFactory', 'create']
        arguments:
            $region: '%env(AWS_S3_REGION)%'
            $accessKeyId: '%env(AWS_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(AWS_SECRET_ACCESS_KEY)%'
            $endpoint: '%env(AWS_S3_ENDPOINT)%'

    # Error alerting to Discord (prod only, see config/packages/monolog.yaml).
    #
    # The handler gets its own HTTP client rather than the shared "http_client" service on
    # purpose: that one is wired to Monolog, so every failure it logs would come straight back
    # into the handler that triggered the call - exactly when Discord is unreachable, i.e. exactly
    # when the loop is worst. This one has no logger at all. The short timeouts matter too: the
    # call blocks the request that just failed, and an unreachable webhook must not turn a 500
    # into a 30-second 500.
    app.discord_alert_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            $defaultOptions: { timeout: 3, max_duration: 5 }

    App\Monolog\DiscordWebhookHandler:
        arguments:
            $httpClient: '@app.discord_alert_http_client'

    # --- Console Proxmox --------------------------------------------------------------------
    # Its own HTTP client, on the same reasoning as the Discord one above but for a different
    # danger: these calls go to hypervisors that are routinely off. FrankenPHP runs in worker mode,
    # so a request that hangs holds a worker for as long as it hangs. Enough unreachable hosts
    # starve the pool and take the entire application down with them; a slow hypervisor is a failed
    # call, not a reason to wait.
    #
    # **Three options, and each covers a phase the others do not.** `timeout` is the *idle* timeout,
    # enforced by Symfony in PHP-land - it is not a connection timeout, and reading it as one is how
    # the first version of this block came to have no bound at all on the phase that matters most
    # here. CurlHttpClient maps `max_duration` to CURLOPT_TIMEOUT_MS and `max_connect_duration` to
    # CURLOPT_CONNECTTIMEOUT_MS; without the latter, a firewalled port falls back to curl's own
    # default of **300 seconds** to connect.
    #
    # The numbers are chosen against PHP's `max_execution_time` of 30 s, not out of taste. A screen
    # may chain a handful of calls, so a single call has to cost a small fraction of the budget:
    # at 8 s apiece, three consecutive failures still answer well inside it. Raising them means
    # re-checking that arithmetic - the production incident of 2026-08-19 was two calls at 20 s
    # against a blocked port, and a fatal MaxExecutionTimeError is not catchable, so the screen
    # showed nothing and Discord got the alert instead.
    app.proxmox_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            $defaultOptions: { timeout: 5, max_duration: 8, max_connect_duration: 4 }

    App\Service\Proxmox\ProxmoxClientFactory:
        arguments:
            $proxmoxHttpClient: '@app.proxmox_http_client'
            $proxmoxTicketCache: '@cache.proxmox_ticket'

    # --- Courrier école ---------------------------------------------------------------------
    # The Courrier école storage and queues live in *another AWS account* than the uploads above
    # (the one carrying SES and the Route 53 zone) and in another region (eu-west-3, imposed by
    # SES reception, which requires a co-located bucket). Hence a second complete set of client
    # and credentials, rather than a prefix on the existing one: these are neither the same keys,
    # nor the same account, nor the same personal-data boundary.
    #
    # Named services and not autowired by type: Aws\S3\S3Client is already taken by the uploads
    # storage, and the two must on no account be confused.
    mail.s3_client:
        class: Aws\S3\S3Client
        factory: ['App\Service\S3ClientFactory', 'create']
        arguments:
            $region: '%env(AWS_MAIL_REGION)%'
            $accessKeyId: '%env(AWS_MAIL_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(AWS_MAIL_SECRET_ACCESS_KEY)%'
            $endpoint: '%env(AWS_MAIL_S3_ENDPOINT)%'

    mail.sqs_client:
        class: Aws\Sqs\SqsClient
        factory: ['App\Service\SqsClientFactory', 'create']
        arguments:
            $region: '%env(AWS_MAIL_REGION)%'
            $accessKeyId: '%env(AWS_MAIL_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(AWS_MAIL_SECRET_ACCESS_KEY)%'
            $endpoint: '%env(AWS_MAIL_SQS_ENDPOINT)%'

    App\Service\InboundMailProcessor:
        arguments:
            $mailS3Client: '@mail.s3_client'
            $mailBucket: '%env(AWS_MAIL_BUCKET)%'
            $studentMailDomain: '%env(MAIL_STUDENT_DOMAIN)%'

    App\Controller\SchoolMailAttachmentController:
        arguments:
            $mailS3Client: '@mail.s3_client'
            $mailBucket: '%env(AWS_MAIL_BUCKET)%'

    App\Controller\Api\SchoolMailController:
        arguments:
            $mailS3Client: '@mail.s3_client'
            $mailBucket: '%env(AWS_MAIL_BUCKET)%'

    App\Service\SchoolMailSender:
        arguments:
            $mailS3Client: '@mail.s3_client'
            $mailBucket: '%env(AWS_MAIL_BUCKET)%'
            $region: '%env(AWS_MAIL_REGION)%'
            $configurationSet: '%env(AWS_MAIL_CONFIGURATION_SET)%'

    App\Command\ConsumeInboundMailCommand:
        arguments:
            $mailSqsClient: '@mail.sqs_client'
            $inboundQueueUrl: '%env(AWS_MAIL_INBOUND_QUEUE_URL)%'

    App\Command\ConsumeMailEventsCommand:
        arguments:
            $mailSqsClient: '@mail.sqs_client'
            $eventsQueueUrl: '%env(AWS_MAIL_EVENTS_QUEUE_URL)%'

    App\Command\ReconcileInboundMailCommand:
        arguments:
            $mailS3Client: '@mail.s3_client'
            $mailBucket: '%env(AWS_MAIL_BUCKET)%'
