# Le changelog de MonCampus, tel que la page /changelog le rend (App\Service\Changelog).
#
# Il vit ici, dans le dépôt, et non en base : le changelog fait partie de la livraison, il part donc
# en production avec elle. Rien à lancer sur le serveur, rien qui puisse se désynchroniser.
#
# Une version = une mise en production. Le numéro suit le calendrier — année.mois.rang dans le mois —
# parce que le lecteur est un membre du personnel, pas un développeur : « la 3e version d'août » se
# situe, « 1.4.2 » ne dit rien de plus qu'un compteur.
#
# Chaque entrée porte un type :
#   nouveaute    — quelque chose qui n'existait pas
#   modification — quelque chose qui existait et qui change
#   fix          — quelque chose qui ne marchait pas
#   interne      — le code lui-même : outillage, performances, refactorisations. Replié sur la page.
#   autre        — le reste (publications d'applications mobiles, documentation…)
#
# Les versions les plus récentes en premier, par convention ; l'ordre du fichier n'a toutefois aucune
# importance, la lecture retrie par date.
#
# Ce fichier est écrit par le skill /beaup-deploy au moment du déploiement. L'historique antérieur au
# 2026-08-10 a été reconstitué depuis les fusions dans `main`, une version par jour de mise en
# production. Avant le 2026-07-05, le dépôt ne portait pas cette application mais le gabarit
# dunglas/symfony-docker dont elle est issue : il n'y a rien à en dire ici.

releases:
    - version: '2026.08.10'
      date: '2026-08-10'
      summary: "Une rubrique d'aide rédigée pour les enseignants et l'administration, et ce changelog."
      entries:
          - type: nouveaute
            title: "Rubrique d'aide"
            detail: "Neuf rubriques, trente-deux articles pas-à-pas, seize questions fréquentes et un glossaire. Accessible depuis le menu de votre avatar. Chaque article est adressé à un public : vous ne voyez que ce qui vous concerne."
          - type: nouveaute
            title: 'Changelog'
            detail: "La page que vous lisez : ce qui est mis en production, version par version."
          - type: modification
            title: "L'aide sait parler deux langues"
            detail: "Un article traduit en anglais garde la même adresse ; les articles non traduits restent lisibles en français."
          - type: interne
            title: "Numéro de version affiché sur la page « À propos »"
          - type: interne
            title: "Règles de branches GitHub et signature des commits"
            detail: "La production n'est plus atteignable que par une pull request dont la CI est verte."
          - type: interne
            title: 'Les mises en production sont annoncées sur Discord'
            detail: "Un message au démarrage, un à la réussite avec le résumé de la version, un à l'échec avec le lien vers le journal."
          - type: interne
            title: "La réussite n'est annoncée qu'une fois l'application revenue"
            detail: "Le déploiement attend que la page de connexion réponde, plutôt que de se fier au retour du script d'installation."

