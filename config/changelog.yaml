# The MonCampus changelog, as the /changelog page renders it (App\Service\Changelog).
#
# It lives here, in the repository, and not in the database: the changelog is part of the release, so
# it goes to production with it. Nothing to run on the server, nothing that can drift out of sync.
#
# One version = one production release, and its number is the date of that release: 2026.08.10. A
# second deploy on the same day takes a rank, 2026.08.10.2, and so on.
#
# The monthly rank used until 2026-08-10 (« 11th version of August ») was dropped: as long as it
# stayed below 31, it read as a day number. Version 2026.08.11 dated 10 August proved it on the very
# day it shipped.
#
# Each entry carries a type:
#   nouveaute    — something that did not exist
#   modification — something that existed and is changing
#   fix          — something that was not working
#   interne      — the code itself: tooling, performance, refactorings. Collapsed on the page.
#   autre        — the rest (mobile app releases, documentation…)
#
# Most recent versions first, by convention; the file order carries no weight, however, since reading
# it sorts by date again.
#
# This file is written by the /beaup-deploy skill at deploy time. The history before 2026-08-10 was
# reconstructed from the merges into `main`, one version per production day. Before 2026-07-05, the
# repository did not carry this application but the dunglas/symfony-docker template it came from:
# there is nothing to say about it here.

releases:
    - version: '2026.08.29'
      date: '2026-08-29'
      summary: "Un identifiant de connexion et une adresse Courrier école appartiennent définitivement au compte qui les a portés : renommer un compte garde tout son historique et ne libère plus rien pour quelqu'un d'autre. Les messages envoyés par la plateforme s'ouvrent désormais sur « Bonjour, » sans prénom, et la description technique de l'application redit ce qu'elle est."
      entries:
          - type: modification
            title: "Un identifiant de connexion n'est jamais réattribué"
            detail: "Changer l'identifiant d'un compte conservait l'ancien nulle part, et il pouvait finir attribué à quelqu'un d'autre — qui héritait alors du courrier du premier. La fiche liste maintenant tous les identifiants qu'un compte a portés : aucun ne sera jamais donné à un autre compte, et celui à qui il appartient peut le reprendre."
          - type: modification
            title: "Une adresse Courrier école retirée est conservée"
            detail: "Retirer une adresse de la liste ne l'efface plus : elle continue de recevoir, n'est plus utilisée pour écrire, et ne sera jamais attribuée à un autre élève. Les adresses retirées restent visibles sur la fiche, et la remettre dans la liste reprend la même."
          - type: fix
            title: "Une adresse déjà attribuée est refusée avec son message"
            detail: "Saisir une adresse déjà portée par un autre élève faisait échouer l'enregistrement sans rien expliquer. Le refus s'affiche maintenant sur la ligne concernée, en nommant l'élève qui la détient."
          - type: modification
            title: "Les messages de la plateforme commencent par « Bonjour, »"
            detail: "Le prénom du destinataire n'apparaît plus dans la formule d'ouverture : elle était trop familière pour une partie des personnes écrites, tuteurs et familles comprises."
          - type: nouveaute
            title: "Un emploi du temps en PDF sur une formation"
            detail: "L'équipe UFA peut déposer un document d'emploi du temps sur une formation, à côté du calendrier de l'alternance. C'est un document à titre indicatif, sans lien avec l'emploi du temps de la plateforme, et il se consulte depuis la formation."
          - type: modification
            title: "La description technique redit ce qu'est l'application"
            detail: "Son texte datait de mi-août : les sondages, le jeu du campus et les machines virtuelles de travaux pratiques y figurent maintenant, la liste des services extérieurs est complète et celle des traitements automatiques est exacte."
          - type: interne
            title: "La documentation du code remise à jour"
    - version: '2026.08.28'
      date: '2026-08-28'
      summary: "Un bandeau prévient désormais tout le monde qu'une mise à jour de la plateforme est en cours, quelques minutes avant le redémarrage qui la rend brièvement indisponible. Les quiz rédigés avec une IA s'importent par lots au lieu d'un par un, les filtres qui ne répondaient plus fonctionnent à nouveau, et le jeu du campus gagne le choix de son titre et un écran de suivi pour l'administration."
      entries:
          - type: nouveaute
            title: "Prévenu avant une mise à jour de la plateforme"
            detail: "Un bandeau annonce sur chaque page qu'une mise à jour est en cours : la plateforme redémarre dans les minutes qui suivent et reste indisponible le temps du redémarrage, généralement moins de cinq minutes. Il apparaît même sur un onglet resté ouvert, et disparaît de lui-même une fois la mise à jour terminée."
          - type: nouveaute
            title: "Importer plusieurs quiz en une fois"
            detail: "Les quiz obtenus d'une IA se collent les uns à la suite des autres, ou se déposent en archive : chacun devient son propre quiz. L'écran de vérification les présente un par un avant création, et chacun peut être renommé ou écarté du lot."
          - type: fix
            title: "Les barres de filtres répondent à nouveau"
            detail: "Depuis une semaine, choisir un filtre ne changeait plus rien sur les écrans concernés. Les filtres se soumettent de nouveau, et les classes se choisissent une par une avec « Toutes » par défaut."
          - type: modification
            title: "Toutes les séquences restent à portée pendant le placement"
            detail: "En créant une progression à partir de plusieurs séquences, le placement n'ouvrait que la première. Un rail les liste maintenant toutes, dans l'ordre de la progression, avec l'état de chacune."
          - type: nouveaute
            title: "Choisir le titre que l'on affiche"
            detail: "Un étudiant choisit son titre parmi ceux des niveaux qu'il a atteints, dans chacune des filières qu'il joue. « Suivre mon niveau » reste le défaut et le chemin de retour."
          - type: modification
            title: "Le médaillon plutôt qu'une pastille"
            detail: "Le tableau des niveaux montre l'avatar du lecteur dans chacun des six anneaux : ce qu'un niveau change, c'est le médaillon porté partout. Un étudiant dont l'option ne nomme aucune filière joue désormais dans toutes celles de sa formation."
          - type: nouveaute
            title: "Suivre le jeu d'une classe"
            detail: "L'administration dispose d'un écran de suivi par formation : ce que chaque action a réellement produit, les seuils de niveau face aux totaux observés, et le journal complet des points. Le pseudonyme protège l'anonymat entre étudiants ; l'équipe qui encadre la classe y voit les noms, comme sur ses autres écrans."
          - type: fix
            title: "Le barème du jeu dit enfin la vérité sur les points"
            detail: "« L'XP ne redescend jamais » était faux : un malus y écrit une ligne négative. Ce qui est acquis pour toujours, c'est le niveau, le titre et la récompense, jamais le total. Le barème parle d'actions et l'assiduité dit ce qu'elle mesure."
          - type: modification
            title: "Le catalogue des récompenses est rangé"
            detail: "Les cadres apparaissent dans l'ordre des points qui les ouvrent. Le trophée de promotion est retiré : il était décerné à une place que l'application ne peut pas connaître."
          - type: interne
            title: "Un avertissement de moins dans le journal de chaque déploiement"
    - version: '2026.08.27'
      date: '2026-08-27'
      summary: "Le jeu du campus arrive : une progression par niveaux, des classements de classe anonymes et un catalogue de récompenses, à activer formation par formation et éteint partout au départ. Les comptes administrateurs peuvent par ailleurs se connecter par lien reçu par courriel, comme tous les autres."
      entries:
          - type: nouveaute
            title: "Le jeu du campus"
            detail: "Une progression par niveaux, des classements de classe et des récompenses, pour rendre visible ce qu'un étudiant fait déjà. Le dispositif est éteint partout et s'active formation par formation ; rien n'est visible tant qu'une équipe ne l'a pas décidé."
          - type: nouveaute
            title: "On est classé sur un taux, jamais sur un total"
            detail: "L'indice est un nombre sur 100 et chaque famille montre son dénominateur. Une famille sans donnée sort d'elle-même du calcul et son poids se redistribue, pour qu'un étudiant arrivé en cours d'année ne soit pas désavantagé."
          - type: nouveaute
            title: "Aucune absence n'est enregistrée"
            detail: "Le relevé d'assiduité pose une seule question par étudiant et par unité de temps, et ne conserve ni date, ni motif, ni compteur. « Hors comptage » retire l'unité du calcul au lieu de coûter des points."
          - type: nouveaute
            title: "Les points comptent sur le mois de leur obtention"
            detail: "Un classement du mois et un classement de l'année, individuels et par équipe, avec la possibilité de revenir sur les mois précédents. Une formation choisit les mois qu'elle veut voir classés ; les trois premiers d'un mois classé reçoivent des points à sa clôture."
          - type: nouveaute
            title: "Un étudiant garde ses points toute sa scolarité"
            detail: "Changer de formation ne remet rien à zéro : l'étudiant y arrive au niveau que ses points lui donnent."
          - type: nouveaute
            title: "Les classements sont anonymes"
            detail: "Chaque étudiant choisit un pseudonyme parmi trois figures tirées au sort dans sa filière, et un mode discret permet de sortir de tout classement."
          - type: nouveaute
            title: "Une récompense ne donne jamais de points"
            detail: "Les récompenses sont symboliques ou consommables et ne déplacent aucun classement. Un consommable se dépense par l'étudiant lui-même."
          - type: nouveaute
            title: "L'étudiant voit d'où vient chaque point"
            detail: "Une page « Leveling » dans le menu du profil réunit le total personnel, le niveau, l'équipe, les classements, l'historique complet des points et les règles d'attribution des bonus et du malus."
          - type: nouveaute
            title: "Les administrateurs peuvent se connecter par lien reçu par courriel"
            detail: "La connexion par lien s'ouvre à tous les comptes. Le lien ne part que vers une adresse de contact confirmée par son propriétaire, il est à usage unique et expire au bout d'une heure."
          - type: modification
            title: "« Fonctionnalités » se trouve désormais dans le menu Configuration"
            detail: "L'écran décide du contenu des deux espaces de réglages : il se range à côté d'eux plutôt que dans Gestion."
    - version: '2026.08.26'
      date: '2026-08-26'
      summary: "Un quiz d'évaluation peut désormais se passer en mode contrôle : l'étudiant est prévenu à l'entrée de ce qui sera enregistré, un bandeau l'avertit s'il quitte la page, et l'enseignant dispose ensuite d'une frise détaillée de la passation pour en juger lui-même. La bibliothèque de sondages se range par ailleurs en dossiers, comme celle des quiz."
      entries:
          - type: nouveaute
            title: "Passer un quiz d'évaluation en mode contrôle"
            detail: "L'enseignant choisit, quiz par quiz, si la passation est surveillée et ce qu'il advient lorsqu'un étudiant quitte la page : rien, un avertissement, ou la remise de la copie. Les quiz déjà lancés ne sont pas concernés : la surveillance ne s'active jamais rétroactivement."
          - type: nouveaute
            title: "L'étudiant est prévenu avant de commencer"
            detail: "Un écran d'entrée annonce ce qui sera enregistré, qui pourra le lire et pendant combien de temps. Rien n'est enregistré avant le clic sur « Commencer »."
          - type: nouveaute
            title: "Un avertissement pendant la passation, plutôt qu'après"
            detail: "Le bandeau énonce des faits — les sorties de page constatées — sans accuser, sans bloquer quoi que ce soit et sans interrompre la composition. Lorsque la copie est remise automatiquement, l'écran de remise en donne la raison."
          - type: nouveaute
            title: "La frise de passation et la décision d'examen"
            detail: "L'enseignant lit, question par question, le temps d'affichage et les faits constatés, et peut consigner une décision signée et datée. Aucune note n'est modifiée, et l'application ne conclut rien à la place de personne."
          - type: modification
            title: "Le temps passé sur chaque question est mesuré par le serveur"
            detail: "Recharger la page ne remet plus le minuteur à neuf. Le temps est montré à l'étudiant dans sa correction, même lorsque la note est différée, et à l'enseignant sur la copie."
          - type: modification
            title: "L'application mobile doit être à jour pour une passation surveillée"
            detail: "La version Android 2.6.0, disponible au téléchargement, est nécessaire pour composer un quiz en mode contrôle depuis le téléphone. Les autres quiz restent accessibles comme avant."
          - type: nouveaute
            title: "Classer la bibliothèque de sondages en dossiers"
            detail: "Un dossier se crée, se renomme et se déplace, et un modèle s'y range en le faisant glisser. Supprimer un dossier ne supprime aucun modèle : son contenu remonte d'un niveau. La recherche porte sur toute la bibliothèque."
          - type: fix
            title: "Un champ de fichier obligatoire refuse proprement un envoi vide"
            detail: "L'envoi sans pièce jointe affiche désormais un message clair au lieu d'échouer sans explication."
          - type: autre
            title: "Application mobile MonCampus 2.6.0"
            detail: "Nouvelle version Android disponible au téléchargement."
    - version: '2026.08.25.2'
      date: '2026-08-25'
      summary: "L'établissement choisit désormais, fonctionnalité par fonctionnalité et profil par profil, ce qui est ouvert dans MonCampus, avec la possibilité de faire une exception pour une personne en particulier. Le tour de l'application s'en trouve resserré : chacun ne voit plus que ce qui le concerne, et les rubriques sans contenu ne s'affichent plus."
      entries:
          - type: nouveaute
            title: "Choisir les fonctionnalités ouvertes à chaque profil"
            detail: "L'administration ouvre ou ferme chaque fonctionnalité pour les étudiants, les enseignants et les autres profils, peut la régler formation par formation, et faire une exception pour une personne. Une fonctionnalité fermée disparaît des menus et n'est plus atteignable, même par un lien direct."
          - type: modification
            title: "Chacun ne voit plus que les écrans qui le concernent"
            detail: "Seules les fonctionnalités que l'établissement utilise aujourd'hui sont ouvertes ; les autres restent en sommeil et se rallument à la demande, d'un clic, sans attendre une mise à jour."
          - type: modification
            title: "Une rubrique sans entrée disponible n'est plus affichée"
            detail: "Plus de menu qui s'ouvre sur du vide, ni de classe dont aucun écran n'est accessible dans la liste de sa section."
          - type: nouveaute
            title: "Signaler un problème depuis l'accueil"
            detail: "Les tableaux de bord étudiant et enseignant se terminent par un accès direct au signalement, dès lors que le support est ouvert."
          - type: nouveaute
            title: "Documents et compétences d'une formation en alternance"
            detail: "Le calendrier de l'alternance se dépose en PDF sur la formation, et ses groupes de compétences se consultent au même endroit."
          - type: modification
            title: "« Mes wikis » devient « Wikis partagés »"
            detail: "L'entrée n'apparaît que si un wiki a effectivement été partagé avec vous."
          - type: modification
            title: "Un administrateur peut modifier sa propre fiche"
            detail: "Adresse de contact, avatar : chacun tient sa propre fiche, sans pouvoir fermer son propre compte ni toucher à celle d'un autre administrateur."
          - type: modification
            title: "Un rappel vers EcoleDirecte"
            detail: "Une bannière rappelle aux étudiants et aux enseignants la plateforme de référence de l'établissement."
          - type: autre
            title: "Applications mobiles MonCampus 2.5.0 et e-CO 1.1.0"
            detail: "Nouvelles versions Android disponibles au téléchargement."
          - type: interne
            title: "L'application mobile connaît les fonctionnalités ouvertes"
            detail: "Elle les reçoit à la connexion, et chaque appel reste vérifié de son côté."
          - type: interne
            title: "Le contrôle des fonctionnalités est vérifié écran par écran"
            detail: "Chaque écran déclare la fonctionnalité dont il dépend, et un test refuse qu'un écran y échappe."
    - version: '2026.08.25'
      date: '2026-08-25'
      summary: "L'administration peut désormais désactiver, réactiver ou renommer un compte, et suivre l'aboutissement de chaque opération. Un compte fermé ne peut plus se connecter, par aucun chemin, et la réinitialisation de mot de passe par l'administration cède la place au lien de connexion par e-mail."
      entries:
          - type: nouveaute
            title: "Désactiver, réactiver ou renommer un compte"
            detail: "La fermeture d'un compte prend effet immédiatement sur MonCampus, et les autres services de l'établissement suivent dans la minute. Un changement de login n'est appliqué qu'une fois qu'il a été confirmé et relu, jamais par avance."
          - type: nouveaute
            title: "Suivre l'aboutissement des opérations de comptes"
            detail: "Chaque demande dit où elle en est, jusqu'à la vérification de sa prise en compte, et peut être relancée si elle a échoué."
          - type: modification
            title: "Un compte fermé ne peut plus se connecter"
            detail: "Quel que soit le chemin employé — identifiant, adresse e-mail, lien de connexion, application mobile — et une session déjà ouverte est interrompue. Le message affiché ne dit jamais si le mot de passe était bon."
          - type: modification
            title: "La réinitialisation de mot de passe par l'administration est retirée"
            detail: "Le lien de connexion envoyé par e-mail la remplace. Chacun peut par ailleurs toujours changer son mot de passe depuis son profil."
          - type: interne
            title: "Les mots de passe ne sont ni conservés ni relus"
            detail: "L'application ne dispose d'aucun chemin de lecture d'un mot de passe, et l'historique correspondant a été effacé."
          - type: interne
            title: "Le contrôle des accès de l'annuaire tient en un seul endroit"
            detail: "Une même règle est appliquée à tous les points d'entrée, et les gestes de gestion de compte vivent dans leur propre contrôleur."
    - version: '2026.08.24'
      date: '2026-08-24'
      summary: "La connexion accepte désormais l'adresse e-mail de contact autant que l'identifiant. Côté préparation des contenus, un quiz s'associe directement à une séquence ou à une séance, et le sommaire du wiki laisse sa largeur au texte tant qu'on ne le demande pas."
      entries:
          - type: nouveaute
            title: "Se connecter avec son adresse e-mail"
            detail: "Le champ identifiant accepte l'adresse de contact, à condition qu'elle ait été confirmée au préalable. Le mot de passe reste demandé comme avant."
          - type: nouveaute
            title: "Associer un quiz à une séquence ou à une séance"
            detail: "La carte « Quiz de la séquence » liste tous les quiz rattachés, quel que soit le niveau auquel ils pendent, et la séance reçoit la même carte. Détacher un quiz ne le supprime jamais de la bibliothèque."
          - type: modification
            title: "Créer et importer un quiz dans le dossier où l'on se trouve"
            detail: "L'import emporte désormais le dossier courant, comme la création le faisait déjà, et le fil d'Ariane d'un quiz porte son classement."
          - type: modification
            title: "Le sommaire d'une page de wiki s'affiche à la demande"
            detail: "Il n'occupe plus une colonne en permanence : un bouton l'ouvre et le referme, sur les pages qui ont des titres. Le texte y gagne près d'un quart de sa largeur."
          - type: modification
            title: "Copier un bloc de code du wiki en un clic"
            detail: "Le bouton de copie est visible au repos et non plus seulement au survol. Les blocs de code et le code en ligne adoptent la police à chasse fixe du système, à l'écran comme à l'export PDF."
          - type: modification
            title: "Le menu aligne quatre bibliothèques"
            detail: "Séquences et séances, quiz, fichiers puis sondages se suivent désormais, et les écrans de sondage reprennent le nom que porte le menu."
          - type: modification
            title: "La description d'un quiz s'affiche en infobulle dans les listes"
            detail: "La colonne difficulté écrit par ailleurs « Mixte » avec sa majuscule."
          - type: fix
            title: "Les sous-dossiers s'affichent avant les fichiers"
            detail: "Dans la bibliothèque de fichiers, la liste d'un dossier comme les résultats de recherche sortaient les fichiers en premier."
    - version: '2026.08.23'
      date: '2026-08-23'
      summary: "La bibliothèque de quiz se range en dossiers, et un dossier entier de la bibliothèque de fichiers se partage désormais à une classe, sous-dossiers compris. L'export PDF d'une progression peut par ailleurs se passer des dates de séances, pour servir de pièce de justification sans avoir à placer chaque séance dans l'emploi du temps."
      entries:
          - type: nouveaute
            title: 'Classer ses quiz en dossiers'
            detail: "La bibliothèque de quiz adopte l'arborescence de la bibliothèque de fichiers : les dossiers à gauche, le contenu à droite, et le déplacement soit en glissant une ligne, soit par le menu de fin de ligne. Supprimer un dossier ne supprime jamais les quiz qu'il contient : ils remontent d'un niveau. La recherche, elle, porte sur toute la bibliothèque."
          - type: nouveaute
            title: 'Partager un dossier entier à une classe'
            detail: "Le partage porte tout le sous-arbre : le contenu, les sous-dossiers, et ce qui y sera déposé plus tard. Les étudiants ouvrent un écran de lecture propre au dossier. Un dossier partagé compte ses mises à disposition comme un fichier, et sa suppression nomme d'abord les classes concernées."
          - type: nouveaute
            title: "Un export PDF de progression sans les dates de séances"
            detail: "Le bouton d'export propose une seconde version du document, qui ne parle plus d'heures placées mais de volumes et de mois : elle n'oblige donc pas à placer chaque séance dans l'emploi du temps, ni à refaire le document à chaque changement. Une vue d'ensemble, délibérément pas une vue exacte. Le document d'origine reste disponible, inchangé."
          - type: modification
            title: "Retouches de l'espace wiki"
            detail: "Les pièces jointes se replient derrière une ligne discrète au lieu d'occuper un panneau sous chaque page, Bash rejoint les langages du bloc de code, chaque bloc de code reçoit un bouton pour le recopier, et un mot ou une adresse très longue revient à la ligne au lieu de déborder — à l'écran comme à l'impression."
          - type: modification
            title: "« Partager » rejoint « Enregistrer » sur un quiz"
            detail: "Les deux boutons vivaient dans deux barres différentes, à deux bouts de l'écran ; ils voisinent désormais."
          - type: fix
            title: "Le bouton d'import de la bibliothèque de fichiers ne répondait pas"
            detail: "Le clic ne faisait rien, à tous les niveaux de l'arborescence."
          - type: fix
            title: "Le menu d'une ligne de la bibliothèque n'est plus rogné"
            detail: "Sur une carte plus courte que le menu, la moitié des entrées devenaient illisibles."
    - version: '2026.08.22'
      date: '2026-08-22'
      summary: "Les enseignants ouvrent désormais un terminal sur les machines virtuelles de leurs classes, depuis le navigateur et sans rien installer : ils voient l'écran de toute la classe d'un coup d'œil, envoient une commande à toutes les machines à la fois et reportent la séance dans le cahier de texte. Les machines sont par ailleurs livrées éteintes, et leurs listes d'administration se filtrent au lieu de se parcourir hôte par hôte."
      entries:
          - type: nouveaute
            title: 'Un terminal sur ses machines virtuelles'
            detail: "Depuis « Mes machines virtuelles », un enseignant ouvre un terminal sur les machines dont il détient un compte, sans rien installer sur son poste. L'accès est réservé aux enseignants de la classe à qui les machines sont destinées, et chaque ouverture est tracée."
          - type: nouveaute
            title: "Voir où en est toute la classe"
            detail: "Un mur en lecture seule montre l'écran de chacune des machines du lot, rafraîchi tout seul. Un clic ouvre celle qu'on veut regarder de près. Une machine éteinte ou injoignable y est nommée comme telle sans empêcher les autres de s'afficher."
          - type: nouveaute
            title: "Envoyer une commande à toutes les machines d'un lot"
            detail: "Installer la même chose partout ne demande plus d'ouvrir chaque machine une par une. La diffusion s'arme explicitement, le terminal change alors d'aspect pour qu'on ne la confonde pas avec une session ordinaire, chaque envoi nomme le nombre de machines concernées avant de partir, et l'armement se relâche seul après dix minutes."
          - type: nouveaute
            title: 'Une palette de commandes et des extraits partagés'
            detail: "Ses propres extraits, ceux que ses collègues ont partagés, un catalogue fourni avec la plateforme et ce qui a déjà été tapé sur la machine, au même endroit. Une commande s'insère pour être relue avant d'être lancée, et la dernière commande passée s'enregistre comme extrait sans quitter l'écran."
          - type: nouveaute
            title: 'Envoyer et récupérer un fichier depuis le terminal'
            detail: "Un fichier part vers la machine ou en revient sans passer par un autre outil. Ce qui remonte atterrit dans la bibliothèque de fichiers de la personne, dans un dossier au nom du lot."
          - type: nouveaute
            title: 'Reporter la séance dans le cahier de texte'
            detail: "Le cahier de texte du jour s'ouvre pré-rempli des commandes de la séance — les commandes, pas les pages de sortie qu'elles ont produites. Rien n'est enregistré tant que la personne n'a pas validé, et un cahier déjà rempli n'est jamais écrasé."
          - type: modification
            title: 'Les machines sont livrées éteintes'
            detail: "Une machine était démarrée pour être configurée, puis laissée allumée : une classe entière montée un après-midi tournait jusqu'à ce que quelqu'un s'en aperçoive. C'est désormais la personne à qui elle est destinée qui la démarre."
          - type: modification
            title: "L'adresse d'une machine se copie d'un clic"
            detail: "Elle s'affiche sous le nom de la machine, avec un bouton pour la recopier."
          - type: modification
            title: "Les listes de machines et d'images se filtrent"
            detail: "Elles couvrent maintenant tous les serveurs de virtualisation à la fois, avec un filtre par serveur, par état et par lot d'installation, et une pagination. Le menu qui obligeait à choisir un serveur avant de voir quoi que ce soit disparaît, et la liste des installations indique la date de création."
          - type: fix
            title: 'Les tailles annoncées en gibioctets'
            detail: "Les fiches de machines écrivaient « Go » sur des valeurs qui sont des gibioctets, comme le reste de l'application le dit déjà."
          - type: interne
            title: 'Rétention et documentation des tâches planifiées'
            detail: "La documentation de production distinguait mal les tâches réellement planifiées des diagnostics et des imports ponctuels, et la purge des données de rétention n'était branchée nulle part."
    - version: '2026.08.21.3'
      date: '2026-08-21'
      summary: "Les machines virtuelles de chacun s'affichent désormais en fiches : l'état, les caractéristiques, les comptes ouverts sur la machine et le choix du mot de passe au même endroit. Côté installation, l'écran d'un déploiement se met à jour dès le premier clic et les actions d'une machine tiennent dans une seule liste."
      entries:
          - type: modification
            title: 'Mes machines virtuelles présentées en fiches'
            detail: "Une fiche par machine à la place d'un long bloc : son état d'un coup d'œil, son adresse, sa mémoire et son disque, la liste des comptes ouverts dessus, et le choix de son mot de passe. Une machine allumée, éteinte ou en cours de démarrage se distingue immédiatement, et le mot de passe ne se saisit que lorsque la machine peut le recevoir."
          - type: modification
            title: "Les actions d'une machine tiennent dans une seule liste"
            detail: "Comptes, démarrage, arrêt, redémarrage et arrêt forcé se choisissent au même endroit, au bout de la ligne. L'arrêt forcé y reste éloigné de l'arrêt ordinaire et demande toujours confirmation : l'un coupe le courant, l'autre laisse la machine se fermer proprement."
          - type: fix
            title: "L'écran d'une installation se met à jour dès le premier clic"
            detail: "Il fallait recharger la page une fois pour voir les machines avancer ; l'écran restait figé jusque-là."
    - version: '2026.08.21.2'
      date: '2026-08-21'
      summary: "Les étudiants et les enseignants retrouvent désormais les machines virtuelles qui leur sont destinées : ils les démarrent, les arrêtent et y choisissent leur mot de passe. Côté installation, les machines se construisent réellement une par une, un déploiement se poursuit sans qu'on reste devant l'écran, et plusieurs pannes qui ne disaient pas leur nom sont corrigées."
      entries:
          - type: nouveaute
            title: 'Mes machines virtuelles'
            detail: "Chaque étudiant et chaque enseignant voit les machines créées pour lui — seul ou avec son groupe — avec leur nom, leur adresse et leur état. Il peut les démarrer, les arrêter, et surtout y choisir son mot de passe : sans cela, le compte existait sans que personne puisse s'y connecter. Le mot de passe n'est enregistré nulle part et se change autant de fois qu'on veut."
          - type: nouveaute
            title: "Donner un compte à des enseignants sur toutes les machines d'un lot"
            detail: "Sur une installation par classe ou par groupes, un ou plusieurs enseignants peuvent recevoir leur propre compte sur chacune des machines. Cela n'ajoute aucune machine, et le lot apparaît dans leurs machines virtuelles."
          - type: nouveaute
            title: 'Créer une machine pour des personnes choisies'
            detail: "Une machine unique portant un compte pour chaque personne désignée, étudiants comme enseignants. C'est aussi la façon de créer une machine pour une seule personne."
          - type: fix
            title: 'Les machines se construisent une par une, pour de bon'
            detail: "Elles étaient encore trois ou quatre à se construire en même temps : une machine n'était considérée finie qu'au clonage, alors qu'il lui restait à être configurée, démarrée et équipée de ses comptes."
          - type: modification
            title: "Un déploiement se poursuit même quand on quitte la page"
            detail: "L'écran d'un lot en cours se rafraîchit tout seul et déplie le journal de la machine en travaux. Auparavant, fermer l'onglet arrêtait l'installation là où elle en était — le plus souvent sur une machine copiée mais jamais configurée, qui démarrait alors sans adresse ni compte."
          - type: fix
            title: "Les comptes d'une machine s'affichaient comme manquants alors qu'ils existaient"
            detail: "La question posée à la machine n'aboutissait jamais, et une réponse vide se lisait comme une machine sans aucun compte."
          - type: modification
            title: "Les comptes créés sur une machine sont utilisables sans réglage"
            detail: "Chaque compte peut administrer sa machine sans qu'on lui redemande un mot de passe, rejoint le groupe docker, et l'horloge de la machine est réglée sur le réseau de la salle. Le réglage « donner l'administration » disparaît : il ne produisait que des machines sur lesquelles quelqu'un ne pouvait pas travailler."
          - type: fix
            title: "Un modèle qui ne peut pas recevoir sa configuration est refusé"
            detail: "Il l'acceptait sans erreur et n'en lisait rien : la machine démarrait avec l'adresse du modèle et aucun compte, sans que rien ne le signale."
          - type: fix
            title: "Les filtres et les groupes se choisissent avant l'aperçu"
            detail: "Il fallait d'abord demander un aperçu pour les voir apparaître, puis en redemander un."
          - type: fix
            title: "Une authentification refusée par le serveur de virtualisation dit enfin pourquoi"
            detail: "L'écran affichait un refus sans motif. Il nomme désormais ce que le serveur a répondu. Un accès valide pouvait par ailleurs rester refusé pendant plus d'une heure et demie après un redémarrage du serveur ; il se rétablit maintenant tout seul."

    - version: '2026.08.21'
      date: '2026-08-21'
      summary: "Les sondages arrivent : composer un questionnaire, l'adresser à une ou plusieurs classes, suivre les réponses question par question, et rejouer la même série plus tard pour comparer. Une campagne peut être menée anonymement, et l'anonymat est alors définitif."
      entries:
          - type: nouveaute
            title: 'Sondages : composer un questionnaire et le lancer dans une classe'
            detail: "Depuis « Outils ». Cinq types de questions — choix unique, choix multiple, échelle, ordre et commentaire libre — et des intertitres pour aérer un questionnaire long. Un modèle se réutilise d'une classe à l'autre."
          - type: nouveaute
            title: 'Répondre à un sondage depuis son travail à faire'
            detail: "Le sondage apparaît dans le travail à faire de chaque étudiant visé. Il ne propose pas « marquer comme fait » : seule la réponse le clôt, pour que le taux de participation dise la vérité."
          - type: nouveaute
            title: 'Résultats d’un sondage, question par question'
            detail: "Le taux de participation, la répartition de chaque question, la liste des personnes qui n'ont pas encore répondu, et un export. Une campagne anonyme n'affiche aucune répartition tant qu'elle a reçu moins de trois réponses, et ne montre jamais qui a répondu quoi — à personne."
          - type: nouveaute
            title: 'Rejouer un sondage et comparer les vagues'
            detail: "Rejouer ajoute une vague à la même série, avec le même questionnaire et la même cible : l'évolution se lit directement d'une vague à l'autre. Une question modifiée entre deux vagues est signalée comme non comparable plutôt que comptée de travers."
          - type: nouveaute
            title: 'Les sondages dans l’application mobile'
            detail: "La liste des sondages en cours, le questionnaire et la réponse, avec les mêmes règles que sur le web."
          - type: autre
            title: 'Application mobile MonCampus 2.4.0 pour Android'
            detail: "Elle apporte les sondages. e-CO est republiée à l'identique, sans changement de version."
          - type: fix
            title: 'Installer plusieurs machines virtuelles d’un coup fonctionne'
            detail: "Au-delà de quelques machines, l'installation s'arrêtait juste après la copie : les machines existaient mais n'étaient jamais configurées ni démarrées, et rien ne le disait. Un ensemble déjà installé de cette manière se rattrape en relançant l'installation."

    - version: '2026.08.20.4'
      date: '2026-08-20'
      summary: "Correctif sur l'installation des machines virtuelles pédagogiques : une machine fraîchement créée n'était en réalité pas exploitable, et rien ne le signalait. Elle l'est désormais, et tout ce qui échoue en cours d'installation est rapporté avec sa cause."
      entries:
          - type: fix
            title: "L'installation d'une machine virtuelle va jusqu'au bout"
            detail: "Les machines étaient bien créées mais restaient inutilisables, sans que rien ne l'indique : les comptes qu'elles devaient recevoir n'y étaient jamais posés."
          - type: fix
            title: 'Une installation qui échoue le dit, au lieu de passer pour réussie'
            detail: "Une opération refusée par la machine est signalée avec les mots de la machine elle-même, et apparaît dans le journal de l'installation."
          - type: interne
            title: "Simplification du paramétrage des serveurs de virtualisation"

    - version: '2026.08.20.3'
      date: '2026-08-20'
      summary: "Les administrateurs peuvent enregistrer leurs clés SSH publiques sur leur profil : les machines virtuelles pédagogiques créées ensuite les acceptent. Le déploiement d'un ensemble de machines se suit désormais machine par machine, avec le détail de ce qui a été fait et de ce qui a échoué."
      entries:
          - type: nouveaute
            title: 'Enregistrer ses clés SSH publiques sur son profil'
            detail: "Réservé à l'administration. Chaque clé est vérifiée à la saisie et porte le nom qu'on lui donne ; les machines virtuelles créées ensuite l'acceptent, celles qui existent déjà ne sont pas modifiées."
          - type: nouveaute
            title: 'Un journal détaillé pour chaque machine virtuelle installée'
            detail: "Chaque étape et son résultat, de l'adresse attribuée jusqu'aux comptes créés, en passant par les clés installées, nommées une par une. Un échec y est consigné avec sa raison exacte."
          - type: modification
            title: 'Les machines virtuelles se déploient une par une'
            detail: "Plus lisible à suivre, et le serveur de virtualisation finit une machine avant qu'on lui en demande une autre."
          - type: modification
            title: 'Retirer une machine prévue, ou supprimer un ensemble entier'
            detail: "Une machine ne peut être retirée que tant qu'elle n'a pas été lancée. Supprimer un ensemble efface son suivi : les machines déjà créées, elles, continuent de tourner."
          - type: modification
            title: 'Les comptes d’une machine sont accessibles depuis la liste des machines'
          - type: fix
            title: "Un déploiement ne reste plus bloqué sur ses premières machines"
            detail: "Les machines suivantes ne démarraient jamais tant que les premières n'avaient pas abouti. Chacune a maintenant son tour."
          - type: fix
            title: "Les écrans qui interrogent une machine répondent au lieu d'expirer"
            detail: "Une machine qui ne répond pas encore bloquait la page une minute entière avant de tomber en erreur ; elle est désormais signalée comme injoignable, avec la raison."
          - type: modification
            title: "Une machine virtuelle créée à l'unité est menée jusqu'au bout"
            detail: "Elle reçoit son nom, son adresse et ses clés, puis démarre si on l'a demandé — ce qui n'était fait que pour les ensembles de machines."

    - version: '2026.08.20.2'
      date: '2026-08-20'
      summary: "Correctif sur les machines virtuelles pédagogiques : le déploiement d'un ensemble de machines n'allait pas jusqu'au bout, faute de pouvoir constater que la première étape avait réussi."
      entries:
          - type: fix
            title: 'Le déploiement des machines virtuelles pédagogiques aboutit'
            detail: "La création était bien lancée sur le serveur de virtualisation, mais son suivi n'en obtenait pas le résultat et la machine restait en attente jusqu'à être déclarée en échec."

    - version: '2026.08.20'
      date: '2026-08-20'
      summary: "Une progression peut désormais être menée à deux : un second enseignant y est nommé, planifie ses propres séquences et reprend le cahier de texte du créneau tenu au même moment. Les groupes enregistrés, eux, se partagent entre enseignants d'une même classe et servent de point de départ à la création d'un wiki par groupe."
      entries:
          - type: nouveaute
            title: 'Co-animer une progression à deux enseignants'
            detail: "Une progression peut nommer un second enseignant : il la retrouve dans ses progressions, y planifie ses propres séquences, et le vivier de séquences réunit celles des deux. L'écran signale au passage le groupe qu'une séance laisserait de côté."
          - type: nouveaute
            title: 'Reprendre le cahier de texte du créneau tenu au même moment'
            detail: "Quand la même classe est prise à la même heure par deux enseignants, chacun peut reprendre les textes que l'autre a déjà saisis."
          - type: modification
            title: "L'export d'une progression distingue une séance co-animée"
            detail: "Une séance donnée à deux n'est plus décrite comme redispensée sur un créneau distinct, ce qui était faux. Le document nomme les deux formateurs avec le groupe de chacun et indique qui l'a établi."
          - type: nouveaute
            title: 'Partager ses groupes avec les enseignants de la classe'
            detail: "Un ensemble de groupes enregistré s'ouvre à un ou plusieurs collègues de la classe, qui le retrouvent sous « Groupes partagés avec moi ». Le partage se retire aussi simplement."
          - type: nouveaute
            title: 'Créer un wiki par groupe'
            detail: "Plutôt que de composer une audience à la main, on désigne un ensemble de groupes enregistré : chaque groupe reçoit son wiki, avec ses membres. Relancer l'opération crée une nouvelle série sans toucher à la précédente."
          - type: modification
            title: "L'outil de création de groupes parle de « groupes »"
            detail: "Le mot « lot » disparaît des écrans, du travail à faire compris. L'envoi des groupes par messagerie, lui, est retiré."
          - type: modification
            title: 'Les machines virtuelles pédagogiques se déploient par groupe'
            detail: "L'administration peut partir d'un ensemble de groupes enregistré : une machine par groupe, avec un compte par membre. Le déploiement mène désormais chaque machine jusqu'à la création de ces comptes."
          - type: fix
            title: "Les mails sans démarche s'affichent sur la fiche de recherche d'un étudiant"
            detail: "Le compteur de la page de suivi d'une classe pouvait mener à une liste vide : les mails qu'aucune démarche ne détient sont maintenant listés à part, en lecture seule."
          - type: modification
            title: "Le quota de bibliothèque se règle depuis la fiche de l'utilisateur"
            detail: "Il occupait une carte à part avec son propre bouton d'enregistrement, qui faisait passer celui de la fiche pour disparu. C'est désormais un champ du compte comme un autre, réservé aux administrateurs."
          - type: fix
            title: "Le bouton Partager retrouve sa place sur les fiches de séquence et de séance"
          - type: fix
            title: 'Trois correctifs sur les machines virtuelles pédagogiques'
            detail: "Un serveur injoignable est signalé tout de suite, avec ce qu'il faut aller vérifier, au lieu d'une longue attente muette. Le nombre maximum de machines déclaré sur un serveur est réellement appliqué. Une machine créée conserve les réglages réseau de son modèle."
          - type: modification
            title: "L'espace des machines virtuelles adopte la charte de l'application"
            detail: "Onglets, cartes, tableaux et assistant de création sont ceux du reste de la plateforme."
          - type: interne
            title: "Intégration continue et déploiement : bornes de temps et téléchargements authentifiés"
            detail: "Trois étapes réseau pouvaient immobiliser une exécution pendant des heures sans rien vérifier ; elles sont désormais bornées et échouent proprement."
          - type: interne
            title: "Retrait du stockage de secours de l'environnement de développement"
          - type: interne
            title: "Correction d'une annotation refusée par l'analyse statique"

    - version: '2026.08.19'
      date: '2026-08-19'
      summary: "Les enseignants peuvent désormais se transmettre leur travail : une séquence, une séance, un quiz, un fichier ou un dossier se partage en lecture à un collègue, à une équipe ou à toute une classe, et se reprend d'un clic pour devenir vraiment le sien. L'administration dispose par ailleurs de la création des comptes d'une classe entière à partir d'un fichier, vérifiée ligne par ligne avant la moindre écriture."
      entries:
          - type: nouveaute
            title: 'Partager un contenu à un collègue'
            detail: "Une séquence, une séance, un quiz, un fichier ou un dossier se partage en lecture, à une ou plusieurs personnes, à une équipe ou à une classe. Un écran réunit ce que l'on a reçu et ce que l'on a partagé, et un partage se retire quand on veut."
          - type: nouveaute
            title: "Reprendre chez soi un contenu partagé"
            detail: "La reprise fait une vraie copie, qui vous appartient et que vous modifiez sans toucher à l'original : les séances, les phases, les questions et les fichiers suivent, rangés dans des dossiers à leur nom. Les placements dans l'emploi du temps, eux, sont recalculés sur le vôtre — aucune date ne voyage."
          - type: nouveaute
            title: 'Un catalogue des contenus partagés'
            detail: "Tout ce qui a été partagé largement se retrouve au même endroit, cherchable par mot-clé et par étiquette, avec un filtre par type de contenu et par auteur."
          - type: nouveaute
            title: "Créer les comptes d'une classe entière à partir d'un fichier"
            detail: "Un modèle de fichier à remplir, puis un récapitulatif qui annonce ligne par ligne ce qui sera créé, rattaché ou laissé de côté avant que rien ne soit écrit. Les homonymes sont toujours soumis à la personne qui importe, jamais tranchés à sa place, et un écran de suivi montre l'avancement des comptes une fois l'import lancé."
          - type: interne
            title: "La suite de tests n'écrit plus dans le stockage distant"
            detail: "Les tests qui déposent des fichiers travaillent désormais dans un dossier local jeté après coup."

    - version: '2026.08.18'
      date: '2026-08-18'
      summary: "Les schémas insérés dans une page de wiki s'affichent enfin tels qu'ils ont été composés : leurs couleurs, leurs polices et leur cadrage se perdaient à l'enregistrement. Le cahier de texte propose par ailleurs, en un clic, le contenu que la séance prévoyait déjà, et l'administration dispose d'un espace pour gérer les machines virtuelles pédagogiques."
      entries:
          - type: nouveaute
            title: 'Le cahier de texte reprend le contenu prévu par la séance'
            detail: "Chaque partie — avant, pendant, après — propose en un clic le texte que la séance instanciée porte déjà, tant que l'éditeur est vide."
          - type: nouveaute
            title: 'Gestion des machines virtuelles pédagogiques'
            detail: "L'administration peut désormais déclarer les serveurs de virtualisation de l'établissement, voir et piloter les machines qui y tournent, et en déployer une par étudiant pour une classe."
          - type: fix
            title: "Les schémas d'une page de wiki s'affichent comme à la composition"
            detail: "L'aperçu était juste et la page enregistrée fausse : certains schémas ressortaient entièrement noirs, les libellés décalés de leurs cases, les plus larges rognés au bord de la page. Les schémas des pages déjà écrites sont redessinés à la première ouverture de leur éditeur, sans rien avoir à refaire."
          - type: fix
            title: "Une longue page n'est plus coupée à l'enregistrement"
            detail: "Au-delà d'environ 20 000 caractères, la fin d'une page de wiki disparaissait sans un mot. Les articles d'aide et de la base documentaire avaient exactement le même défaut."
          - type: modification
            title: 'Modifier un schéma déjà inséré dans un wiki'
            detail: "Un clic sur le schéma fait apparaître « Modifier » et « Supprimer », un double-clic rouvre directement son code, prêt à être retouché. Il n'était jusqu'ici pas possible de revenir sur un schéma une fois posé."

    - version: '2026.08.17'
      date: '2026-08-17'
      summary: "La bibliothèque de fichiers arrive : chaque enseignant et chaque membre du personnel dispose d'un espace de dossiers où déposer son matériel une seule fois, puis le réutiliser partout — un travail, un message, un article, une séance — sans jamais le renvoyer. Elle apporte aussi le partage d'un document à une classe, que les étudiants retrouvent dans un menu nettement allégé."
      entries:
          - type: nouveaute
            title: 'La bibliothèque de fichiers'
            detail: "Un espace personnel par enseignant et par membre du personnel : des dossiers que l'on crée et réorganise au glisser-déposer, une recherche par nom, une corbeille et une jauge de place occupée. Les fichiers y sont déposés une fois pour toutes."
          - type: nouveaute
            title: 'Un fichier déposé une fois, réutilisable partout'
            detail: "Tous les champs de la plateforme qui portent du matériel de cours offrent désormais un onglet « Bibliothèque de fichiers ». Ce que l'on y choisit est une référence et non une copie : le fichier ne compte qu'une fois dans la place occupée, une colonne dit combien de fois il est utilisé, et le remplacer met à jour tous les endroits d'un coup."
          - type: nouveaute
            title: 'Partager un document à une classe'
            detail: "Depuis le menu d'un fichier de la bibliothèque : la classe visée, éventuellement resserrée à certaines options et/ou modalités, la matière sous laquelle le ranger, et une durée de visibilité — illimitée par défaut, ou bornée par une date de début et de fin."
          - type: nouveaute
            title: 'Documents partagés, côté étudiant'
            detail: "La liste de tout ce que ses enseignants ont mis à sa disposition, regroupée par matière ou par enseignant, ou à plat, et triée par date de mise à disposition ou par ordre alphabétique."
          - type: nouveaute
            title: "Créer un travail depuis un fichier de la bibliothèque"
            detail: "Le fichier est déjà attaché dès la première étape de l'assistant, et la nature du travail suit ce qu'il est : une vidéo devient un « à visionner », un audio un « à écouter », le reste un « à rendre »."
          - type: modification
            title: "Le menu de l'étudiant"
            detail: "Il ne garde en tête que l'Accueil, l'Emploi du temps et le Travail à faire ; le Courrier école, les Candidatures et les wikis rejoignent le menu Ressources, où « Documents partagés » arrive en premier. « Mes cours » y devient « Séquences de l'année » et ouvre directement la formation quand il n'y en a qu'une."
          - type: modification
            title: "Tout envoi de fichier affiche sa progression"
            detail: "Le fichier part dès qu'il est choisi, avec son poids, sa barre de progression et un bouton Annuler. Son format et son innocuité sont vérifiés pendant que l'on remplit le reste de l'écran : un fichier refusé l'est avant l'envoi du formulaire, et non après une longue attente."
          - type: modification
            title: 'Un fichier supprimé reste récupérable trente jours'
            detail: "Toute suppression de fichier sur la plateforme est désormais différée : la corbeille de la bibliothèque affiche ce qui a été supprimé et le nombre de jours restants pour le restaurer."
          - type: modification
            title: 'Le menu Outils fait le ménage'
            detail: "« Vidéos » perd son entrée de menu — une vidéo se dépose maintenant dans la bibliothèque — sans rien perdre de ses fonctions : questions incrustées, suivi du visionnage et statistiques sont inchangés. « Enregistrements audio » devient « Corrections audio », et le mode commun disparaît de leur création, un document destiné à toute la classe ayant sa place dans la bibliothèque."
          - type: modification
            title: "La description technique parle de l'antivirus et des dépôts"
            detail: "La page ouverte à tous décrit l'analyse antivirale et la règle unique de dépôt de fichiers arrivées la veille."
          - type: fix
            title: 'Le bas du rail du wiki redevient atteignable'
            detail: "Dans un wiki dont l'arborescence dépassait la hauteur de l'écran, les branches basses et les liens Réglages et Corbeille ne revenaient qu'une fois la page défilée jusqu'à sa fin. Le rail défile désormais sur lui-même."
          - type: interne
            title: 'Un seul point de passage pour supprimer un fichier'
            detail: "Trois services effaçaient des octets à dix-neuf endroits sans jamais vérifier que l'effacement avait réussi. Ils délèguent tous à un objet unique, qui inscrit la suppression et la purge trente jours plus tard."
          - type: interne
            title: 'Un champ de dépôt unique pour les quinze champs de la plateforme'
            detail: "Les quinze champs de fichier, quatre zones de dépôt maison et un aperçu d'image cèdent la place au même composant. Plus aucun formulaire ne transporte d'octets."
          - type: interne
            title: 'Commandes de vérification des dépôts et de l’antivirus'
            detail: "Deux sondes de diagnostic : l'une écrit, relit et supprime un objet sur chacun des préfixes du stockage, l'autre fait passer le fichier de test EICAR par l'antivirus configuré."
    - version: '2026.08.16'
      date: '2026-08-16'
      summary: "Le wiki fait son entrée : des espaces de pages arborescentes, écrites dans un éditeur complet (encadrés, formules, schémas), qui s'exportent en PDF relié ou en archive Markdown réimportable. En arrière-plan, tous les dépôts de fichiers de la plateforme passent désormais par une même règle d'extensions et de taille, et par une analyse antivirale."
      entries:
          - type: nouveaute
            title: 'Le wiki'
            detail: "Un wiki personnel pour chacun, des wikis partagés adressés à un public, et dans chacun une arborescence de pages que l'on réordonne au glisser-déposer. Chaque page offre son sommaire automatique, ses pièces jointes, ses liens vers les autres pages du wiki, une recherche plein texte et l'historique de ses deux dernières versions, avec restauration. Un verrou signale qu'une page est déjà en cours d'écriture plutôt que d'écraser silencieusement le travail d'un collègue."
          - type: nouveaute
            title: "L'éditeur du wiki"
            detail: "Barre de menus complète : encadrés, accordéons, blocs de code, caractères spéciaux, rechercher-remplacer, formules mathématiques (KaTeX) et schémas (Mermaid). Le sélecteur « Lien wiki » cherche parmi les pages du wiki courant."
          - type: nouveaute
            title: 'Exporter un wiki en PDF'
            detail: "Le wiki entier, une branche ou une seule page, avec page de couverture, sommaire, pieds de page numérotés et titres décalés selon la profondeur de chaque page — un document relié, pas une pile de pages."
          - type: nouveaute
            title: 'Archive Markdown : export et import'
            detail: "Un wiki s'exporte en archive de fichiers Markdown lisibles ailleurs, et se réimporte sans rien perdre de sa mise en forme. L'import se fait en trois étapes, avec une analyse préalable qui dit exactement ce qui sera créé avant d'écrire quoi que ce soit."
          - type: nouveaute
            title: 'Analyse antivirale des fichiers déposés'
            detail: "Tout fichier déposé sur la plateforme est analysé avant d'être enregistré. Un fichier reconnu comme infecté est refusé à l'envoi."
          - type: modification
            title: 'Une seule règle de dépôt de fichiers pour toute la plateforme'
            detail: "Les extensions acceptées et les tailles maximales sont désormais définies au même endroit ; chaque champ ne peut que restreindre cette liste. Deux champs qui n'imposaient aucune limite — les pièces jointes d'un article et celles d'un travail à faire — y entrent à leur tour."
          - type: modification
            title: "L'envoi d'une vidéo affiche sa progression"
            detail: "Nom, poids, barre de progression, pourcentage et bouton Annuler pendant le transfert, puis « Traitement… » le temps de l'enregistrement. Un fichier trop volumineux est enfin signalé comme un refus, et non plus comme une erreur inexpliquée."
          - type: fix
            title: "L'export PDF d'une progression n'est plus rogné sur le bord droit"
            detail: "La bordure droite des bannières et des tableaux disparaissait à l'impression. La liste « Moyens et supports mobilisés sur l'année » quitte par ailleurs la partie 1, où elle répétait ce que le détail par phase donne déjà."
          - type: fix
            title: 'Les liens collés dans un éditeur ne sont plus réécrits'
            detail: "Un lien interne était enregistré avec l'adresse du serveur qui l'avait vu passer, et se cassait ailleurs. Il est désormais conservé tel quel."
          - type: interne
            title: 'Commentaires du code passés en anglais'
          - type: interne
            title: 'Image ClamAV épinglée sur linux/amd64 en développement'
    - version: '2026.08.15.2'
      date: '2026-08-15'
      summary: "Une base documentaire fait son entrée sous Ressources : des articles rédigés et illustrés dans l'application, adressés à un public et à un périmètre précis grâce à la nouvelle hiérarchie de groupes. L'import d'une séquence ne bloque plus sur du contenu resté non affecté, et l'export PDF d'une progression gagne en lisibilité."
      entries:
          - type: nouveaute
            title: 'Une base documentaire sous Ressources'
            detail: "Des articles rédigés dans l'application, illustrés et accompagnés de pièces jointes, avec leur statut et leur période de diffusion, un sommaire par section et un tableau de bord des lectures. Chaque article s'adresse à des publics et à des sections : un lecteur le voit s'il porte l'un des publics visés et appartient à l'une des sections retenues, ou à l'une de leurs sous-sections."
          - type: nouveaute
            title: 'Rattacher un groupe à un groupe parent'
            detail: "Un groupe peut désigner un parent, obligatoirement d'un type différent du sien : SIO2 sous SIO, SIO sous Campus, jamais SIO2 sous SIO1. Un onglet Hiérarchie en affiche l'arbre et la liste des groupes gagne une colonne Parent."
          - type: modification
            title: "L'import d'une séquence ne bloque plus sur du contenu non affecté"
            detail: "La question est posée une seule fois, au moment de créer : le contenu resté sans affectation est écarté d'un coup, et la création annonce combien de contenus n'ont pas été importés."
          - type: modification
            title: "L'export PDF d'une progression est plus lisible"
            detail: "La page de garde ne répète plus la classe et nomme le formateur, la synthèse de l'année commence sur une nouvelle page, et les moyens et supports sont dédoublonnés — casse et accents ignorés — puis présentés en liste sur deux colonnes."

    - version: '2026.08.15'
      date: '2026-08-15'
      summary: "Le référentiel de compétences d'une formation se décrit maintenant dans l'application, une fiche par compétence, et s'imprime en PDF à l'image du document de l'établissement. L'espace UFA d'une formation regroupe par ailleurs tous ses onglets au même endroit, et l'export Qualiopi d'une progression compte désormais les heures telles qu'un apprenant les reçoit."
      entries:
          - type: nouveaute
            title: "Décrire le référentiel de compétences d'une formation"
            detail: "Chaque compétence porte désormais sa fiche complète : code, volume horaire, période d'enseignement, intervenant, description métier, connaissances, activités, critères de performance et les trois volets des modalités d'évaluation. Les blocs et les compétences se réordonnent en les faisant glisser."
          - type: nouveaute
            title: 'Exporter les fiches du référentiel en PDF'
            detail: "Un onglet « Export TSF » s'ajoute aux exports de la formation, une fois la case cochée dans sa configuration. On peut n'exporter qu'une option : elle sort alors ses propres blocs et ceux communs à toutes."
          - type: nouveaute
            title: 'Déclarer la certification préparée par chaque option'
            detail: "Dans UFA > Formations > Dénomination, sous les intitulés légaux : intitulé, type, code RNCP, niveau et certificateur, une ligne par option — une même formation peut préparer deux titres distincts."
          - type: nouveaute
            title: "Conditionner un travail à une note obtenue à une évaluation"
          - type: modification
            title: "L'espace UFA d'une formation regroupe tous ses onglets"
            detail: "Les tuteurs rejoignent les périodes d'évaluation, la dénomination et les modalités sous UFA > Formations. L'ancien chemin, qu'aucun lien n'atteignait, disparaît."
          - type: modification
            title: 'Les mentions légales des documents se règlent dans la configuration'
            detail: "SIRET, code APE, numéro de déclaration d'activité et CFA de rattachement se saisissent dans UFA > Configuration > Centre de formation, et alimentent l'en-tête des documents imprimés au lieu d'y être figés."
          - type: modification
            title: "L'écran des séquences d'une formation devient l'inventaire des instanciations"
            detail: "Il liste les séquences copiées pour la classe, tous enseignants confondus ; l'agencement, lui, appartient à la progression pédagogique."
          - type: modification
            title: 'La fiche technique mentionne Discord parmi les services externes'
          - type: fix
            title: "L'export Qualiopi compte les heures telles qu'un apprenant les reçoit"
            detail: "Une séance dédoublée ne compte plus deux fois, d'où le « 44 h 05 placés à l'emploi du temps sur 28 h prévus » sorti en production. Le pied de page ne se répète plus en haut des pages, et les tableaux reprennent leur en-tête après une coupure."
          - type: fix
            title: "L'export d'une progression ne retient que les placements validés"
            detail: "Une proposition du planificateur automatique n'est plus imprimée comme une heure délivrée : elle reste affichée, mais nommée comme telle."
          - type: fix
            title: "La période d'une séquence se lit sur ses seules délivrances validées"
            detail: "L'en-tête n'annonce plus des dates trois lignes sous « aucune séance encore placée à l'emploi du temps »."
          - type: fix
            title: "Une séquence instanciée n'est planifiable que par une seule progression"
            detail: "La même instanciation n'est plus proposée, ni annoncée non affectée, par toutes les progressions de la classe."
          - type: fix
            title: "Un indicateur d'attente pendant la génération de l'export PDF d'une progression"
          - type: interne
            title: 'Import du référentiel Bac+3 Informatique en ligne de commande'
            detail: "app:import-tsf-referential charge les 23 fiches du document de l'établissement dans une formation, sans jamais écraser une saisie existante."

    - version: '2026.08.14.2'
      date: '2026-08-14'
      summary: "L'UFA reçoit ses deux gros chantiers : les contrats d'alternance s'importent depuis le fichier de l'établissement, et les conventions de prêt d'ordinateur s'impriment. Côté progression, une séquence choisit désormais les créneaux qu'elle occupe, la classe a ses propres fiches de séance modifiables, et un export PDF répond aux questions d'un audit Qualiopi."
      entries:
          - type: nouveaute
            title: 'Importer les contrats d’alternance depuis le fichier de l’établissement'
            detail: "Le tableur des contrats d'apprentissage se dépose dans UFA > Configuration, et l'application en fait des alternances. Rien n'est écrit avant qu'une analyse complète ait été relue et validée : étudiants retrouvés et formations déduites, entreprises et tuteurs déjà connus ou à créer, contrats qui ne couvrent pas la formation, alternances déjà présentes. Une seule anomalie sérieuse refuse le fichier entier plutôt que d'en importer une moitié. Les entreprises manquantes sont créées et les comptes tuteur ouverts avec leur demande d'annuaire — sans qu'aucun message ne parte, ni aux tuteurs ni aux signataires du livret."
          - type: nouveaute
            title: 'Imprimer la convention de prêt et le formulaire de restitution'
            detail: "Les deux modèles sont là, UFA et CFC, remplis avec les informations du prêt ; après un prêt ou un retour, la liste propose directement le document que l'enregistrement vient de rendre disponible. L'application enregistre au passage ce que ces documents impriment et qu'elle ne gardait pas : numéro de série, valeur de remplacement, accessoires prêtés et leur état au retour."
          - type: nouveaute
            title: 'Export PDF Qualiopi d’une progression'
            detail: "Le document suit l'ordre des questions d'un audit : synthèse de l'année, progression séquence par séquence, déroulé de chaque séance en quatre colonnes, puis les évaluations diagnostiques, formatives et sommatives. Tout y est mesuré sur les créneaux réellement placés, jamais affirmé : une séance non placée reste imprimée et signalée, et une séance dédoublée par groupe distingue le volume délivré du volume que reçoit chaque apprenant."
          - type: nouveaute
            title: 'Choisir les créneaux qu’une séquence peut occuper'
            detail: "Le placement automatique prenait tous les créneaux de la matière, dans l'ordre. Trois réglages par séquence : la matière visée, les créneaux en groupes ou en classe entière, et la limite d'une séance par semaine. Une séquence ne peut plus prendre un créneau qu'une autre progression a déjà validé."
          - type: nouveaute
            title: 'La classe a ses propres fiches de séance et de séquence'
            detail: "La fiche d'une séance montre désormais ce que cette classe-là reçoit, déroulé compris, et se modifie sans toucher au modèle de la bibliothèque — une bannière dit à chaque fois ce que l'on modifie et sur quoi cela se répercute. Les cartes des calendriers annuel et mensuel pointent dessus au lieu de renvoyer à la bibliothèque."
          - type: modification
            title: 'Les évaluations rattachées à une séquence redeviennent visibles'
            detail: "Rattacher une évaluation à une séquence la faisait disparaître de partout : plus aucun écran ne la reprenait, elle n'était donc ni modifiable ni supprimable. Elle est maintenant listée sur l'écran de placement de sa séquence, avec sa date et son heure — l'heure, jusqu'ici, ne pouvait pas être saisie."
          - type: modification
            title: 'Une séquence ne s’instancie plus deux fois dans la même classe'
            detail: "Les classes déjà servies quittent le sélecteur, et la soumission est revérifiée : le doublon partait jusqu'ici sans un mot."
          - type: modification
            title: 'La nature d’une évaluation corrigée se répercute sur la progression'
            detail: "La corriger sur la fiche de la classe laissait la progression, ses compteurs et l'export sur l'ancienne valeur. Sur la vue annuelle, la mention d'évaluation ne s'étend par ailleurs plus à toute une séquence à partir de sa seule première séance."
          - type: modification
            title: 'Le type de prêt est proposé d’après la modalité de l’étudiant'
            detail: "Un étudiant en alternance emprunte sous convention UFA, les autres sous convention CFC ; l'opérateur garde la main. « Afficher les prêts clôturés » bascule désormais la liste sur les prêts rendus, triés par date de retour, plutôt que d'allonger la liste en cours."
          - type: modification
            title: 'Créer une alternance inscrit l’étudiant en modalité alternance'
            detail: "C'étaient deux gestes séparés, et le second s'oubliait — un alternant non déclaré manquait aux feuilles d'émargement et se voyait proposer le mauvais type de prêt."
          - type: fix
            title: 'Les filtres vides ne renvoient plus de page d’erreur'
            detail: "Un filtre remis sur « Toutes », une barre de classes entièrement désélectionnée ou une évaluation posée « hors séquence » suffisaient à faire tomber l'écran en erreur. Le défaut a été traqué partout où il pouvait se reproduire, plutôt que sur les seuls écrans signalés, et des tests le retiennent maintenant sur les principaux."
          - type: fix
            title: 'Un numéro d’inventaire en double est signalé au lieu de faire échouer l’écran'
            detail: "L'opérateur recevait une page d'erreur et perdait sa saisie ; il reçoit désormais un message sur le champ concerné, comme pour le numéro de série."
          - type: fix
            title: 'Les accents des conventions imprimées'
            detail: "Le document envoyé au convertisseur PDF ne déclarait pas son encodage, ce qui suffisait à transformer les accents en idéogrammes."
          - type: fix
            title: 'Ne choisir aucun groupe de périodes répond maintenant par un message'
          - type: interne
            title: 'Lecture typée des paramètres de requête, généralisée'
            detail: "Les trois façons dont une requête pouvait provoquer une erreur 400 sur une saisie parfaitement normale passent désormais toutes par les mêmes objets de frontière, et les gardes écrites à la main qui n'existaient que pour ce piège ont disparu."
          - type: interne
            title: 'La suite de tests passe de 900 à 990 tests'

    - version: '2026.08.14'
      date: '2026-08-14'
      summary: "L'espace de cours devient réellement utilisable : une séquence, une séance ou une ressource peut enfin être publiée aux étudiants, sur le web comme dans l'application mobile, qui reçoit du même coup les vidéos à questions. Plusieurs écrans qui échouaient en silence ou renvoyaient une erreur ont par ailleurs été réparés."
      entries:
          - type: nouveaute
            title: 'Publier un cours à ses étudiants'
            detail: "Tout ce qu'il fallait pour lire un espace de cours existait déjà, mais rien ne permettait d'en ouvrir un : une séquence instanciée restait masquée pour toujours et « Mes cours » était une page vide pour tous les étudiants. La publication se fait à trois niveaux, comme on ouvre un cours : la séquence entière, puis une séance à la fois au fil des semaines, puis la ressource que l'on retient — un corrigé, par exemple. Une programmation sans date reste fermée : publier par accident est la seule erreur que ce mécanisme ne doit pas commettre. Seul l'enseignant qui a instancié la séquence décide qu'elle est prête ; ses collègues de la classe peuvent la relire avant."
          - type: nouveaute
            title: 'L’espace de cours arrive dans l’application mobile'
            detail: "Le web l'avait, l'application ne l'avait pas du tout. Ce qui est lisible, ce qui est déverrouillé et qui peut ouvrir quoi restent décidés au même endroit que sur le web : les deux écrans ne peuvent pas se contredire."
          - type: nouveaute
            title: 'Les vidéos à questions se suivent depuis le téléphone'
            detail: "Les questions incrustées dans une vidéo, jusqu'ici réservées au navigateur, sont désormais envoyées à l'application avec les douze types de questions déjà connus des quiz. Un marqueur ne transporte jamais son énoncé avant sa minute, ni son corrigé."
          - type: fix
            title: 'Les conditions d’accès posées sur un quiz s’appliquent enfin'
            detail: "L'écran enseignant proposait « Conditions d'accès » sur un quiz depuis leur livraison, mais ni la liste des quiz de l'étudiant ni l'application mobile ne les consultaient : la règle était enregistrée, affichée, et sans effet. Un verrou qui ne verrouille pas est pire qu'un verrou absent, car l'enseignant croit l'avoir posé. Un quiz « Invisible » quitte désormais la liste, un quiz « Grisé » y reste en indiquant ce qu'il faut faire pour l'ouvrir, et le démarrage est refusé même si l'adresse est tapée à la main."
          - type: fix
            title: 'L’écran des conditions d’accès annonçait un enregistrement qui n’avait rien enregistré'
            detail: "Une condition saisie mais non ajoutée à la liste était jetée sans un mot, et l'écran affichait pourtant « enregistrées ». Elle est maintenant versée à l'enregistrement si elle est complète, et refusée à voix haute sinon. Par ailleurs, un type sans rien à désigner — « Séance passée » dans une classe qui n'a pas encore de séance — masquait purement et simplement son champ, ce qui se lisait comme une fonctionnalité manquante : le champ reste visible et dit pourquoi il est vide."
          - type: fix
            title: 'Création de groupes et Semaine type ne perdent plus une saisie en silence'
            detail: "Dans la création de groupes, une paire d'étudiants sélectionnée mais non ajoutée était ignorée : les groupes revenaient sans la contrainte, sans message. Dans la semaine type, une période dont seule la date de début était renseignée disparaissait de l'envoi pendant que l'application réussissait. Les deux écrans refusent désormais et disent ce qui manque."
          - type: fix
            title: 'Un filtre laissé sur « Toutes » ne provoque plus d’erreur'
            detail: "Choisir « Toutes » dans une barre de filtres pouvait renvoyer une page d'erreur au lieu de la liste complète. Quatre écrans étaient touchés : Travaux, Suivi des quiz, Relances UFA et Relances d'évaluation d'une formation. Un filtre vide ou malformé montre maintenant l'écran non filtré."
          - type: fix
            title: 'L’écran des fichiers d’une vidéo ne s’ouvrait plus'
            detail: "Il répondait une erreur pour tout enseignant et toute vidéo, à cause d'une adresse que l'application ne savait plus construire."
          - type: modification
            title: 'Menus allégés autour des formations'
            detail: "L'entrée « Travaux » disparaît du haut des menus de section — elle reste accessible depuis « Outils » — et « Devoirs » quitte le sous-menu Paramétrage d'une formation, où elle faisait doublon. Dans ce même sous-menu, « Programme » devient « Formation », le mot employé partout ailleurs."
          - type: autre
            title: 'Application mobile MonCampus 2.3.0 pour Android'
            detail: "Elle apporte l'espace de cours, le lecteur de visionnage et les questions incrustées dans les vidéos. e-CO n'est pas republiée : rien n'a changé depuis sa dernière livraison."
          - type: interne
            title: 'Documentation du piège des filtres vides'
            detail: "Le défaut corrigé sur quatre écrans a été consigné là où on le lira avant de le réintroduire."

    - version: '2026.08.13.4'
      date: '2026-08-13'
      summary: "L'import de questions de quiz par une IA devient un assistant guidé en quatre étapes, qui sait désormais partir d'une de vos séquences ou d'un simple sujet. Un quiz déjà lancé dans une classe peut par ailleurs être modifié, ou désactivé sans rien perdre de ses statistiques."
      entries:
          - type: modification
            title: 'L’import de questions par IA se fait maintenant pas à pas'
            detail: "L'écran unique demandait tout en même temps — le mode, le cours, les types de questions, les images, le prompt et le collage — alors que ce sont quatre moments séparés par un aller-retour hors de l'application. L'assistant pose d'abord une question, « d'où viennent vos questions ? », avec quatre réponses : transposer un QCM que vous avez déjà, écrire des questions sur une de vos séquences ou séances, écrire sur un sujet que vous précisez, ou déposer un fichier CSV ou Kahoot. Vient ensuite le prompt à copier, puis la zone de collage, puis l'écran de vérification habituel, inchangé. Tous les réglages d'avant sont conservés."
          - type: nouveaute
            title: 'Demander des questions sur un sujet, sans partir d’un cours'
            detail: "Vous renseignez la matière, les notions travaillées, le public et le nombre de questions attendu, plus d'éventuelles précisions, et le prompt se remplit tout seul au fil de la frappe. Un champ laissé vide garde son exemple, comme auparavant. Le nombre de questions est également proposé quand les questions sont écrites à partir d'une séquence."
          - type: nouveaute
            title: 'Modifier un quiz déjà lancé dans une classe'
            detail: "Sur la page de résultats d'un quiz, un bouton « Modifier le quiz » permet de corriger son intitulé, sa fenêtre d'ouverture et de fermeture, ses minuteurs, son barème et la visibilité du score. Tout ce qui a déterminé le tirage — le nombre de questions, la répartition des difficultés et les questions elles-mêmes — reste figé au lancement : un autre tirage est un nouveau lancement."
          - type: nouveaute
            title: 'Désactiver un quiz sans le supprimer'
            detail: "Un quiz désactivé, avec confirmation, disparaît de l'espace des étudiants et leur devient inaccessible, sur le site comme dans l'application mobile. Rien n'est effacé : les tentatives, les notes et les deux onglets de statistiques restent consultables par l'enseignant, et le quiz peut être réactivé à tout moment."
          - type: fix
            title: 'Les feuilles d’émargement ne listent plus que les alternants'
            detail: "Elles reprenaient tous les étudiants de la classe, y compris ceux en formation initiale assis dans les mêmes séances, alors que ce document ne concerne que l'alternance. Une classe sans aucun alternant n'exporte plus de feuille du tout, au lieu d'une page vierge par jour."
          - type: interne
            title: 'Intégration continue : le conteneur a le temps de démarrer'
            detail: "Le contrôle de santé laissait deux minutes au conteneur applicatif, qui en demande une à une minute et demie le temps d'installer ses dépendances et de rejouer les migrations. Le premier serveur un peu lent faisait échouer la chaîne sur un démarrage pourtant normal."

    - version: '2026.08.13.3'
      date: '2026-08-13'
      summary: "La progression pédagogique affiche désormais les séquences déjà instanciées pour la classe qui n'y ont pas encore été planifiées, et permet de supprimer celles dont on n'a plus besoin. Ces listes se limitent aux séquences que l'enseignant a instanciées lui-même, et non plus à celles de tous les enseignants de la classe."
      entries:
          - type: nouveaute
            title: 'Les séquences instanciées non planifiées apparaissent dans la progression'
            detail: "Un bloc « Séquences non affectées », en colonne de droite, liste les séquences instanciées pour la classe qui ne figurent pas encore dans la progression, avec leur nombre de séances : jusqu'ici elles n'existaient que dans le menu déroulant « Ajouter une séquence ». Chacune peut être supprimée d'un clic — la copie de la séquence et de ses séances est alors effacée, les créneaux qu'elle occupait redeviennent libres et les cahiers de texte déjà remplis sont conservés."
          - type: modification
            title: 'Chaque enseignant ne voit que les séquences qu’il a instanciées'
            detail: "Une séquence instanciée appartient à la classe et non à la matière : « Ajouter une séquence » et l'autocomplétion de l'assistant de création proposaient donc aussi les séquences instanciées par les collègues intervenant sur la même classe. Elles ne proposent plus que les siennes."

    - version: '2026.08.13.2'
      date: '2026-08-13'
      summary: "Le livret de l'alternant reporte enfin les signatures recueillies pour chaque période d'évaluation, au lieu d'imprimer des cases vides sous des gens qui avaient signé. Le chargé de suivi peut aussi n'exporter qu'une seule période, couverture comprise, plutôt que le livret entier."
      entries:
          - type: fix
            title: 'Les signatures des périodes d’évaluation apparaissent dans le livret'
            detail: "Une période signée par le tuteur, l'alternant, l'équipe pédagogique et le chargé de suivi, puis clôturée, affichait quatre cases vides : les évaluations et les remarques remontaient, les signatures non. Chaque signataire a désormais sa colonne, avec son nom et la date, comme sur la page de remise du livret."
          - type: nouveaute
            title: 'Export partiel du livret, période par période'
            detail: "Un bouton « Export partiel PDF » à côté de l'export complet, réservé à l'administration : une ligne par période d'évaluation, et le PDF obtenu contient la couverture, les pages de cette période et la quatrième de couverture. Les numéros de page restent ceux du livret complet, pour que l'extrait et le document entier se citent l'un l'autre."
          - type: modification
            title: 'Le lien « Imprimer » disparaît des écrans du livret'
            detail: "Il ouvrait le document brut dans un onglet ; l'export PDF fait mieux le même travail."
          - type: modification
            title: 'Couverture du livret : le nom de l’alternant seul'
            detail: "L'encadré du bas de la couverture n'affiche plus la mention « NOM Prénom : » devant le nom."

    - version: '2026.08.13'
      date: '2026-08-13'
      summary: "Un document de séquence que vous avez déjà — un kit, une fiche, des supports — se transforme maintenant en séquence de votre bibliothèque en quatre étapes, et rien n'est écrit tant que vous n'avez pas confirmé. Une séquence s'exporte, se fait relire, gagne quatre champs qui lui manquaient, affiche enfin tout ce qu'elle contient, et sert désormais de matière à la génération de questions comme de point d'attache aux quiz."
      entries:
          - type: nouveaute
            title: 'Transformer un document existant en séquence de votre bibliothèque'
            detail: "Votre projet, convertir, coller, vérifier : l'application écrit le prompt, vous faites le voyage chez l'IA, elle relit le document et vous montre ce qu'elle a compris avant d'écrire quoi que ce soit. Un document refusé le dit franchement ; une durée douteuse ou une séance sans titre est signalée sans être corrigée d'office. L'import ajoute et ne remplace jamais : compléter une séquence existante ne touche que ses champs vides."
          - type: nouveaute
            title: 'Panneau « Non placé » : ce que votre fiche dit et que MonCampus ne rangeait nulle part'
            detail: "Les blocs d'une vraie fiche qui n'ont pas de case ici vous sont présentés avec leur texte, un par un : vous versez dans le champ de votre choix ou vous écartez. Confirmer en laissant une décision en attente est refusé — c'est par là que le contenu se perdait silencieusement."
          - type: nouveaute
            title: 'Quatre champs de plus sur les séquences et les séances'
            detail: "Différenciation et points de vigilance sur la séquence, matériel et points de vigilance sur la séance. Le matériel se glisse entre les supports généraux de la séquence et les moyens d'une phase : c'est le niveau intermédiaire qui manquait."
          - type: modification
            title: 'L’écran d’une séquence affiche tous ses champs'
            detail: "Capacités attendues, pré-requis, transversalités, situation problématique et supports généraux étaient enregistrés et éditables, mais visibles nulle part en dehors du formulaire d'édition. Ils se lisent maintenant dans l'ordre où ils s'écrivent ; un champ vide est sauté plutôt qu'affiché avec un tiret."
          - type: nouveaute
            title: 'Exporter une séquence, et la faire relire'
            detail: "Une séquence s'exporte en un fichier qui se réimporte tel quel — de quoi la transmettre à un collègue, la sauvegarder, ou la faire réviser puis la réintégrer. Un second bouton prépare un prompt de relecture critique : l'IA vous rend un avis, à vous d'en faire ce que vous voulez, rien n'est appliqué automatiquement."
          - type: nouveaute
            title: 'Générer des questions à partir du cours lui-même'
            detail: "L'assistant d'import de questions part maintenant d'une séquence ou d'une séance : les objectifs et le déroulé des phases voyagent dans le prompt, et les questions portent sur ce que vous avez réellement prévu de faire. En mode transposition, une question dont vous ne fournissez pas le corrigé est refusée plutôt qu'inventée. Le nombre de caractères envoyés est affiché et ne tronque jamais."
          - type: nouveaute
            title: 'Rattacher un quiz à une séquence ou à une séance'
            detail: "La séquence affiche ses quiz et sa couverture — « 2 séances sur 4 » — et un même quiz peut servir à plusieurs séances sans être dupliqué. Un quiz qui vise la séquence entière ne prétend couvrir aucune séance. Supprimer une séance détache le quiz sans le supprimer : il reste dans votre bibliothèque."
          - type: nouveaute
            title: 'Article d’aide : « J’ai déjà ma séquence, comment l’importer »'
            detail: "Écrit maintenant que le parcours est complet, du document de départ jusqu'aux quiz. La question « comment partager une séquence » cesse d'être à moitié fausse : l'export en est le chemin."
          - type: fix
            title: 'Tableaux importés : la ligne de tirets a disparu'
            detail: "Un tableau récupéré depuis un document affichait son « |---|---|---| » en plein milieu du texte. Les séquences déjà importées gardent la leur."
          - type: interne
            title: "Typage de la charge utile d'import à la frontière"
            detail: "Forme du document déclarée une fois et relue là où elle est consommée, plutôt que retypée à chaque lecture. 63 tests écrits avant le code."
    - version: '2026.08.12'
      date: '2026-08-12'
      summary: "Les étudiants ont désormais un espace de cours où retrouver les séquences et leurs supports, et vous pouvez conditionner l'ouverture d'un travail, d'une séquence ou d'un quiz à ce qu'ils ont déjà fait. Les vidéos deviennent un outil à part entière — dépôt, suivi de visionnage, et questions posées en cours de lecture — et l'import de questions se fait maintenant sur un seul écran, avec un prompt qui se construit à partir des types que vous cochez."
      entries:
          - type: nouveaute
            title: 'Espace de cours : les séquences et leurs supports, côté étudiant'
            detail: "Les séances d'une séquence et leurs ressources deviennent consultables par les étudiants, séquence par séquence. Rien n'est visible tant que vous ne l'avez pas publié : tout part de « masqué », une séance comme une ressource se publie individuellement, et un support de préparation ou un corrigé peut rester réservé à l'enseignant."
          - type: nouveaute
            title: 'Vidéos : déposer une vidéo de cours et voir qui l’a réellement regardée'
            detail: "Un outil calqué sur les enregistrements audio : vous déposez un ou plusieurs MP4 (200 Mo par fichier), vous en faites un travail à faire de type visionnage, et vous suivez la progression de chaque étudiant. Un saut en avant n'est jamais compté comme vu, et une carte de rétention montre à quel moment la classe décroche."
          - type: nouveaute
            title: 'Questions incrustées dans une vidéo'
            detail: "Vous posez un marqueur sur la timeline et y accrochez une question de votre bibliothèque : elle s'affiche par-dessus la vidéo au moment voulu, dans les douze formes possibles, zones cliquables et questions calculées comprises. Le marqueur peut mettre la lecture en pause, exiger une réponse pour continuer, et proposer de revoir le passage quand la réponse est fausse."
          - type: nouveaute
            title: 'Conditions d’accès : ouvrir un travail ou une séquence sous condition'
            detail: "Un travail à faire, une séquence, une ressource ou un quiz peut n'apparaître qu'une fois quelque chose d'autre accompli : un score obtenu à un quiz, un travail déposé, un enregistrement écouté, une vidéo visionnée, une séance passée, une date atteinte, un groupe d'appartenance. Vous choisissez si l'objet verrouillé se montre grisé, avec la raison, ou reste invisible — les deux sont utiles selon ce que la condition dit de l'étudiant."
          - type: modification
            title: 'Import de questions : un seul écran et un prompt qui se construit'
            detail: "Les quatre onglets par famille laissent place à un écran unique où vous cochez les types de questions à demander : le prompt se construit à partir de votre sélection, et un seul document rapporte les douze types mêlés. Un filtre limite la sélection aux types jouables en concours live."
          - type: nouveaute
            title: 'Import de questions : ajouter à un quiz existant'
            detail: "Un lot de questions importé peut désormais rejoindre un quiz déjà constitué au lieu d'en créer un nouveau — une banque se construit en plusieurs fois. Les réglages du quiz visé ne sont pas touchés, et les passations déjà lancées ne changent pas."
          - type: nouveaute
            title: 'Import de questions : déposer les images du lot'
            detail: "Vous déposez vos images sur l'écran d'import et elles reçoivent une clé courte (img1, img2) que le prompt transmet à votre place. Vos images ne sont jamais publiées : vous joignez les mêmes fichiers à votre conversation, l'IA les désigne par leur clé, et la question arrive complète. Une question dont l'image manque est créée quand même, signalée, et le quiz refuse d'être lancé tant qu'elle n'est pas complétée."
          - type: modification
            title: 'Export d’un quiz : un seul fichier pour toutes ses questions'
            detail: "Les quatre liens d'export par famille sont remplacés par un seul, qui emporte le quiz entier quelles que soient les questions qu'il contient. Les fichiers déjà téléchargés dans les anciens formats restent importables."
    - version: '2026.08.11.2'
      date: '2026-08-11'
      summary: "Quatre nouveaux types de questions complètent les quiz : relier les éléments de deux colonnes, répondre par un nombre, répondre à un énoncé dont les valeurs changent d'un étudiant à l'autre, et répondre par un mot. Tous se jouent aussi sur l'application mobile, qui passe en 2.2.0, et tous peuvent être créés en collant un document produit par une IA."
      entries:
          - type: nouveaute
            title: 'Apparier : relier les éléments de deux colonnes'
            detail: "Mot et définition, date et événement, pays et capitale. Une colonne peut porter des images plutôt que du texte, pour faire reconnaître un schéma ou une photographie. Des éléments en trop se mêlent aux bonnes réponses pour corser le choix, et la note est proportionnelle au nombre de paires justes."
          - type: nouveaute
            title: 'Réponse numérique, avec tolérance et unité'
            detail: "L'étudiant tape un nombre, accepté à un pourcentage près (2 % par défaut) ou à une marge fixe. L'unité s'affiche à côté du champ, ou fait partie de la réponse attendue si vous l'exigez. La virgule française, les espaces des milliers et une unité tapée à la suite du nombre sont compris sans que l'étudiant ait à y penser."
          - type: nouveaute
            title: 'Question calculée : chaque étudiant reçoit ses propres valeurs'
            detail: "L'énoncé porte des variables — « Un train roule à {v} km/h pendant {t} h » — tirées dans les intervalles que vous fixez, et la bonne réponse est donnée par une formule. Deux étudiants côte à côte n'ont donc ni le même énoncé ni la même réponse, et chaque nouvel entraînement rejoue un tirage. La correction rappelle à chacun l'énoncé qu'il avait reçu."
          - type: nouveaute
            title: 'Réponse courte auto-corrigée'
            detail: "L'étudiant tape un mot ou une expression, comparé aux formulations que vous acceptez. Les majuscules et les accents sont pardonnés, et vous pouvez tolérer une faute de frappe ; la correction affiche toutes les formulations acceptées, ce qui aide à repérer celle qu'on avait oubliée."
          - type: nouveaute
            title: 'Créer ces quatre types en collant un document produit par une IA'
            detail: "L'import interactif compte désormais quatre familles, chacune avec son prompt à copier dans Claude et ses exemples prêts à charger. Il refuse les questions qu'aucun étudiant ne pourrait résoudre — une formule qui cite une variable non tirée, une variable absente de l'énoncé, un calcul impossible — et les signale une par une avant création. Chaque famille s'exporte au même format, pour être partagée entre enseignants."
          - type: modification
            title: "L'application mobile passe en 2.2.0"
            detail: "Les quatre nouveaux types se répondent au doigt sur l'application, correction comprise. Nouvelle version à télécharger depuis la page Ressources."
          - type: interne
            title: "Les formules des questions calculées n'exécutent jamais de code"
            detail: "La formule écrite par un enseignant est lue par un analyseur maison qui ne comprend que de l'arithmétique : rien d'autre n'y est exprimable. Les quatre familles d'import partagent par ailleurs un même registre, et la suite de tests passe de 399 à 523."

    - version: '2026.08.11'
      date: '2026-08-11'
      summary: "Les quiz gagnent deux nouveaux types de questions — cliquer la bonne zone d'un texte, d'un code ou d'une image, et placer des étiquettes sur un support — utilisables dans toutes les matières et jouables aussi sur l'application mobile, qui passe en 2.1.0."
      entries:
          - type: nouveaute
            title: 'Deux nouveaux types de questions : zone à cliquer et étiquettes à placer'
            detail: "Le support peut être un texte (cliquer le verbe, la faute d'accord), un code informatique avec lignes numérotées (cliquer la balise qui ferme, le sélecteur) ou une image sur laquelle on dessine les zones (cliquer l'organe, légender le schéma). En entraînement, un bouton Indice éclaire les zones utiles et la correction explique pourquoi chaque zone piégée était fausse ; les étiquettes se notent zone par zone, comme les textes à trous. Comme eux, ces questions sont écartées du tirage d'un concours live."
          - type: nouveaute
            title: 'Créer ces questions en collant un document produit par une IA'
            detail: "Bibliothèque de Quiz > Importer > Import interactif (JSON) : l'écran fournit le prompt à copier dans Claude avec votre support de cours, et trois exemples prêts à charger (balises HTML, règles CSS, grammaire). Tout est vérifié et prévisualisé avant création, et un quiz s'exporte au même format pour être partagé entre enseignants."
          - type: modification
            title: "L'application mobile passe en 2.1.0"
            detail: "Les nouvelles questions se répondent au doigt sur l'app : toucher les zones, poser les étiquettes, avec l'indice et la correction détaillée. Nouvelle version à télécharger depuis la page Ressources."
          - type: nouveaute
            title: "L'accueil étudiant annonce le concours live en cours"
            detail: "Quand un concours de sa classe est ouvert, une bannière en tête du tableau de bord permet de le rejoindre directement."
          - type: nouveaute
            title: "Le modèle de données de l'application"
            detail: "Description technique > Modèle de données : les diagrammes MCD, MLD, MPD et UML générés depuis le code réel, domaine par domaine, avec exports Mocodo, SQL et PlantUML — de quoi travailler la modélisation sur une base réelle."
          - type: interne
            title: "Les vérifications automatiques couvrent les nouveaux types"
            detail: "Analyse statique et tests unitaires sur le découpage des zones, la notation et l'import ; le test d'accès par rôle couvre l'écran d'import."

    - version: '2026.08.10.4'
      date: '2026-08-10'
      summary: "Un quiz lancé peut réunir plusieurs quiz en une seule épreuve et porter l'intitulé de votre choix : les cinq quiz d'une séquence deviennent l'évaluation de fin de séquence."
      entries:
          - type: nouveaute
            title: 'Réunir plusieurs quiz en une seule épreuve'
            detail: "« + Ajouter un quiz » sur l'écran de lancement rassemble autant de quiz que voulu dans un même vivier de questions. Le tirage y puise sans distinguer leur quiz d'origine, et le nombre de questions tirées s'élargit avec le vivier tant que vous ne l'avez pas saisi vous-même. Vaut aussi pour un concours live, qui joue alors les quiz les uns après les autres."
          - type: nouveaute
            title: "Donner un intitulé à un quiz lancé"
            detail: "Facultatif : laissé vide, le nom du quiz est repris comme avant. C'est cet intitulé que voient les étudiants et que portent les résultats, le suivi et le vidéoprojecteur du concours."

    - version: '2026.08.10.3'
      date: '2026-08-10'
      summary: "Les outils de l'enseignant sont regroupés dans le menu Outils, avec un nouvel écran pour suivre les quiz de ses classes. L'application mobile change de nom et d'icône."
      entries:
          - type: nouveaute
            title: 'Quiz par classes'
            detail: "Outils > Suivre les étudiants : tous les quiz lancés sur vos classes sur un seul écran, filtrables par classe et par état — en cours, programmés, terminés — avec le nombre de copies rendues et l'accès aux résultats de chaque étudiant."
          - type: nouveaute
            title: 'Concours live et suivi des recherches rejoignent le menu Outils'
            detail: "Le concours live se lance depuis Outils > Animer la classe, et le suivi des recherches de stage et d'alternance depuis Outils > Suivre les étudiants. Après avoir choisi la classe, le concours live ouvre sur ses concours en cours et passés plutôt que sur le formulaire de création."
          - type: modification
            title: "Le menu d'une classe ne garde que ce que la classe est"
            detail: "Le carnet de notes, le tirage au sort, la création de groupes, les enregistrements audio, les quiz et le suivi des recherches quittent le menu d'une classe : ils sont tous dans Outils, qui demande la classe au moment voulu. Une classe liste ses étudiants, ses enseignants, son emploi du temps, ses calendriers et son paramétrage."
          - type: modification
            title: 'Un message plutôt que « Accès refusé » quand aucune classe ne peut être proposée'
            detail: "Le plus souvent la formation est restée sur sa visibilité par défaut, « Staff + Admin » : le menu invite désormais à contacter un administrateur ou à ouvrir une demande de support."
          - type: modification
            title: 'Destinataires : plusieurs publics cochables au lieu d''un seul'
            detail: "« Tous les enseignants ET tous les personnels » est désormais une seule sélection, et le choix de formations se combine avec les publics larges. Listes d'inscription, annonces et événements d'agenda passent des boutons radio aux cases à cocher."
          - type: modification
            title: 'Le temps par question d''un concours dit ce qu''il fait'
            detail: "Le champ du lancement s'appelle « Temps par défaut par question » : il ne s'applique qu'aux questions réglées sur la valeur du quiz, une question au temps défini garde le sien, une question illimitée reste sans limite."
          - type: fix
            title: 'Une question sans limite de temps est de nouveau jouable en concours'
            detail: "Le décompte partait de zéro : au vidéoprojecteur le compteur restait bloqué, et sur le téléphone des étudiants les boutons de réponse étaient désactivés dès l'affichage de la question. Les deux écrans affichent « ∞ »."
          - type: fix
            title: 'Libellés en double sur les champs de temps des quiz'
            detail: "Les boutons « Défini » et « Illimité » affichaient leur libellé deux fois, dans les paramètres du quiz comme sur une question, et le groupe portait un astérisque par choix au lieu d'un seul."
          - type: autre
            title: 'Application mobile : nouvelle version, nouveau nom, nouvelle icône'
            detail: "L'application s'appelle désormais « Campus Beaupeyrat » sur le téléphone, et son icône affiche l'emblème en grand au lieu d'un petit médaillon perdu au centre. À réinstaller depuis la page Ressources."
          - type: interne
            title: "L'application mobile n'interroge plus le concours live pour un compte enseignant ou administrateur"
            detail: "Chaque ouverture de l'application produisait une erreur serveur, journalisée et annoncée sur Discord."
          - type: interne
            title: 'Le numéro de version est la date de mise en production'
            detail: "Le rang mensuel se lisait comme un jour du mois tant qu'il restait sous 31. Deux versions publiées le même jour sont désormais départagées par leur numéro, sur la page comme dans l'annonce Discord, que dix tests couvrent maintenant."

    - version: '2026.08.10.2'
      date: '2026-08-10'
      summary: "Une fiche technique de l'application pour les étudiants, et le changelog qui se laisse filtrer."
      entries:
          - type: nouveaute
            title: 'Description technique'
            detail: "Ce dont l'application est faite, écrit pour les étudiants de l'établissement : la pile, l'architecture, les patrons de conception avec le fichier où aller les lire, les procédures de test et la chaîne de déploiement. Le découpage suit le référentiel du BTS SIO. Accessible à tous depuis le menu de votre avatar."
          - type: modification
            title: 'Le changelog se filtre par type de changement'
            detail: "Et une colonne dit le rythme du projet : cadence des commits et des mises en production, plus longue série de journées livrées, version la plus fournie."
          - type: modification
            title: "L'aide passe en pleine largeur"
            detail: "Chaque bloc sur une carte, la recherche présente aussi sur la page d'un article, et le vote « cet article vous a-t-il aidé ? » retiré."
          - type: modification
            title: "MonCampus se présente autrement"
            detail: "Une application de gestion de campus à dominante pédagogique, sans s'y limiter — et non l'application de l'établissement, qui la déploie sans la posséder."
          - type: interne
            title: "L'intégration continue ne tourne plus pour rien"
            detail: "Une poussée annule le contrôle encore en cours sur la même branche, et un commit qui ne touche que de la documentation n'en déclenche aucun."
          - type: interne
            title: 'Compteurs de la documentation interne remis à jour et datés'
          - type: interne
            title: 'actions/checkout en version 7 dans les deux chaînes'

    - version: '2026.08.10'
      date: '2026-08-10'
      summary: "Une rubrique d'aide rédigée pour les enseignants et l'administration, et ce changelog."
      entries:
          - type: nouveaute
            title: "Rubrique d'aide"
            detail: "Neuf rubriques, trente-deux articles pas-à-pas, seize questions fréquentes et un glossaire. Accessible depuis le menu de votre avatar. Chaque article est adressé à un public : vous ne voyez que ce qui vous concerne."
          - type: nouveaute
            title: 'Changelog'
            detail: "La page que vous lisez : ce qui est mis en production, version par version."
          - type: modification
            title: "L'aide sait parler deux langues"
            detail: "Un article traduit en anglais garde la même adresse ; les articles non traduits restent lisibles en français."
          - type: interne
            title: "Numéro de version affiché sur la page « À propos »"
          - type: interne
            title: "Règles de branches GitHub et signature des commits"
            detail: "La production n'est plus atteignable que par une pull request dont la CI est verte."
          - type: interne
            title: 'Les mises en production sont annoncées sur Discord'
            detail: "Un message au démarrage, un à la réussite avec le résumé de la version, un à l'échec avec le lien vers le journal."
          - type: interne
            title: "La réussite n'est annoncée qu'une fois l'application revenue"
            detail: "Le déploiement attend que la page de connexion réponde, plutôt que de se fier au retour du script d'installation."

    - version: '2026.08.09'
      date: '2026-08-09'
      summary: "Une journée consacrée à la solidité de l'application : analyse statique, tests automatisés, intégration continue et performances."
      entries:
          - type: nouveaute
            title: "Page « À propos »"
            detail: "L'application est un logiciel libre sous licence AGPL ; cette page porte l'accès au code source qu'exige cette licence."
          - type: nouveaute
            title: 'Alerte des erreurs sur Discord'
            detail: "Une erreur en production est signalée immédiatement, sans attendre qu'un utilisateur la remonte."
          - type: modification
            title: "Le fil d'Ariane commence toujours par Accueil"
          - type: fix
            title: 'Lien de connexion par e-mail : adresse pré-remplie à la réémission'
          - type: fix
            title: 'Cahier de texte : un paragraphe vide ne comptait plus comme du contenu'
          - type: interne
            title: 'Analyse statique PHPStan au niveau 5'
            detail: '112 constats corrigés plutôt que mis de côté ; la baseline reste vide.'
          - type: interne
            title: 'Formatage automatique du code (PHP CS Fixer, jeu de règles Symfony)'
          - type: interne
            title: 'Intégration continue sur GitHub Actions'
            detail: "Rejoue les migrations depuis une base vide, valide le schéma et lance les tests à chaque poussée."
          - type: interne
            title: '162 tests automatisés : un par voter, plus un test de fumée par rôle et par écran'
          - type: interne
            title: 'Contrôleurs Paramètres et UFA éclatés en un contrôleur par onglet'
          - type: interne
            title: 'Performances : index, requêtes N+1 supprimées, polices auto-hébergées, cache des assets'
          - type: interne
            title: 'Licence AGPL-3.0 et fichier NOTICE'

