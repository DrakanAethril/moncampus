# The only figures of the « Description technique » screen that cannot be counted from the deployed
# application: .git/ and tests/ are excluded from the production image (see .dockerignore), so
# neither the history nor the test suite is readable there. Everything else — entities, routes,
# controllers, services, templates, migrations, lines of code — is counted at runtime by
# App\Service\TechnicalProfile, and has no business here.
