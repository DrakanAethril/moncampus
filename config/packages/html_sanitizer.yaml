framework:
    html_sanitizer:
        sanitizers:
            # Message::$body is HugeRTE-authored HTML rendered back to other users (see
            # design/validated/internal-messaging.md). allow_safe_elements covers every element
            # the toolbar in assets/controllers/hugerte_editor_controller.js can produce -
            # including table/thead/tbody/tr/td/th/caption/col/colgroup (table plugin) and h2/h3
            # (extra heading levels), all "safe" per vendor/symfony/html-sanitizer/Reference/
            # W3CReference.php - except the "style" attribute, which the standard marks unsafe on
            # every element. It's added below via allow_attributes rather than allow_elements:
            # allow_elements *replaces* an element's whole allowed-attribute set instead of adding
            # to it, which would silently drop already-safe attributes allow_safe_elements granted
            # (e.g. td/th's colspan/rowspan, needed for the table plugin's merge-cells) - a bug an
            # earlier version of this file had for span, undetected because span has no safe
            # attributes worth losing. allow_attributes adds style wherever the toolbar can put an
            # inline style: span for forecolor, p/h1/h2/h3/li/blockquote for align/indent (both
            # apply as inline text-align/margin, not the legacy align attribute), and
            # table/col/td/th for the table plugin's own width/border/cell-background styling.
            # Anything else (script, event handler attributes, ...) is still dropped by default.
            app.message_body:
                allow_safe_elements: true
                allow_attributes:
                    style: [span, p, h1, h2, h3, li, blockquote, table, col, td, th]

            # SignupList::$description - same HugeRTE toolbar/wiring as Message::$body above, just
            # a different sanitizer instance per App\Controller\SignupListController (each feature
            # gets its own sanitizer target rather than sharing app.message_body across unrelated
            # entities, even though the config happens to be identical today).
            app.signup_list_description:
                allow_safe_elements: true
                allow_attributes:
                    style: [span, p, h1, h2, h3, li, blockquote, table, col, td, th]

            # HelpArticle::$body - the help centre's article pages, written by an admin in the same
            # wide HugeRTE toolbar as app.message_body above, and read back by everyone. Same
            # configuration for the same reason, and its own sanitizer instance per this file's
            # one-sanitizer-per-feature rule. Note the article's h2 headings are what
            # App\Service\HelpArticleOutline turns into "Sur cette page" anchors, so `id` has to
            # survive sanitizing on h2/h3 - it is not a safe attribute by default.
            app.help_article_body:
                allow_safe_elements: true
                allow_attributes:
                    style: [span, p, h1, h2, h3, li, blockquote, table, col, td, th]
                    id: [h2, h3]

            # DocumentationArticle::$body - the documentation base's articles, written in the same
            # wide HugeRTE toolbar as app.message_body above and read by the whole campus. Same
            # configuration, its own sanitizer instance per this file's one-per-feature rule. The
            # article's own headings need no `id` (there is no table of contents: the handoff says
            # a summary, if wanted, is written inside the article), so unlike app.help_article_body
            # this one grants none.
            app.documentation_article_body:
                allow_safe_elements: true
                allow_attributes:
                    style: [span, p, h1, h2, h3, li, blockquote, table, col, td, th]

            # WikiNode::$body - a wiki page, written in the wiki's own editor
            # (assets/controllers/wiki_editor_controller.js) and read back by whoever may reach the
            # wiki. The widest configuration in this file, and the only one that admits any SVG.
            #
            # What it must NEVER gain is iframe/video/embed/object. There is no video in a wiki by
            # decision (design/validated/wiki.md), the `media` plugin is deliberately not vendored,
            # and enforcing that here rather than only in the toolbar is what keeps the element list
            # closed - a toolbar decides what is easy to insert, a sanitizer decides what survives.
            #
            # The SVG subtree is the part that needed real care, and it is enumerated rather than
            # opened: an SVG is a document that can carry script. Excluded on purpose and by name:
            #   - `script`, which is the obvious one;
            #   - `foreignObject`, which embeds arbitrary HTML inside the picture - which is also
            #     why the editor configures Mermaid with htmlLabels:false, so its labels come back
            #     as <text> and nothing is lost by refusing it;
            #   - every `href`/`xlink:href`, so no <use> or <a> inside a diagram can point anywhere;
            #   - every `on*` handler, which the sanitizer drops by default and which no attribute
            #     below re-admits.
            #
            # `style` (the element) IS allowed, and that is a deliberate, bounded concession rather
            # than an oversight: Mermaid emits its diagram's CSS as a <style> block scoped to the
            # diagram's own svg id, and dropping it leaves an unreadable picture. The residual reach
            # is that somebody could hand-write CSS affecting the page they are on - and the people
            # who read a wiki page are the people who may already rewrite it, so it grants no reach
            # they did not have. It is not granted to any other sanitizer in this file.
            app.wiki_page_body:
                allow_safe_elements: true
                allow_elements:
                    # accordion
                    details: []
                    summary: []
                    # Mermaid's rendered output, stored at save time with its source kept in
                    # data-mermaid so the diagram stays editable.
                    svg: ['viewBox', 'width', 'height', 'xmlns', 'class', 'style', 'id', 'preserveAspectRatio', 'role', 'aria-roledescription']
                    g: ['class', 'style', 'transform', 'id']
                    path: ['d', 'class', 'style', 'fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'marker-start', 'marker-end', 'transform', 'id']
                    rect: ['x', 'y', 'width', 'height', 'rx', 'ry', 'class', 'style', 'fill', 'stroke', 'stroke-width', 'transform', 'id']
                    circle: ['cx', 'cy', 'r', 'class', 'style', 'fill', 'stroke', 'stroke-width', 'transform', 'id']
                    ellipse: ['cx', 'cy', 'rx', 'ry', 'class', 'style', 'fill', 'stroke', 'stroke-width', 'transform', 'id']
                    line: ['x1', 'y1', 'x2', 'y2', 'class', 'style', 'stroke', 'stroke-width', 'transform', 'id']
                    polyline: ['points', 'class', 'style', 'fill', 'stroke', 'stroke-width', 'transform', 'id']
                    polygon: ['points', 'class', 'style', 'fill', 'stroke', 'stroke-width', 'transform', 'id']
                    text: ['x', 'y', 'dx', 'dy', 'class', 'style', 'fill', 'text-anchor', 'dominant-baseline', 'font-size', 'font-family', 'font-weight', 'transform', 'id']
                    tspan: ['x', 'y', 'dx', 'dy', 'class', 'style', 'fill']
                    defs: []
                    marker: ['id', 'viewBox', 'refX', 'refY', 'markerWidth', 'markerHeight', 'orient', 'markerUnits', 'class', 'style']
                    style: []
                allow_attributes:
                    style: [span, p, h1, h2, h3, h4, li, blockquote, table, col, td, th, div]
                    # Outline anchors (h2/h3, stamped by App\Service\WikiPageOutline at read time),
                    # named anchors the `anchor` plugin writes, and the ids Mermaid's own markup
                    # carries.
                    id: [h1, h2, h3, h4, a]
                    # codesample's language classes, KaTeX's own markup, and the callout blocks.
                    class: [pre, code, span, div, p, ol, ul, li, table]
                    # KaTeX keeps the LaTeX source next to its rendered output, and Mermaid keeps
                    # its diagram source, so both stay editable rather than becoming one-way output.
                    data-katex: [span, div]
                    data-mermaid: [div]

            # SeanceTemplate::$cahierDeTexteDescription, when it arrives through the séquence import
            # assistant (App\Service\SequenceJsonImporter). It is the one HTML field of the library's
            # three entities, it is rendered `|raw` in library/seance_show.html.twig, and once the
            # séance is instantiated into a program it is read by *students* - so a document a
            # teacher pasted from a conversation with a language model does not reach it unfiltered.
            #
            # No `allow_attributes` here, unlike the sanitizers above: this HTML is not typed in a
            # toolbar, it is produced by App\Util\MarkdownRenderer::toRichHtml() from restricted
            # Markdown, and that function emits no inline style at all. Only what it can emit needs
            # to survive - p, br, ul/li, strong, em, code, pre and the table family - and all of
            # those are safe elements. The format asking for Markdown is not a guarantee of anything;
            # this is.
            app.library_content:
                allow_safe_elements: true

            # User::$signature - a deliberately narrower toolbar than message_body's (see
            # assets/controllers/hugerte_editor_controller.js's signatureValue): bold/italic/
            # underline/link/color only, no lists/blockquote/headings/tables. allow_safe_elements
            # covers bold/italic/link/u already; <u> is re-declared with '*' (all attributes, not
            # just the safe subset) rather than moved to allow_attributes since that's pre-existing,
            # working behavior this change doesn't need to touch. style (forecolor) uses
            # allow_attributes for the same replace-vs-add reason as app.message_body above.
            app.message_signature:
                allow_safe_elements: true
                allow_elements:
                    u: '*'
                allow_attributes:
                    style: [span]
