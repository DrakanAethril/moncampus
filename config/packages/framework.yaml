# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(TRUSTED_PROXIES)%'

    # Note that the session will be started ONLY if you read or write from it.
    # handler_id: null keeps PHP's own native (file-based) session handling, just relocated from
    # php.ini's session.save_path default (usually /tmp, inside the container's own writable
    # layer) to this explicit path. compose.prod.yaml mounts a durable volume there specifically
    # so an active user's session survives frankenphp_prod being rebuilt/recreated on every
    # deploy - without this, every deploy silently logs out every currently-active user mid-
    # navigation (manifests client-side as a confusing DataTables "Invalid JSON response" alert
    # when an ajax call lands on the login page's HTML instead of the expected JSON).
    session:
        handler_id: null
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'

        # Both were PHP's own defaults until now, i.e. nobody had ever decided them. Stated here
        # because they are the two halves of one answer to "how long does staying logged in last",
        # and because the number that was inherited - 1440s, 24 minutes - is far shorter than a
        # single lesson.
        #
        # cookie_lifetime 0 keeps the cookie a browser-session cookie: closing the browser logs
        # out. That is the half worth keeping as it was - on a shared classroom machine it is the
        # only thing that reliably ends a session somebody walked away from.
        #
        # gc_maxlifetime is real idle time now, and is measured against the last *request*, not
        # the last keystroke: a student writing a postulation, a teacher filling a cahier de texte
        # entry or a carnet de notes column sends nothing at all for as long as they type. It used
        # to be propped up by the deployment-notice poll touching the session every 60s, which
        # made the true lifetime "unlimited while the tab is visible, 24 minutes once it is
        # hidden" - not a policy, an accident, and the one that produced the reported logouts.
        # That poll no longer opens a session (App\Controller\DeploymentNoticeController), so this
        # value is now the whole rule. 8 hours is a school day.
        #
        # Note PHP's GC is probabilistic (gc_probability/gc_divisor, 1/1000 by default): a session
        # is *eligible* for collection after this delay, not collected at it.
        cookie_lifetime: 0
        gc_maxlifetime: 28800

    # Switches off the `Link: rel="preload"` HTTP header Symfony adds automatically (WebLink) as a
    # duplicate of the HTML. For each stylesheet of the importmap, AssetMapper ALREADY writes a
    # <link rel="stylesheet"> in <head> *and* registers a WebLink preload for the same URL
    # (ImportMapRenderer::render(), lines 96-104): the resource is therefore announced twice by the
    # same response. The Caddyfile enables `vulcain`, which acts on those headers at the HTTP/2
    # level, hence the Chrome warnings « was preloaded using link preload but not used » — invisible
    # over local HTTP/1.1.
    #
    # Risk-free here: these 4 stylesheets are the only WebLinks the application produces (no Mercure
    # discovery through a Link header — the hub is passed explicitly to the Stimulus controllers via
    # mercurePublicUrl), and the <link rel="stylesheet"> tags stay unchanged, so the cascade order
    # described in assets/app.js does not move.
    web_link:
        enabled: false

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
