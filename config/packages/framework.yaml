# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(TRUSTED_PROXIES)%'

    # Note that the session will be started ONLY if you read or write from it.
    # handler_id: null keeps PHP's own native (file-based) session handling, just relocated from
    # php.ini's session.save_path default (usually /tmp, inside the container's own writable
    # layer) to this explicit path. compose.prod.yaml mounts a durable volume there specifically
    # so an active user's session survives frankenphp_prod being rebuilt/recreated on every
    # deploy - without this, every deploy silently logs out every currently-active user mid-
    # navigation (manifests client-side as a confusing DataTables "Invalid JSON response" alert
    # when an ajax call lands on the login page's HTML instead of the expected JSON).
    session:
        handler_id: null
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'

    # Coupe l'en-tête HTTP `Link: rel="preload"` que Symfony ajoute automatiquement (WebLink) en
    # doublon du HTML. AssetMapper, pour chaque feuille de style de l'importmap, écrit DÉJÀ un
    # <link rel="stylesheet"> dans <head> *et* enregistre un preload WebLink pour la même URL
    # (ImportMapRenderer::render(), lignes 96-104) : la ressource est donc annoncée deux fois par
    # la même réponse. Le Caddyfile active `vulcain`, qui agit sur ces en-têtes au niveau HTTP/2,
    # d'où les avertissements Chrome « was preloaded using link preload but not used » — invisibles
    # en HTTP/1.1 local.
    #
    # Sans risque ici : ces 4 feuilles de style sont les seuls WebLink que l'application produit
    # (aucune découverte Mercure par en-tête Link — le hub est passé explicitement aux contrôleurs
    # Stimulus via mercurePublicUrl), et les <link rel="stylesheet"> restent inchangés, donc
    # l'ordre de cascade décrit dans assets/app.js ne bouge pas.
    web_link:
        enabled: false

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
