framework:
    rate_limiter:
        # Guards the logged-out "lost access" ticket form (see PublicTicketController) - the only
        # unauthenticated write endpoint in this app, so it's the only place a rate limiter is
        # needed today. Keyed by client IP in the controller. 5/hour is generous for a genuine
        # user retrying a typo'd contact address, while still capping abuse from a single source.
        anonymous_ticket:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # Guards the logged-out "send me a magic login link" form (see
        # PublicMagicLoginController) - the same shared factory is consumed twice per request,
        # once keyed "ip:<ip>" and once "email:<contactEmail>" (both must pass), so a single IP
        # can't hammer many addresses and a single address can't be email-bombed from many IPs.
        magic_login_request:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # Guards the Proxmox console's creation wizard (App\Controller\Infrastructure\
        # GuestCreationController), keyed by the administrator's own identifier - unlike the two
        # above, everyone reaching this endpoint is authenticated and named, so there is nothing to
        # gain from keying it by IP.
        #
        # Not there to stop an attacker: the whole area is ROLE_ADMIN and an admin who wanted to
        # fill a hypervisor could do it in Proxmox directly. It is there because this is the one
        # screen in the console that *creates* things, and a loop somewhere - a retried form, a
        # script pointed at the wrong URL - should hit a ceiling rather than a storage quota. Thirty
        # an hour is far above deploying a class's worth of machines by hand and far below anything
        # that could run away.
        proxmox_guest_creation:
            policy: sliding_window
            limit: 30
            interval: '1 hour'

        # Guards dynamic client registration of the Claude connector (App\Controller\OAuth\
        # RegistrationController), keyed by client IP. The specification wants that endpoint open
        # to anybody, and each call writes a row: a claude.ai connection registers once, so twenty
        # an hour from one address is already far beyond any real use.
        oauth_client_registration:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # Guards the sign-in of an external service with its own password (the Claude connector's
        # consent screen, App\Controller\OAuth\AuthorizeController), consumed twice per attempt:
        # keyed "ip:<ip>" and "user:<identifier>", both must pass - so neither one address trying
        # many accounts nor many addresses trying one account can guess a service password.
        external_service_sign_in:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
