monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # Second, independent path for the same records: anything error-and-worse also rings
            # the support Discord channel (App\Monolog\DiscordWebhookHandler), because stderr
            # alone means a 500 is only known when somebody reports it. Same fingers_crossed gate
            # as "main" - Symfony logs a plain 404 at error level, so excluded_http_codes is what
            # keeps scanner bots out of the channel - and a "filter" in between so only the
            # triggering record is posted, not the whole 50-record buffer behind it.
            discord:
                type: fingers_crossed
                action_level: error
                handler: discord_filter
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50
            discord_filter:
                type: filter
                min_level: error
                handler: discord_webhook
            discord_webhook:
                type: service
                id: App\Monolog\DiscordWebhookHandler
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
