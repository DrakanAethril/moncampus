security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Mobile app (moncampus-mobile) login: POST /api/login, LDAP-authenticated (via the same
        # LdapCredentialsVerifier the web firewall below uses) and stateless - see
        # App\Security\ApiLdapAuthenticator. Must come before the "api" firewall since Symfony
        # matches firewalls in order and stops at the first pattern match.
        api_login:
            pattern: ^/api/login
            stateless: true
            # See the "main" firewall below: one deactivation rule, declared on every firewall
            # that authenticates somebody.
            user_checker: App\Security\AccountStatusChecker
            custom_authenticators:
                - App\Security\ApiLdapAuthenticator
        # Every other /api/* route (API Platform resources): stateless, Bearer-JWT-authenticated,
        # issued by api_login above - see config/packages/lexik_jwt_authentication.yaml.
        api:
            pattern: ^/api
            stateless: true
            # A JWT is not a session: this firewall re-loads the user through app_user_provider on
            # every single request, so the checker runs again each time and a token issued before a
            # deactivation stops opening anything at once, without waiting for its expiry.
            user_checker: App\Security\AccountStatusChecker
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider
            # App\Security\AccountStatusChecker refuses a deactivated account
            # (App\Entity\User::$inactiveDate) on every authentication - the login form and the
            # magic link here, POST /api/login and the JWT above. It is deliberately one checker
            # rather than a test inside each authenticator.
            #
            # It does NOT cover a session that is already open: ContextListener refreshes the user
            # without consulting any user checker. App\EventSubscriber\InactiveAccountSubscriber
            # closes that fourth door, delegating the rule itself back to the checker.
            user_checker: App\Security\AccountStatusChecker
            custom_authenticators:
                - App\Security\LdapAuthenticator
                - App\Security\MagicLinkAuthenticator
            logout:
                path: app_logout

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # The deployment banner's two routes. Public because the login screen polls the read one -
        # somebody not yet logged in during a deploy is exactly who needs telling - and because the
        # write one is authenticated by its own shared secret rather than by a session
        # (App\Controller\DeploymentNoticeController): the caller is a GitHub runner, which has no
        # account here and must never be given one.
        - { path: ^/deployment/notice, roles: PUBLIC_ACCESS }
        - { path: ^/locale, roles: PUBLIC_ACCESS }
        # Must come before the generic '^/, roles: ROLE_USER' catch-all below, since #[IsGranted]
        # on the controller alone can't override that - App\Controller\PublicContactEmailController
        # deliberately has no IsGranted precisely so a not-yet-logged-in person confirming a
        # mailed contact-email link (see its docblock) isn't bounced through /login first.
        - { path: ^/profile/contact-email/confirm, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # e-CO runners have no account at all (pseudo + course code, see App\Entity\EcoRunner) -
        # identity for every subsequent call is their own join token, checked manually inside
        # App\Controller\Api\EcoRunnerApiController, not through this firewall/JWT at all. Must
        # come before the generic '^/api, roles: ROLE_USER' catch-all below.
        - { path: ^/api/eco/runner, roles: PUBLIC_ACCESS }
        # Mobile passwordless login (App\Controller\Api\MagicLoginController): asking for a mailed
        # link and trading that link's token for a JWT both happen before there is any JWT to
        # present, so they must sit above the '^/api, roles: ROLE_USER' catch-all - same shape as
        # /api/login above. Both are rate-limited (magic_login_request) and neither reveals whether
        # an address belongs to an account.
        - { path: ^/api/magic-login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
        # Mobile app distribution outside the stores (App\Controller\ResourcesController) - the
        # APK/IPA themselves are plain static files under public/downloads/ that never reach this
        # firewall at all, but the dynamically-generated iOS .plist manifest does go through the
        # kernel and must stay public: it's fetched directly by iOS (via itms-services://), not by
        # a logged-in browser. Only the listing pages that link to these (11a/11b) require login.
        - { path: ^/downloads, roles: PUBLIC_ACCESS }
        # The Proxmox console. Admin-only, and stricter than /settings on purpose: staff have no
        # business starting or stopping a hypervisor's machines. Must sit above the '^/,
        # roles: ROLE_USER' catch-all like every other rule here - a rule placed after it never
        # applies, and #[IsGranted] on the controller cannot tighten what access_control already
        # allowed. This is the whole door: there is no link to /infrastructure anywhere in the
        # menus, so nothing but this line and App\Security\Voter\ProxmoxHostVoter stands between a
        # curious URL and a hypervisor.
        - { path: ^/infrastructure, roles: ROLE_ADMIN }
        - { path: ^/directory, roles: [ROLE_ADMIN, ROLE_STAFF, 'ROLE_STAFF-LEAD'] }
        - { path: ^/settings, roles: [ROLE_ADMIN, ROLE_STAFF, 'ROLE_STAFF-LEAD'] }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
