# The live contest's themes (design/validated/quiz-live-public.md), read by
# App\Service\QuizLive\LiveThemeCatalog. A theme is its entry here plus its stylesheet,
# assets/styles/quiz_live/themes/<slug>.css - tests/Service/QuizLive/LiveThemeCatalogTest.php fails
# when one comes without the other, so adding a theme is these two files and nothing else.
#
# The words are the theme's own, shown on the room's screen and on the phones. Like a serious game's
# vocabulary, they are the theme's content and never translation keys.
#
#   swatches  five colours for the pickers: the ground first, then the accents
#   season    a seasonal theme's moment ('MM-DD', a period may run over the new year): it is offered
#             all year, and marked « De saison » while the date is inside
#   wave      the oscillator of the room's little sounds (Web Audio)
#   confetti  how the podium's confetti are drawn: rect, circle, star, glow, strip, fish
default: pop

themes:
    pop:
        name: Pop
        description: "Le cousin des tournois : encre noire, autocollants penchés, ombres décalées. Chaque écran claque comme un sticker."
        swatches: ['#E9E4FF', '#FFDD3C', '#FF6B6B', '#4D7CFE', '#111111']
        wave: triangle
        confetti: rect
        words: { correct: 'Bien vu !', wrong: 'Raté !', missed: 'Trop tard !', sent: 'Réponse posée', ready: 'Prêts ?', go: 'Go !', lobby: 'On attend les joueurs', voted: 'A voté !' }
    plateau:
        name: Plateau
        description: "Le jeu télé du vendredi soir : nuit violette, projecteurs qui balaient, ampoules et lettres dorées."
        swatches: ['#150A2E', '#F7C548', '#C2185B', '#1E5BD8', '#FFF4DA']
        wave: sine
        confetti: strip
        words: { correct: 'Bonne réponse !', wrong: 'Dommage…', missed: 'Temps écoulé', sent: 'Réponse verrouillée', ready: 'Silence, on joue', go: 'Top !', lobby: 'Le plateau se remplit', voted: 'Vote enregistré' }
    neon:
        name: Néon
        description: "La salle d’arcade : tubes fluo, sol quadrillé qui défile, scanlines. Une série devient un combo."
        swatches: ['#0A0520', '#00E5FF', '#FF2E97', '#FFE600', '#39FF14']
        wave: square
        confetti: glow
        words: { correct: 'Parfait', wrong: 'Raté', missed: 'Time out', sent: 'Envoyé', ready: 'Player ready', go: 'Go!', lobby: 'Insert players', voted: 'Vote OK' }
    manga:
        name: Manga
        description: "Une page de manga : cases, trames, lignes de vitesse, onomatopées. Va de pair avec les avatars manga."
        swatches: ['#FFFDF4', '#0D0D0D', '#FF4D4D', '#2F80ED', '#FFD000']
        wave: triangle
        confetti: star
        words: { correct: 'Juste !', wrong: 'Aïe !', missed: 'Trop tard !', sent: 'Envoyé !', ready: 'Concentration…', go: 'Go !', lobby: 'Les héros arrivent', voted: 'Voté !' }
    gelee:
        name: Gelée
        description: "Bonbons et gélatine : tout est rond, tout rebondit, les boutons s’écrasent sous le doigt. Pour les plus jeunes aussi."
