        words: { correct: 'Youpi !', wrong: 'Oups !', missed: 'Trop tard !', sent: 'C’est envoyé !', ready: 'Attention…', go: 'Go !', lobby: 'On attend les copains', voted: 'Voté !' }
    citrouille:
        name: Citrouille
