---
# The gate between a commit and production. Everything here runs against the dev compose stack -
# the same one a developer runs - because this app has no host-side PHP: every check is a
# `docker compose exec php ...`, exactly as documented in CLAUDE.md.
#
# Deliberately needs no repository secrets. The stack is entirely self-contained (MySQL,
# Mailpit, OpenLDAP, Gotenberg), and the one file it needs that git does not carry -
# .env.dev.local - is generated below from its own tracked template with throwaway values. Only
# deploy.yaml holds secrets, and only because it has to reach the school's network.
name: CI

on:
  push:
    branches:
      - staging
    # Only on the push trigger, never on pull_request: a required status check that is *skipped*
    # never reports, and a PR waiting on it can never be merged. main's ruleset requires this job,
    # so the PR side has to run unconditionally - even for a one-line README change.
    paths-ignore:
      - '**.md'
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read
  # Read by « Recognise a release commit », which asks whether the parent commit's run was green.
  checks: read

# github.head_ref only exists on a pull_request; on a push it is empty, so the fallback is what
# actually groups staging runs. It used to be github.run_id - unique per run, which made every run
# its own group and cancel-in-progress a no-op: three pushes in ten minutes ran three full jobs,
# two of them on code already superseded. github.ref groups them by branch, which is the point.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A release commit - what /beaup-deploy writes on staging before opening the deploy PR - changes
      # config/changelog.yaml and config/tech_profile.yaml and nothing else. Its code is its parent's,
      # which has just passed this job, so running the whole suite again only delayed every deploy by
      # some fifteen minutes, twice over (the push and the PR run on the same commit). When the commit
      # touches those two files alone *and* its parent's Checks run succeeded, every step below that
      # needs the stack is skipped and the two files are checked instead. The job still reports
      # Checks, so main's required status check is satisfied as before.
      #
      # On a pull request the checkout is the merge of the branch into main; its tree must equal the
      # branch head's, or main carries something the parent's run never saw and the suite runs.
      # Anything unexpected - a root commit, an API that does not answer - also means the full run.
      - name: Recognise a release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --quiet --no-tags --depth=2 origin "$HEAD_SHA" || { echo "Cannot fetch $HEAD_SHA: full run."; exit 0; }
          parent=$(git rev-parse --verify --quiet "$HEAD_SHA^1") || { echo "No parent: full run."; exit 0; }
          if [ "$(git rev-parse "$HEAD_SHA^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ]; then
            echo "The merge with main differs from the branch head: full run."; exit 0
          fi
          changed=$(git diff --name-only "$parent" "$HEAD_SHA")
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvxE 'config/(changelog|tech_profile)\.yaml'; then
            echo "Not a release commit: full run."; exit 0
          fi
          green=$(gh api "repos/$GITHUB_REPOSITORY/commits/$parent/check-runs?check_name=Checks" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length') || green=0
          if [ "${green:-0}" -gt 0 ]; then
            echo "Release commit on top of a green $parent: checking the release files only."
            echo "only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release commit, but $parent has no green Checks run: full run."
          fi

      # .env.dev.local is gitignored (it is a credentials-shaped file, even though in dev every
      # value in it is throwaway). Rebuild it from the tracked template and append the values the
      # template leaves blank - appended rather than substituted so that a variable added to the
      # template later is picked up here for free, and last-wins parsing gives it our value.
      - name: Write .env.dev.local
        if: steps.release.outputs.only != 'true'
        run: |
          cp .env.dev.local.example .env.dev.local
          cat >> .env.dev.local <<'ENVFILE'
          MYSQL_ROOT_PASSWORD=ci_root_password
          MYSQL_USER=ci_user
          MYSQL_PASSWORD=ci_password
          MYSQL_DATABASE=beaupeyrat_mgmt
          DATABASE_URL=mysql://ci_user:ci_password@database:3306/beaupeyrat_mgmt?serverVersion=8.0.32&charset=utf8mb4
          MERCURE_PUBLISHER_JWT_KEY=ci_mercure_publisher_key
          MERCURE_SUBSCRIBER_JWT_KEY=ci_mercure_subscriber_key
          MERCURE_JWT_SECRET=ci_mercure_jwt_secret
          LDAP_SEARCH_PASSWORD=ci_ldap_search_password
          LDAP_ADMIN_PASSWORD=ci_ldap_admin_password
          AES_KEY=ci_aes_key_0123456789abcdef0123
          AWS_ACCESS_KEY_ID=ci_unused
          AWS_SECRET_ACCESS_KEY=ci_unused
          AWS_MAIL_ACCESS_KEY_ID=ci_unused
          AWS_MAIL_SECRET_ACCESS_KEY=ci_unused
          ENVFILE

      # frankenphp/ldap/*.ldif is gitignored - the real tree carries real names - and the tracked
      # example is the fictitious stand-in meant for exactly this. Without any .ldif the openldap
      # container never creates its root entry, never reports healthy, and `up --wait` below fails
      # on a service none of these checks even use.
      - name: Seed the dev LDAP tree
        if: steps.release.outputs.only != 'true'
        run: cp frankenphp/ldap/examples/10-tree.example.ldif frankenphp/ldap/10-tree.local.ldif

      - name: Set up Docker Buildx
        if: steps.release.outputs.only != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        if: steps.release.outputs.only != 'true'
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/staging
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

      # phpmyadmin is a human's tool and nothing here talks to it; every other service is either
      # required by the app at boot or cheap enough not to bother excluding.
      #
      # Nothing in this workflow reaches the uploads bucket: the checks below either never touch
      # storage, or run under APP_ENV=test, which swaps it for a directory under var/cache (see
      # config/packages/flysystem.yaml). That is why no S3 stand-in is started and no credentials
      # are needed - the workflow stays secret-free.
      #
      # No composer install step follows on purpose: vendor/ is gitignored, so the checkout has
      # none, and frankenphp/docker-entrypoint.sh runs `composer install` itself when it finds the
      # directory empty. `--wait` therefore already returns with dependencies in place.
      #
      # COMPOSER_AUTH is that install's only reason to need anything from outside: it authenticates
      # the dist downloads, which otherwise hit api.github.com anonymously under a rate limit shared
      # by every runner on the same IP. This is not a repository secret and does not break the
      # workflow's self-contained rule - GITHUB_TOKEN is minted per run by Actions itself, and
      # `permissions: contents: read` above is all a public zipball needs. It is only read by
      # compose.override.yaml's php service, so it is set on this step rather than on the job.
      - name: Start services
        if: steps.release.outputs.only != 'true'
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: docker compose up --wait --no-build --scale phpmyadmin=0

      # The stack answering at all is itself a check - it is what catches a service that no longer
      # boots. A redirect to /login is the expected answer for an anonymous request.
      - name: Check HTTP reachability
        if: steps.release.outputs.only != 'true'
        run: curl -v --fail-with-body http://localhost

      # --- Checks that need no database ------------------------------------------------------

      - name: Coding standard
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T php composer cs-check

      - name: Lint YAML
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T php bin/console lint:yaml config translations

      - name: Lint Twig
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T php bin/console lint:twig templates

      # Catches a service that is declared but cannot actually be constructed - a wrong argument
      # type, a removed class still referenced, an env var nothing provides.
      - name: Lint the service container
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T php bin/console lint:container

      # PHPStan reads the compiled dev container to resolve service ids, so it needs the cache
      # warmed rather than whatever the first HTTP request happened to build.
      - name: Warm the dev cache
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T php bin/console cache:warmup

      - name: Static analysis
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T php composer phpstan

      # --- Checks that need a database -------------------------------------------------------

      # TEST_TOKEN is what config/packages/doctrine.yaml appends to the `_test` suffix, so this
      # lands on `<database>_test<TOKEN>`. Nothing on a CI runner needs the isolation, but it
      # means a developer can replay this whole sequence locally without touching their own
      # `_test` database - which is the only way anyone will debug a red run.
      - name: Create the test database
        if: steps.release.outputs.only != 'true'
        run: |
          docker compose exec -T database sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
            CREATE DATABASE IF NOT EXISTS beaupeyrat_mgmt_testci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON \`beaupeyrat\\_mgmt\\_test%\`.* TO \"$MYSQL_USER\"@\"%\"; FLUSH PRIVILEGES;"'

      # The point of replaying the whole history onto an empty database rather than running
      # doctrine:schema:create: it proves the migrations themselves still work, which is the one
      # thing production actually runs and the one thing nobody exercises by hand.
      - name: Run migrations from scratch
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T -e APP_ENV=test -e TEST_TOKEN=ci php bin/console doctrine:migrations:migrate --no-interaction

      # And this proves the schema those migrations produced is the schema the entities expect.
      # A migration someone forgot to write shows up here, before it reaches production.
      - name: Validate the schema against the mapping
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T -e APP_ENV=test -e TEST_TOKEN=ci php bin/console doctrine:schema:validate

      # ParaTest runs the suite in 4 processes - the runner's 4 cores - where bin/phpunit took 8 to 9
      # minutes alone. Each process opens its own database, `<database>_test<N>` (TEST_TOKEN, set by
      # ParaTest, is appended by config/packages/doctrine.yaml), copied from the database the
      # migrations were just replayed into, rows included: the tests still run on exactly what the
      # migrations produced. The test cache is warmed first, or the processes would all compile the
      # container into the same directory at once.
      #
      # More processes would not help: tests are handed out by file, and RoleAccessSmokeTest alone
      # is a quarter of the suite's time.
      - name: Prepare the parallel test databases
        if: steps.release.outputs.only != 'true'
        run: |
          docker compose exec -T -e APP_ENV=test -e TEST_TOKEN=ci php bin/console cache:warmup
          docker compose exec -T -e APP_ENV=test -e TEST_TOKEN=ci php bin/console app:test:parallel-databases --processes=4

      - name: Run PHPUnit
        if: steps.release.outputs.only != 'true'
        run: docker compose exec -T -e APP_ENV=test php vendor/bin/paratest --processes=4

      # The release announcer is the one piece of logic here that runs nowhere but in the deploy
      # workflow. On 2026-08-10 it named the wrong release in a public Discord message, and nothing
      # would have caught it: no lint, no test, no run outside production. Now it has both.
      - name: Test the release announcer
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # Stricter than the application, which drops a line it cannot read rather than break the
      # page. On a release commit this is the check that stands in for the suite.
      - name: Check the release files
        run: python3 .github/scripts/release_files.py

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200
