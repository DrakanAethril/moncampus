---
# Production environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    env_file:
      - .env.prod.local
    environment:
      # Hardcoded, not `${APP_ENV:-prod}` - that pattern silently picks up a stray APP_ENV=dev
      # from whatever shell happens to invoke `docker compose up` (e.g. left exported from local
      # testing), overriding even the Dockerfile's `ENV APP_ENV=prod` - which loads
      # symfony/debug-bundle (config/bundles.php's 'dev' => true scope), a require-dev package
      # this image's `composer install --no-dev` never installed, crash-looping the container.
      # This overlay's entire purpose is to mean prod - it must never be configurable.
      APP_ENV: prod

      # PHP thread pool and worker count, capped explicitly rather than left to FrankenPHP's
      # default of `2 * nproc + 1` (measured, not quoted: the 10-core dev machine logs
      # "FrankenPHP started {num_threads: 21}"). On the production host - 8 cores, 3.83 GiB total,
      # `MemTotal: 4014300 kB` - that default means 17 PHP threads, and every thread can grow to
      # the 256M memory_limit that frankenphp/conf.d/20-app.prod.ini has to set for opcache.preload
      # to survive a worker start. 17 x 256M is 4.35 GiB of ceiling on a 3.83 GiB machine: nothing
      # bounds it below the physical limit, so a handful of concurrent heavy requests (Livret PDF
      # export, EDT import) is arbitrated by the OOM killer rather than by configuration.
      #
      # 8 workers puts that ceiling at 256M (the shared OPcache, which threads do NOT each pay for)
      # plus 8 x 256M, i.e. ~2.3 GiB, leaving room for the OS and the gotenberg service alongside.
      # MySQL is not on this host, so it needs no share of it. Throughput is not the constraint
      # here: 8 workers serving ~100-150 ms requests is 50+ req/s, well above anything a school's
      # browsing pattern produces.
      #
      # num_threads sits above the worker count on purpose - FrankenPHP needs threads left over for
      # anything not handled by the worker script, and the reserve costs nothing while idle.
      #
      # Deliberately here and not in .env, unlike most Caddy tuning (docs/options.md): .env is
      # shared with dev, where the frankenphp_dev image sets FRANKENPHP_WORKER_CONFIG=watch for hot
      # reload, and a value there would silently replace it. Same reasoning that keeps APP_ENV
      # above in this file.
      FRANKENPHP_CONFIG: num_threads 12
      FRANKENPHP_WORKER_CONFIG: num 8
    volumes:
      # LDAPS certificate verification (App\Service\LdapAdapterFactory, LDAP_TLS_CA_CERT_PATH in
      # .env.prod.local must point at this same in-container path) - ldap-ca.pem is a public CA
      # certificate (not a secret), committed at the repo root - see docs/production.md.
      - ./ldap-ca.pem:/etc/moncampus/ldap-ca.pem:ro
      # PHP session files (config/packages/framework.yaml's save_path) - a named volume, not part
      # of the app image, so logged-in users' sessions survive this container being rebuilt from
      # scratch on every deploy instead of everyone getting silently logged out mid-navigation.
      - php_sessions:/app/var/sessions
      # Lexik JWT keypair (App\Security\ApiLdapAuthenticator's token signing, used by the mobile
      # apps' POST /api/login - never by web session login) - JWT_SECRET_KEY/JWT_PUBLIC_KEY
      # (.env) point at %kernel.project_dir%/config/jwt/{private,public}.pem. That path is
      # gitignored (config/jwt/*.pem) and per-environment, same reasoning as ldap-ca.pem needing
      # a host bind-mount: without one, a keypair generated inside a running container
      # (`bin/console lexik:jwt:generate-keypair`) only lives in that container's writable layer
      # and is lost on the next deploy's rebuild - see docs/production.md for the one-time
      # generation step this expects at $DEPLOY_PATH/config/jwt/ on the host. Read-write, not
      # `:ro` - that command itself writes private.pem/public.pem into this same mounted path
      # (via a temp-file-then-rename, which fails outright on a read-only mount), and it's the
      # documented way to (re)generate the keypair, not just to read it afterwards.
      - ./config/jwt:/app/config/jwt

  # Virus scanning for every upload on the platform (App\Service\AntivirusScanner), reached over
  # clamd's TCP socket at the ANTIVIRUS_DSN set in .env.prod.local (clamav://clamav:3310).
  #
  # **In this overlay and not in compose.yaml on purpose.** Anything added to the base file is on
  # CI's boot path, and this repository has already been bitten once by a compose service that took
  # too long to report healthy ("php-1 is unhealthy"). ClamAV downloads a few hundred megabytes of
  # signatures on first start and holds roughly 1.5 GB of RAM - the production host must have it,
  # and CI must not pay for it. Dev gets the opt-in `--profile antivirus` service in
  # compose.override.yaml instead.
  #
  # The signature database lives in a named volume so a redeploy does not re-download it, which is
  # what would otherwise leave every upload refused (fail-closed) for the minutes freshclam takes.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 10s
      # Generous on purpose: the first start has a signature database to fetch, and an unhealthy
      # clamav must not be read as a broken deploy.
      retries: 20
      start_period: 300s

volumes:
  php_sessions:
  clamav_db:
