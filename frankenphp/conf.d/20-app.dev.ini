; See https://docs.docker.com/desktop/features/networking/networking-how-tos/#connect-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`
; Add `start_with_request=yes` to start debug session on each request
xdebug.client_host = host.docker.internal

; php.ini-development leaves this at 128M, which this app has outgrown for anything that compiles
; the whole container at once - the same growth that forced 20-app.prod.ini's own bump. In dev it
; bites on `bin/console cache:warmup --env=prod` (a plain OOM, but reported as the context-free
; "zend_mm_heap corrupted") and on the functional tests, whose test kernel costs ~190M to build on
; its own. Higher than prod's 256M on purpose: Xdebug adds its own overhead per frame, and a dev
; machine has no worker-per-core budget to protect. phpunit.dist.xml sets its own ceiling too, so
; the test suite stays runnable on a machine that never rebuilt this image.
;
; 1G since 2026-11-05: the container's first start runs composer's auto-scripts on an empty cache,
; and that cold `cache:clear` - Xdebug in `develop` mode, every Twig template compiled in one
; process - had crept up to the 512M line (measured: passing at 512M on one commit, failing on the
; next, passing again at 560M). An OOM there is silent where it hurts: `importmap:install`, the next
; script, never runs, assets/vendor stays empty, and every page of the CI run dies on « The
; "@hotwired/stimulus" vendor asset is missing ».
memory_limit = 1G
