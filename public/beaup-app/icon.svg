<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>beaup-app</title>
  <!-- beaup-app's mark, « Progression »: the Institution's emblem (emblem-white.png, cut from the
       high-definition badge) inside a gold ring three quarters full, open at the bottom - the
       training that moves on, a cousin of e-CO's compass. The emblem is the Institution's, excluded
       from the licence (NOTICE). This is the "any" icon: rounded corners, transparent outside. -->
  <rect width="512" height="512" rx="112" fill="#1B6BA8"/>
  <g fill="none" stroke-width="22">
    <circle cx="256" cy="256" r="176" stroke="#ffffff" stroke-opacity=".22"/>
    <circle cx="256" cy="256" r="176" stroke="#c9a04e" stroke-linecap="round" stroke-dasharray="829.4 1105.8" transform="rotate(135 256 256)"/>
  </g>
  <image href="emblem-white.png" x="169.54" y="144" width="172.92" height="224"/>
</svg>
